    async function renderizarPaginaVisualizador(viewerId, pdfId) {
      const container = document.querySelector(`[data-viewerid="${viewerId}"]`);
      if (!container) return;
      try {
        const blob = await obterPdfDoDb(pdfId);
        if (!blob) return;

        const fileReader = new FileReader();
        fileReader.onload = function () {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.getDocument(typedarray).promise.then(pdf => {
            const pageNum = parseInt(container.dataset.currentPage) || 1;
            container.querySelector('.page-count-card').innerText = pdf.numPages;

            pdf.getPage(pageNum).then(page => {
              const canvasEl = container.querySelector('.pdf-viewer-canvas');
              if (!canvasEl) return;

              const context = canvasEl.getContext('2d');
              const cardBodyWidth = canvasEl.parentElement.clientWidth || 400;
              const unscaledViewport = page.getViewport({ scale: 1.0 });
              
              let scale = (cardBodyWidth - 20) / unscaledViewport.width;
              if (scale > 2.0) scale = 2.0; 

              const viewport = page.getViewport({ scale: scale });
              const dpr = window.devicePixelRatio || 1;
              
              canvasEl.width = viewport.width * dpr;
              canvasEl.height = viewport.height * dpr;
              canvasEl.style.width = `${viewport.width}px`;
              canvasEl.style.height = `${viewport.height}px`;

              context.setTransform(dpr, 0, 0, dpr, 0, 0);
              const renderContext = { canvasContext: context, viewport: viewport };
              page.render(renderContext).promise.then(() => {
                const inputEl = container.querySelector('.page-input-card');
                if (inputEl) inputEl.value = pageNum;
                salvarEstadoNoStorage();
              });
            });
          }).catch(err => console.error("Erro ao renderizar PDF:", err));
        };
        fileReader.readAsArrayBuffer(blob);
      } catch (error) {
        console.error('Falha ao carregar PDF:', error);
      }
    }

    window.mudarPaginaCard = function(viewerId, delta) {
      const container = document.querySelector(`[data-viewerid="${viewerId}"]`);
      if (!container) return;
      let currentPage = parseInt(container.dataset.currentPage) || 1;
      const totalPages = parseInt(container.querySelector('.page-count-card').innerText) || 1;

      currentPage += delta;
      if (currentPage < 1) currentPage = 1;
      if (currentPage > totalPages) currentPage = totalPages;

      container.dataset.currentPage = currentPage;
      const pdfId = container.dataset.pdfsourceid;
      renderizarPaginaVisualizador(viewerId, pdfId);
    }

    window.irParaPaginaCard = function(viewerId, valor) {
      const container = document.querySelector(`[data-viewerid="${viewerId}"]`);
      if (!container) return;
      const totalPages = parseInt(container.querySelector('.page-count-card').innerText) || 1;
      let targetPage = parseInt(valor) || 1;

      if (targetPage < 1) targetPage = 1;
      if (targetPage > totalPages) targetPage = totalPages;

      container.dataset.currentPage = targetPage;
      const inputEl = container.querySelector('.page-input-card');
      if (inputEl) inputEl.value = targetPage;

      const pdfId = container.dataset.pdfsourceid;
      renderizarPaginaVisualizador(viewerId, pdfId);
    }

    // Cria o card base e conecta seleção, arraste e redimensionamento.
    function createCard(fileType, filename, bodyContent, customWidth = 280, savedProps = null) {
      const card = document.createElement('div');
      card.className = `codex-card absolute bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-lg dark:shadow-2xl z-10 hover:border-slate-400 dark:hover:border-slate-600 overflow-hidden flex flex-col transform-none transition-shadow duration-150`;

      card.dataset.filetype = fileType;
      card.dataset.filename = filename;
      card.dataset.boardUndoId = `card-${Date.now()}-${Math.random().toString(36).slice(2)}`;

      const finalWidth = customWidth;
      const finalHeight = savedProps && savedProps.height ? parseFloat(savedProps.height) : 280;

      if (savedProps) {
        card.style.width = savedProps.width;
        card.style.height = savedProps.height;
        card.style.left = savedProps.left;
        card.style.top = savedProps.top;
        if (savedProps.groupId) {
          card.dataset.groupId = savedProps.groupId;
          setTimeout(() => adicionarIndicadorGrupo(card), 50);
        }
      } 
      else {
        card.style.width = `${finalWidth}px`;
        card.style.height = `${finalHeight}px`;
        const totalCards = document.querySelectorAll('.codex-card').length;
        const spacingX = 24; const spacingY = 24;
        const cardsPerLine = Math.floor(1200 / (finalWidth + spacingX));
        const col = totalCards % cardsPerLine;
        const row = Math.floor(totalCards / cardsPerLine);
        const startX = Math.abs(panX) / zoom + 320 + col * (finalWidth + spacingX);
        const startY = Math.abs(panY) / zoom + 60 + row * (finalHeight + spacingY);
        card.style.left = `${startX}px`;
        card.style.top = `${startY}px`;
      }

      card.style.minWidth = `230px`;
      card.style.minHeight = `160px`;

      card.innerHTML = `
        <div class="card-header px-4 py-3 border-b border-slate-100 dark:border-slate-800/60 flex justify-between items-center font-bold text-xs rounded-t-2xl select-none shrink-0 cursor-move">
          <div class="flex items-center gap-2 w-full max-w-[85%]">
            <span class="px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-500 text-[10px] tracking-wide uppercase shrink-0 pointer-events-none">${fileType}</span>
            <input type="text" value="${escapeHTML(filename || '')}" onchange="this.closest('.codex-card').dataset.filename = this.value; salvarEstadoNoStorage();" class="bg-transparent border border-transparent hover:border-slate-200 dark:hover:border-slate-700 focus:border-amber-500 focus:bg-white dark:focus:bg-slate-800 rounded px-1 text-slate-600 dark:text-slate-300 font-bold text-xs truncate w-full cursor-text transition-all outline-none pointer-events-auto" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();" title="Renomear Card">
          </div>
          <button onclick="excluirCard(this)" class="text-slate-400 hover:text-rose-500 font-bold text-sm px-1.5 py-0.5 rounded transition-colors pointer-events-auto" title="Excluir Card">&times;</button>
        </div>
        <div class="flex-1 overflow-hidden rounded-b-2xl card-body-holder">
          ${bodyContent}
        </div>
        <div class="resize-handle"></div>`;

      if (fileType === 'FOLDERS') bindFolderCardInteractions(card);

      const header = card.querySelector('.card-header');
      header.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return; 
        if (card.classList.contains('card-fullscreen')) return; 
        
        document.querySelectorAll('.codex-card').forEach(c => {
          if(!c.classList.contains('selected-card')) c.style.zIndex = 10;
        });
        card.style.zIndex = 50;

        const isSelected = card.classList.contains('selected-card');
        const isMultiSelectIntent = e.ctrlKey || e.shiftKey || multiSelectMode;

        if (isMultiSelectIntent) {
          if (isSelected) {
            card.classList.remove('ring-4', 'ring-indigo-500', 'dark:ring-indigo-400', 'selected-card');
          } else {
            card.classList.add('ring-4', 'ring-indigo-500', 'dark:ring-indigo-400', 'selected-card');
          }
        } else {
          if (!isSelected) {
            document.querySelectorAll('.selected-card').forEach(c => {
              c.classList.remove('ring-4', 'ring-indigo-500', 'dark:ring-indigo-400', 'selected-card');
            });
            card.classList.add('ring-4', 'ring-indigo-500', 'dark:ring-indigo-400', 'selected-card');
          }
        }
        atualizarToolbarSelecao();
      });

      canvas.appendChild(card);
      applyInteract(card); 
      if (!savedProps) salvarEstadoNoStorage();
      return card;
    }

    function toggleMultiSelectMode() {
      multiSelectMode = !multiSelectMode;
      const button = document.getElementById('multi-select-toggle');
      if (!button) return;
      if (multiSelectMode) {
        button.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
        button.classList.add('bg-amber-500', 'text-white');
        button.setAttribute('title', 'Modo de multiseleção ativo');
      } else {
        button.classList.add('bg-slate-100', 'dark:bg-slate-800', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
        button.classList.remove('bg-amber-500', 'text-white');
        button.setAttribute('title', 'Modo de multiseleção');
      }
    }

    window.excluirCard = function(button) {
      const card = button.closest('.codex-card');
      if (card) {
        // Salva no histórico antes de deletar
        adicionarAoHistoricoDeleted(card.cloneNode(true));
        
        const viewerEl = card.querySelector('[data-viewerid]');
        if (viewerEl && viewerEl.dataset.pdfsourceid) removerPdfDoDb(viewerEl.dataset.pdfsourceid);
        const videoEl = card.querySelector('[data-mediasourceid]');
        if (videoEl && videoEl.dataset.mediasourceid) removerMediaDoDb(videoEl.dataset.mediasourceid);
        card.remove();
        atualizarToolbarSelecao();
        salvarEstadoNoStorage();
      }
    }

    function applyInteract(element) {
      interact(element)
        .draggable({
          allowFrom: '.card-header', 
          inertia: false,
          listeners: {
            start(event) {
              if (forcePanMode) return; 
              if (event.target.classList.contains('card-fullscreen')) return; 
              document.querySelectorAll('.codex-card').forEach(c => {
                if(!c.classList.contains('selected-card')) c.style.zIndex = 10;
              });
              event.target.style.zIndex = 50;
              document.body.classList.add('dragging-active');
            },
            move(event) {
              if (forcePanMode) return; 
              const target = event.target;
              if (target.classList.contains('card-fullscreen')) return;
              
              const dx = event.dx / zoom; 
              const dy = event.dy / zoom;
              const cardsParaMover = new Set();
              
              if (target.classList.contains('selected-card')) {
                document.querySelectorAll('.selected-card').forEach(c => cardsParaMover.add(c));
              } else {
                cardsParaMover.add(target);
              }

              const gruposAdicionados = new Set();
              cardsParaMover.forEach(card => {
                if (card.dataset.groupId && !gruposAdicionados.has(card.dataset.groupId)) {
                  gruposAdicionados.add(card.dataset.groupId);
                  document.querySelectorAll(`[data-group-id="${card.dataset.groupId}"]`).forEach(c => cardsParaMover.add(c));
                }
              });
              
              cardsParaMover.forEach(card => {
                const currentLeft = parseFloat(card.style.left) || 0;
                const currentTop = parseFloat(card.style.top) || 0;
                card.style.left = `${currentLeft + dx}px`;
                card.style.top = `${currentTop + dy}px`;
              });
            },
            end() {
              document.body.classList.remove('dragging-active');
              salvarEstadoNoStorage();
            }
          }
        })
        .resizable({
          edges: { right: true, bottom: true }, 
          listeners: {
            start(event) { 
              if (forcePanMode) return; 
              if (event.target.classList.contains('card-fullscreen')) return;
              document.body.classList.add('dragging-active'); 
            },
            move(event) {
              if (forcePanMode) return; 
              const target = event.target;
              if (target.classList.contains('card-fullscreen')) return;
              const dw = event.edges.right * (event.dx / zoom);
              const dh = event.edges.bottom * (event.dy / zoom);
              const cardsParaRedimensionar = new Set();
              
              if (target.classList.contains('selected-card')) {
                document.querySelectorAll('.selected-card').forEach(c => cardsParaRedimensionar.add(c));
              } else {
                cardsParaRedimensionar.add(target);
              }

              const gruposAdicionados = new Set();
              cardsParaRedimensionar.forEach(card => {
                if (card.dataset.groupId && !gruposAdicionados.has(card.dataset.groupId)) {
                  gruposAdicionados.add(card.dataset.groupId);
                  document.querySelectorAll(`[data-group-id="${card.dataset.groupId}"]`).forEach(c => cardsParaRedimensionar.add(c));
                }
              });

              cardsParaRedimensionar.forEach(card => {
                const currentWidth = parseFloat(card.style.width) || 230;
                const currentHeight = parseFloat(card.style.height) || 160;
                card.style.width = `${Math.max(230, currentWidth + dw)}px`;
                card.style.height = `${Math.max(160, currentHeight + dh)}px`;
              });
            },
            end() {
              document.body.classList.remove('dragging-active');
              salvarEstadoNoStorage();
            }
          },
          modifiers: [
            interact.modifiers.restrictSize({ min: { width: 230, height: 160 } }) 
          ]
        });
    }

    // Lê a área de transferência e encaminha arquivos ou texto para o quadro.
    async function colarLinkManual() {
      try {
        if (navigator.clipboard.read) {
          const clipboardItems = await navigator.clipboard.read();
          const files = [];
          let pastedText = '';
          for (const item of clipboardItems) {
            for (const type of item.types) {
              if (type === 'text/plain') {
                pastedText = await (await item.getType(type)).text();
              } else if (type !== 'text/html' && !type.startsWith('text/')) {
                const blob = await item.getType(type);
                const extension = type.split('/')[1]?.replace(/[^a-z0-9]/gi, '') || 'bin';
                files.push({ file: new File([blob], `arquivo-colado-${files.length + 1}.${extension}`, { type }), path: `arquivo-colado-${files.length + 1}.${extension}` });
              }
            }
          }
          if (files.length) {
            await createFolderCard('Itens colados', files);
            return;
          }
          if (pastedText.trim()) { tratarLinkColado(pastedText.trim()); return; }
        }
        const pastedText = await navigator.clipboard.readText();
        if (pastedText.trim()) tratarLinkColado(pastedText.trim());
        else alert('A área de transferência não contém arquivos ou texto compatível.');
      } catch (err) {
        const urlManual = prompt("Cole ou digite a URL do link aqui:");
        if (urlManual) tratarLinkColado(urlManual.trim());
      }
    }

    // Converte URLs coladas em cards de PDF, mídia ou central de links.
    function tratarLinkColado(pastedText) {
      if (pastedText.startsWith('http://') || pastedText.startsWith('https://')) {
        let finalUrl = pastedText;
        let isDriveFile = false;
        let nomeArquivo = "Documento.pdf";

        if (pastedText.includes('drive.google.com') && pastedText.includes('/file/d/')) {
          isDriveFile = true;
          const partesUrl = pastedText.split('/file/d/');
          if (partesUrl[1]) {
            const fileId = partesUrl[1].split('/')[0];
            finalUrl = `https://drive.google.com/file/d/${fileId}/preview`;
            nomeArquivo = "Google Drive PDF";
          }
        }

        const urlSemQuery = pastedText.split('?')[0];
        const urlLower = urlSemQuery.toLowerCase();
        nomeArquivo = urlSemQuery.substring(urlSemQuery.lastIndexOf('/') + 1) || "Arquivo Web";

        if (isDriveFile || urlLower.endsWith('.pdf')) {
          if (!isDriveFile) nomeArquivo = urlSemQuery.substring(urlSemQuery.lastIndexOf('/') + 1) || "Documento.pdf";
          
          const bodyHtml = `
            <div class="w-full h-full bg-slate-900 flex flex-col relative select-none">
              <div class="flex-1 overflow-hidden bg-slate-950 pointer-events-auto" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
                <iframe src="${finalUrl}" class="w-full h-full border-0" title="${nomeArquivo}" allow="autoplay"></iframe>
              </div>
            </div>`;
          
          const customWidth = window.innerWidth > 800 ? 550 : 340;
          createCard(isDriveFile ? 'DRIVE PDF' : 'PDF', nomeArquivo, bodyHtml, customWidth, null);
        } 
        else if (/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(urlLower)) {
          const ext = urlLower.split('.').pop().toUpperCase();
          const bodyHtml = `<div class="bg-slate-100 dark:bg-slate-950 overflow-hidden h-full flex items-center justify-center cursor-pointer" onclick="openModal('${nomeArquivo}', '<img src=\\'${pastedText}\\' class=\\'max-w-full max-h-[75vh] mx-auto object-contain\\'>')">
                              <img src="${pastedText}" alt="${nomeArquivo}" class="w-full h-full object-contain">
                            </div>`;
          createCard(ext, nomeArquivo, bodyHtml, 320);
        }
        else if (/\.(mp4|webm|ogg|mov)$/i.test(urlLower)) {
          const ext = urlLower.split('.').pop().toUpperCase();
          const bodyHtml = `<div class="w-full h-full bg-slate-950 flex items-center justify-center" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
                              <video src="${pastedText}" controls class="w-full h-full object-contain pointer-events-auto"></video>
                            </div>`;
          createCard(ext, nomeArquivo, bodyHtml, 360);
        }
        else if (/\.(mp3|wav|ogg|m4a|flac)$/i.test(urlLower)) {
          const ext = urlLower.split('.').pop().toUpperCase();
          const bodyHtml = `<div class="p-4 bg-slate-50 dark:bg-slate-950 h-full flex flex-col justify-center items-center gap-2" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
                              <span class="text-[2rem]">🎵</span>
                              <audio src="${pastedText}" controls class="w-full pointer-events-auto"></audio>
                            </div>`;
          createCard(ext, nomeArquivo, bodyHtml, 300);
        }
        else if (urlLower.endsWith('.txt') || urlLower.endsWith('.md')) {
          const ext = urlLower.split('.').pop().toUpperCase();
          const targetLeft = mouseXCanvas || (Math.abs(panX) / zoom + 350);
          const targetTop = mouseYCanvas || (Math.abs(panY) / zoom + 150);
          
          fetch(pastedText)
            .then(res => res.text())
            .then(text => {
              const bodyHtml = `<div class="p-4 text-sm h-full overflow-y-auto text-slate-700 dark:text-slate-300 font-mono bg-slate-50/50 dark:bg-slate-950/50 whitespace-pre-wrap" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">${escapeHTML(text)}</div>`;
              const props = { width: '290px', height: '280px', left: `${targetLeft}px`, top: `${targetTop}px` };
              createCard(ext, nomeArquivo, bodyHtml, 290, props);
              salvarEstadoNoStorage();
            })
            .catch(err => { processLinkCard(pastedText, 'Erro de Carregamento'); });
          return;
        } 
        else {
          processLinkCard(pastedText, '');
        }

        const cards = document.querySelectorAll('.codex-card');
        const lastCard = cards[cards.length - 1];
        if (lastCard) {
          lastCard.style.left = `${mouseXCanvas || (Math.abs(panX) / zoom + 350)}px`;
          lastCard.style.top = `${mouseYCanvas || (Math.abs(panY) / zoom + 150)}px`;
          salvarEstadoNoStorage();
        }
      } else {
        alert("Link inválido.");
      }
    }

    let timerSalvamento = null;
    let restoringBoardState = false;
    window.agendarSalvamento = function() {
      clearTimeout(timerSalvamento);
      timerSalvamento = setTimeout(() => {
        salvarEstadoNoStorage();
      }, 1500); 
    };

    // Serializa o quadro inteiro para restaurar cards após atualizar a página.
    function salvarEstadoNoStorage() {
      if (restoringBoardState) return Promise.resolve(false);
      const cardsData = [];
      document.querySelectorAll('.codex-card').forEach(card => {
        card.querySelectorAll('input[type="text"]').forEach(input => {
          input.setAttribute('value', input.value);
        });

        const viewerEl = card.querySelector('[data-viewerid]');
        const videoEl = card.querySelector('[data-mediasourceid]');
        const isNOTAS = card.dataset.filetype === 'NOTAS';
        const iframeEl = card.querySelector('iframe');
        const tldrawHost = card.querySelector('.tldraw-host');
        const bodyHolder = card.querySelector('.card-body-holder');
        const noteUrl = iframeEl ? iframeEl.getAttribute('src') : (card.dataset.noteUrl || 'https://www.tldraw.com/');
        const stickyTextarea = card.querySelector('.sticky-note-textarea');
        
        let savedCurrentPage = 1;
        let savedPdfSourceId = "";
        let savedMediaSourceId = "";
        let savedPagesArray = [];
        let savedBodyContent = (viewerEl || videoEl) ? "" : (bodyHolder ? bodyHolder.innerHTML : "");

        if (viewerEl) {
          savedCurrentPage = parseInt(viewerEl.dataset.currentPage) || 1;
          savedPdfSourceId = viewerEl.dataset.pdfsourceid || "";
        }
        if (videoEl) {
          savedMediaSourceId = videoEl.dataset.mediasourceid || "";
        }
        if (isNOTAS && tldrawHost) {
          savedBodyContent = '';
        } else if (isNOTAS) {
          if (iframeEl) {
            savedBodyContent = bodyHolder ? bodyHolder.innerHTML : "";
          } else {
            const drawCanvases = card.querySelectorAll('.drawing-canvas');
            drawCanvases.forEach(canvas => {
              if (!canvas.dataset.cachedData || canvas.dataset.isDirty === "true") {
                canvas.dataset.cachedData = canvas.toDataURL('image/jpeg', 0.5); 
                canvas.dataset.isDirty = "false"; 
              }
              const wrapper = canvas.closest('.canvas-item-wrapper');
              const textarea = wrapper ? wrapper.querySelector('.note-textarea') : null;

              savedPagesArray.push({
                id: canvas.id,
                data: canvas.dataset.cachedData,
                zoom: canvas.dataset.zoom || "1",
                color: canvas.dataset.color || "#1e293b",
                text: textarea ? textarea.value : ""
              });
            });
            savedBodyContent = "";
          }
        }

        cardsData.push({
          filetype: card.dataset.filetype,
          filename: card.dataset.filename,
          width: card.style.width,
          height: card.style.height,
          left: card.style.left,
          top: card.style.top,
          currentPage: savedCurrentPage,
          pdfSourceId: savedPdfSourceId,
          mediaSourceId: savedMediaSourceId,
          mediaTemporary: card.dataset.mediaTemporary === 'true',
          mediaStorageFailure: card.dataset.mediaStorageFailure || '',
          pagesArray: savedPagesArray,
          groupId: card.dataset.groupId || "",
          globalColor: card.dataset.currentGlobalColor || "#1e293b",
          paperType: card.dataset.paperType || "A4", 
          bodyContent: savedBodyContent,
          noteMode: tldrawHost ? 'tldraw-local' : (iframeEl ? 'tldraw' : (isNOTAS ? 'canvas' : '')),
          noteId: card.dataset.noteId || '',
          noteUrl: noteUrl,
          notePaper: card.dataset.paperType || 'A4',
          stickyText: stickyTextarea ? stickyTextarea.value : (card.dataset.stickyText || '')
          ,stickyBackground: card.dataset.stickyBackground || '#fef08a'
          ,stickyTextColor: card.dataset.stickyTextColor || '#1e293b'
          ,stickyFontFamily: card.dataset.stickyFontFamily || 'sans-serif'
          ,stickyFontSize: card.dataset.stickyFontSize || '14'
          ,stickyFontWeight: card.dataset.stickyFontWeight || '400'
          ,stickyFontStyle: card.dataset.stickyFontStyle || 'normal'
          ,stickyTextDecoration: card.dataset.stickyTextDecoration || 'none'
        });
      });
      
      const jsonDataStr = JSON.stringify(cardsData);
      const savedAt = Date.now();
      try {
        localStorage.setItem('dexi_codex_cards', jsonDataStr);
        localStorage.setItem('dexi_codex_cards_saved_at', String(savedAt));
      } catch (error) {
        console.error('Não foi possível salvar o quadro no armazenamento local:', error);
        let notice = document.getElementById('board-storage-warning');
        if (!notice) {
          notice = document.createElement('div');
          notice.id = 'board-storage-warning';
          notice.className = 'fixed bottom-4 left-1/2 z-[130] -translate-x-1/2 rounded-lg border border-amber-400 bg-amber-100 px-4 py-3 text-xs font-semibold text-slate-900 shadow-xl';
          notice.textContent = 'O armazenamento do navegador está cheio. O estado anterior foi preservado; exporte ou remova mídias grandes para continuar salvando.';
          document.body.appendChild(notice);
        }
      }
      const snapshotSaved = salvarSnapshotQuadroNoDb(jsonDataStr, savedAt);
      
      // SINCRONIZA COM A NUVEM SE ESTIVER LOGADO
      if (googleAccessToken) {
         agendarSyncDrive(jsonDataStr);
      }
      return snapshotSaved;
    }

    window.addEventListener('pagehide', () => {
      if (!restoringBoardState && document.querySelector('.codex-card')) salvarEstadoNoStorage();
    });

    // Recria os cards persistidos no localStorage e reabre seus recursos associados.
    async function carregarEstadoDoStorage(preferredData = null) {
      const menuVisible = localStorage.getItem('dexi_menu_visible');
      toggleMenu(menuVisible !== 'false'); 

      let rawData = preferredData;
      if (!rawData) {
        const localData = localStorage.getItem('dexi_codex_cards');
        const localSavedAt = Number(localStorage.getItem('dexi_codex_cards_saved_at')) || 0;
        const durableSnapshot = await lerSnapshotQuadroDoDb();
        rawData = durableSnapshot && durableSnapshot.updatedAt > localSavedAt ? durableSnapshot.jsonData : localData;
      }
      if (!rawData) return;
      try {
        const cardsData = JSON.parse(rawData);
        restoringBoardState = true;
        let pendingMediaRestore = cardsData.filter(cardData => cardData.mediaSourceId).length;
        const finishMediaRestore = () => {
          pendingMediaRestore -= 1;
          if (pendingMediaRestore <= 0) finishBoardRestore();
        };
        const finishBoardRestore = () => {
          if (!restoringBoardState) return;
          restoringBoardState = false;
          migrarMidiasDataUrlLegadas();
          salvarEstadoNoStorage();
        };
        cardsData.forEach(c => {
          if ((c.filetype === 'PDF' || c.filetype === 'LEITOR PDF') && c.pdfSourceId) {
            const pdfCard = montarEGerarLeitorPdf(c.pdfSourceId, c.filename, c.currentPage, {
              width: c.width, height: c.height, left: c.left, top: c.top, groupId: c.groupId
            });
            if (c.mediaTemporary) {
              lastMediaStorageFailure = c.mediaStorageFailure || 'arquivo antigo sem motivo da falha registrado';
              marcarCardComoTemporario(pdfCard, c.filetype, c.filename);
            }
          } else if (c.mediaSourceId) {
            obterMediaDoDb(c.mediaSourceId).then(async blob => {
              const bodyHtml = await criarConteudoArquivoPersistente(c.filetype, c.filename, c.mediaSourceId, blob);
              const mediaCard = createCard(c.filetype, c.filename, bodyHtml, c.width ? parseFloat(c.width) : 290, {
                width: c.width, height: c.height, left: c.left, top: c.top, groupId: c.groupId
              });
              if (!blob || c.mediaTemporary) {
                lastMediaStorageFailure = c.mediaStorageFailure || 'arquivo não encontrado no IndexedDB; reimporte o original';
                marcarCardComoTemporario(mediaCard, c.filetype, c.filename);
              }
              finishMediaRestore();
            }).catch(error => {
              console.error('Falha ao restaurar mídia:', error);
              const bodyHtml = `<div data-mediasourceid="${escapeHTML(c.mediaSourceId)}" class="flex h-full items-center justify-center p-4 text-center text-xs text-rose-600">Arquivo não disponível neste navegador. Reimporte este arquivo.</div>`;
              const mediaCard = createCard(c.filetype, c.filename, bodyHtml, c.width ? parseFloat(c.width) : 290, {
                width: c.width, height: c.height, left: c.left, top: c.top, groupId: c.groupId
              });
              marcarCardComoTemporario(mediaCard, c.filetype, c.filename);
              finishMediaRestore();
            });
          } else if (c.filetype === 'NOTAS') {
            if (c.noteMode === 'tldraw-local' || c.noteMode === 'tldraw' || c.noteId || c.noteUrl || (c.bodyContent && c.bodyContent.includes('<iframe'))) {
              const noteUrl = c.noteUrl || 'https://www.tldraw.com/';
              const bodyHtml = `
                <div class="tldraw-note-shell h-full w-full bg-white overflow-hidden relative">
                  <iframe src="${noteUrl}" class="w-full h-full border-0 bg-white" title="TLDraw" allow="clipboard-read; clipboard-write; fullscreen; autoplay; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
              `;
              const noteCard = createCard(c.filetype, c.filename, bodyHtml, c.width ? parseFloat(c.width) : 400, {
                width: c.width, height: c.height, left: c.left, top: c.top, groupId: c.groupId
              });
              noteCard.dataset.paperType = c.paperType || 'A4';
              noteCard.dataset.noteUrl = noteUrl;
            } else {
              reconstruirCardNotasComPaginas(c);
            }
          } else if (c.filetype === 'STICKY') {
            criarStickyNote({
              width: c.width,
              height: c.height,
              left: c.left,
              top: c.top,
              groupId: c.groupId
            }, c.stickyText || '', c.filename || 'Sticky note', {
              background: c.stickyBackground,
              textColor: c.stickyTextColor,
              fontFamily: c.stickyFontFamily,
              fontSize: c.stickyFontSize,
              fontWeight: c.stickyFontWeight,
              fontStyle: c.stickyFontStyle,
              textDecoration: c.stickyTextDecoration
            });
          } else {
            createCard(c.filetype, c.filename, c.bodyContent, c.width ? parseFloat(c.width) : 290, {
              width: c.width, height: c.height, left: c.left, top: c.top, groupId: c.groupId
            });
          }
        });
        if (pendingMediaRestore === 0) finishBoardRestore();
      } catch (e) { console.error("Erro ao carregar dados", e); }
    }

    // Limpa o quadro, mantém a opção de recuperação e grava o estado vazio.
    window.limparQuadro = function() {
      // Salva cards antes de deletar
      const cards = document.querySelectorAll('.codex-card');
      if (cards.length > 0) {
        cards.forEach(card => adicionarAoHistoricoDeleted(card.cloneNode(true)));
      }
      
      document.querySelectorAll('.codex-card').forEach(card => card.remove());
      const clearedAt = Date.now();
      try {
        localStorage.setItem('dexi_codex_cards', '[]');
        localStorage.setItem('dexi_codex_cards_saved_at', String(clearedAt));
      } catch (error) {}
      atualizarToolbarSelecao();
      if (db) {
        const transaction = db.transaction(["pdfs"], "readwrite");
        transaction.objectStore(["pdfs"]).clear();
        const mediaTransaction = db.transaction(["media"], "readwrite");
        mediaTransaction.objectStore(["media"]).clear();
      }
      folderFileMemoryCache.clear();
      salvarSnapshotQuadroNoDb('[]', clearedAt);
      if (googleAccessToken) agendarSyncDrive('[]');
    }

    // ========================================== 
    // SISTEMA DE HISTÓRICO DE DELETADOS (INÍCIO)
    // ========================================== 
    let deletedItems = [];
    const MAX_DELETED_ITEMS = 50;

    function adicionarAoHistoricoDeleted(elemento) {
      const htmlContent = elemento.outerHTML;
      const timestamp = new Date().toLocaleString('pt-BR');
      const deletedItem = {
        id: Date.now(),
        html: htmlContent,
        timestamp: timestamp,
        tipo: elemento.querySelector('.card-header')?.textContent?.trim() || 'Card'
      };
      
      deletedItems.unshift(deletedItem);
      
      // Limita o histórico a 50 itens
      if (deletedItems.length > MAX_DELETED_ITEMS) {
        deletedItems = deletedItems.slice(0, MAX_DELETED_ITEMS);
      }
      
      // Salva no localStorage
      try {
        localStorage.setItem('dexi_deleted_items', JSON.stringify(deletedItems));
      } catch (e) {
        console.warn("Erro ao salvar histórico de deletados:", e);
      }
    }

    function carregarHistoricoDeleted() {
      try {
        const saved = localStorage.getItem('dexi_deleted_items');
        if (saved) {
          deletedItems = JSON.parse(saved);
        }
      } catch (e) {
        console.warn("Erro ao carregar histórico de deletados:", e);
        deletedItems = [];
      }
    }

    window.abrirModalRecuperaveis = function() {
      carregarHistoricoDeleted();
      const modal = document.getElementById('recuperaveis-modal');
      const content = document.getElementById('recuperaveis-content');
      
      if (deletedItems.length === 0) {
        content.innerHTML = '<p class="text-center text-slate-500 dark:text-slate-400 text-sm py-8">Nenhum item deletado. O histórico está vazio.</p>';
        document.getElementById('recuperaveis-recuperar-todos').disabled = true;
        document.getElementById('recuperaveis-limpar-todos').disabled = true;
      } else {
        let html = '<div class="space-y-2">';
        deletedItems.forEach((item, index) => {
          const isDrawing = item.type === 'drawing';
          const icon = isDrawing ? '✏️' : '📄';
          const tipo = isDrawing ? item.title : escapeHTML(item.tipo || 'Card');
          const badgeClass = isDrawing ? 'bg-amber-100 dark:bg-amber-900 text-amber-800 dark:text-amber-200' : 'bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200';
          const tipoBadge = isDrawing ? 'Desenho' : 'Card';
          
          html += `
            <div class="flex items-center justify-between p-3 bg-slate-100 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-lg">${icon}</span>
                  <p class="text-sm font-semibold text-slate-800 dark:text-slate-200 flex-1">${tipo}</p>
                  <span class="text-xs px-2 py-1 rounded ${badgeClass} font-bold">${tipoBadge}</span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 ml-7">${item.timestamp}</p>
              </div>
              <button onclick="recuperarItemDeletado(${item.id})" class="ml-3 bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex-shrink-0">Recuperar</button>
              <button onclick="removerDoHistorico(${item.id})" class="ml-2 bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex-shrink-0">Deletar</button>
            </div>
          `;
        });
        html += '</div>';
        content.innerHTML = html;
        document.getElementById('recuperaveis-recuperar-todos').disabled = false;
        document.getElementById('recuperaveis-limpar-todos').disabled = false;
      }
      
      modal.classList.remove('hidden');
    }

    window.fecharModalRecuperaveis = function() {
      document.getElementById('recuperaveis-modal').classList.add('hidden');
    }

    window.recuperarItemDeletado = function(itemId) {
      const item = deletedItems.find(i => i.id === itemId);
      if (!item) return;
      
      if (item.type === 'drawing') {
        // Recupera desenho
        boardWritingStrokes = boardWritingStrokes.concat(item.strokes);
        saveBoardWriting();
        renderBoardWriting();
      } else {
        // Recupera card (HTML)
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = item.html;
        const card = tempDiv.firstChild;
        document.getElementById('canvas').appendChild(card);
      }
      
      // Remove do histórico
      deletedItems = deletedItems.filter(i => i.id !== itemId);
      localStorage.setItem('dexi_deleted_items', JSON.stringify(deletedItems));
      
      // Recarrega o modal
      abrirModalRecuperaveis();
      
      // Salva o estado
      salvarEstadoNoStorage();
    }

    window.recuperarTodosDeletados = function() {
      if (deletedItems.length === 0) return;
      
      deletedItems.forEach(item => {
        if (item.type === 'drawing') {
          // Recupera desenho
          boardWritingStrokes = boardWritingStrokes.concat(item.strokes);
        } else {
          // Recupera card (HTML)
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = item.html;
          const card = tempDiv.firstChild;
          document.getElementById('canvas').appendChild(card);
        }
      });
      
      // Salva desenhos
      saveBoardWriting();
      renderBoardWriting();
      
      deletedItems = [];
      localStorage.removeItem('dexi_deleted_items');
      abrirModalRecuperaveis();
      salvarEstadoNoStorage();
    }

    window.removerDoHistorico = function(itemId) {
      if (confirm('Tem certeza que deseja remover permanentemente este item do histórico?')) {
        deletedItems = deletedItems.filter(i => i.id !== itemId);
        localStorage.setItem('dexi_deleted_items', JSON.stringify(deletedItems));

    window.limparTodoHistorico = function() {
      if (confirm('Tem certeza que deseja remover PERMANENTEMENTE todos os itens do histórico? Esta ação não pode ser desfeita.')) {
        deletedItems = [];
        localStorage.removeItem('dexi_deleted_items');
        abrirModalRecuperaveis();
      }
    }

    // Carrega histórico ao iniciar
    carregarHistoricoDeleted();

    // ========================================== 


    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.openModal = function(title, contentHtml) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-content').innerHTML = contentHtml;

    function endAllInteractions() {
      isPanning = false;
      document.body.classList.remove('dragging-active');
      if (typeof interact !== 'undefined' && interact.currentInteractions) {
        interact.currentInteractions.forEach(interaction => {
          if (interaction.interacting()) interaction.end();
        });
      }
    }
    window.addEventListener('mouseup', endAllInteractions);
    window.addEventListener('touchend', endAllInteractions);

    document.addEventListener('keydown', (event) => {
      if (!(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== 'z' || event.shiftKey) return;
      if (event.target.matches('input, textarea, [contenteditable="true"]')) return;
      if (!boardUndoStack.length) return;
      event.preventDefault();
      undoBoardAction();
    });

    window.addEventListener('paste', async (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const cardsBeforePaste = new Set(document.querySelectorAll('.codex-card'));
      const clipboard = e.clipboardData || window.clipboardData;
      const items = Array.from(clipboard.items || []);
      const directoryEntries = items.map(item => item.webkitGetAsEntry?.()).filter(entry => entry?.isDirectory);
      const pastedDirectory = directoryEntries.length > 0;
      const fileSystemHandles = await Promise.all(items.map(async item => {
        try { return await item.getAsFileSystemHandle?.(); } catch (error) { return null; }
      }));
      if (pastedDirectory || fileSystemHandles.some(handle => handle?.kind === 'directory')) {
        e.preventDefault();
        await processDroppedItems(clipboard, fileSystemHandles, directoryEntries);
        requestAnimationFrame(() => pushPastedCardsUndo(cardsBeforePaste));
        return;
      }
      let imagemDetectada = false;
      
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          imagemDetectada = true;
          const file = item.getAsFile();
          const customFile = new File([file], `imagem_colada_${Date.now()}.png`, { type: file.type });
          await processAndCreateCard(customFile);
        }
      }
      
      if (!imagemDetectada) {
        const pastedText = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (pastedText) tratarLinkColado(pastedText);
      }
      requestAnimationFrame(() => pushPastedCardsUndo(cardsBeforePaste));
    });

    window.toggleFullscreenCard = function(card) {
      if (!card) return;
      
      const isFullscreen = card.classList.contains('card-fullscreen');
      
      if (!isFullscreen) {
        card.dataset.prevWidth = card.style.width;
        card.dataset.prevHeight = card.style.height;
        card.dataset.prevLeft = card.style.left;
        card.dataset.prevTop = card.style.top;
        card.dataset.prevTransform = card.style.transform;

        card.classList.add('card-fullscreen');
        
        card.style.width = '100vw';
        card.style.height = '100dvh';
        card.style.left = '0px';
        card.style.top = '0px';
        card.style.transform = 'none';
      } else {
        card.classList.remove('card-fullscreen');
        
        card.style.width = card.dataset.prevWidth || '';
        card.style.height = card.dataset.prevHeight || '';
        card.style.left = card.dataset.prevLeft || '';
        card.style.top = card.dataset.prevTop || '';
        card.style.transform = card.dataset.prevTransform || '';

      const btn = card.querySelector('.fullscreen-toggle-btn');

    // Notas: cada clique cria um card independente e guarda sua própria configuração.
    window.criarNovaNota = function(nomeFolha, tipoPapel) {
      const config = paperConfigs[tipoPapel] || paperConfigs['A4'];
      const targetLeft = mouseXCanvas || (Math.abs(panX) / zoom + 350);
      const targetTop = mouseYCanvas || (Math.abs(panY) / zoom + 150);
      const props = { width: `${config.cardW}px`, height: `${config.cardH}px`, left: `${targetLeft}px`, top: `${targetTop}px` };

      const paperUrl = criarUrlNotaTldraw();

      const bodyHtml = `
        <div class="tldraw-note-shell h-full w-full bg-white overflow-hidden">
          <iframe
            src="${paperUrl}"
            class="w-full h-full border-0 bg-white"
            title="TLDraw - ${tipoPapel}"
            allow="clipboard-write; clipboard-read; fullscreen; autoplay"
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-presentation allow-downloads"
          ></iframe>
        </div>
      `;

      const newCard = createCard('NOTAS', nomeFolha, bodyHtml, config.cardW, props);
      newCard.dataset.paperType = tipoPapel;
      newCard.dataset.tldrawPaper = tipoPapel;
      newCard.dataset.noteUrl = paperUrl;
      salvarEstadoNoStorage();
    }

    function criarUrlNotaTldraw() {
      const id = window.crypto && crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      return `https://www.tldraw.com/?d=${id}`;
    }

    function normalizarUrlNotaTldraw(url) {
      if (!url) return '';
      return url.replace('?note=', '?d=');
    }

    // Operações específicas das notas: páginas, zoom, PDF, cor, texto e limpeza.
    // Cria uma nova página de desenho dentro do card de notas escolhido.
    window.adicionarNovaPaginaAoCard = function(card) {
      if (!card) return;
      const scrollContainer = card.querySelector('.scroll-container-a4');
      if (!scrollContainer) return;

      const paperType = card.dataset.paperType || "A4";
      const config = paperConfigs[paperType] || paperConfigs['A4'];

      const newId = 'canvas_page_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const firstCanvas = card.querySelector('.drawing-canvas');
      const currentZoom = firstCanvas ? firstCanvas.dataset.zoom : "1";
      const currentMode = card.dataset.currentGlobalMode || "pen";
      const currentStroke = card.dataset.currentGlobalStroke || "4";
      const currentColor = card.dataset.currentGlobalColor || "#1e293b";

      const calculatedWidth = config.cssW * parseFloat(currentZoom);
      const calculatedHeight = config.cssH * parseFloat(currentZoom);

      const wrapper = document.createElement('div');
      wrapper.className = "canvas-item-wrapper m-auto relative";
      
      const pointerEvents = currentMode === 'text' ? 'auto' : 'none';

      wrapper.innerHTML = `
        <button onclick="this.parentElement.remove(); salvarEstadoNoStorage();" class="absolute -top-2 -right-2 bg-rose-500 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[11px] font-bold shadow-lg z-20">&times;</button>
        <textarea class="note-textarea absolute top-0 left-0 w-full h-full bg-transparent resize-none outline-none z-10" style="color: ${currentColor}; padding: ${16 * parseFloat(currentZoom)}px; font-size: ${16 * parseFloat(currentZoom)}px; line-height: 1.5; pointer-events: ${pointerEvents}; white-space: pre-wrap;" oninput="agendarSalvamento();"></textarea>
        <canvas id="${newId}" class="drawing-canvas shadow-xl bg-white block" width="${config.canvasW}" height="${config.canvasH}" data-mode="${currentMode}" data-stroke-width="${currentStroke}" data-color="${currentColor}" data-zoom="${currentZoom}" style="width: ${calculatedWidth}px; height: ${calculatedHeight}px;"></canvas>
      `;

      scrollContainer.appendChild(wrapper);
      const newCanvasEl = wrapper.querySelector('.drawing-canvas');
      initDrawingCanvas(newCanvasEl);
      salvarEstadoNoStorage();
    }

    window.zoomCanvasCard = function(card, delta) {
      if (!card) return;
      const paperType = card.dataset.paperType || "A4";
      const config = paperConfigs[paperType] || paperConfigs['A4'];
      
      const canvases = card.querySelectorAll('.drawing-canvas');
      canvases.forEach(canvasEl => {
        let currentZoom = parseFloat(canvasEl.dataset.zoom) || 1;
        currentZoom += delta;
        currentZoom = Math.max(0.4, Math.min(currentZoom, 3));
        canvasEl.dataset.zoom = currentZoom;

        canvasEl.style.width = `${config.cssW * currentZoom}px`;
        canvasEl.style.height = `${config.cssH * currentZoom}px`;

        const wrapper = canvasEl.closest('.canvas-item-wrapper');
        const textarea = wrapper ? wrapper.querySelector('.note-textarea') : null;
        if (textarea) {
           textarea.style.padding = `${16 * currentZoom}px`;
           textarea.style.fontSize = `${16 * currentZoom}px`;
        }
      });
      salvarEstadoNoStorage();
    }

    window.downloadCardAsMultiPagePDF = function(card) {
      if (!card) return;
      const canvases = card.querySelectorAll('.drawing-canvas');
      if (canvases.length === 0) return;

      const paperType = card.dataset.paperType || "A4";
      let format = 'a4';
      let w = 210, h = 297, orientation = 'p';

      if (paperType === 'Carta') {
          format = 'letter';
          w = 215.9; h = 279.4;
      } else if (paperType === 'Quadro') {
          format = [400, 400]; 
          w = 400; h = 400;
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF(orientation, 'mm', format);
      const filename = card.dataset.filename || 'nota-rascunho';

      canvases.forEach((canvasEl, index) => {
        if (index > 0) pdf.addPage(format, orientation);
        
        // Canvas temporário apenas com os traços (fundo transparente)
        const strokesCanvas = document.createElement('canvas');
        strokesCanvas.width = canvasEl.width;
        strokesCanvas.height = canvasEl.height;
        const sCtx = strokesCanvas.getContext('2d');
        sCtx.drawImage(canvasEl, 0, 0);
        
        // Detecta se há traços brancos
        const strokeData = sCtx.getImageData(0, 0, strokesCanvas.width, strokesCanvas.height);
        const data = strokeData.data;
        let hasWhiteStrokes = false;
        
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a > 128) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            if (r > 200 && g > 200 && b > 200) {
              hasWhiteStrokes = true;
              break;
            }
          }
        }
        
        // Se detectou traços brancos, inverte apenas os traços
        if (hasWhiteStrokes) {
          for (let i = 0; i < data.length; i += 4) {
            const a = data[i + 3];
            if (a > 128) {
              data[i] = 255 - data[i];           // R
              data[i + 1] = 255 - data[i + 1];   // G
              data[i + 2] = 255 - data[i + 2];   // B
            }
          }
          sCtx.putImageData(strokeData, 0, 0);
        }
        
        // Canvas final: fundo branco + traços processados
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvasEl.width;
        tempCanvas.height = canvasEl.height;
        const tCtx = tempCanvas.getContext('2d');
        
        // Fundo branco
        tCtx.fillStyle = '#ffffff';
        tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        
        // Traços processados
        tCtx.drawImage(strokesCanvas, 0, 0);

        const wrapper = canvasEl.closest('.canvas-item-wrapper');
        const textarea = wrapper ? wrapper.querySelector('.note-textarea') : null;
        
        if (textarea && textarea.value) {
          const cssW = parseFloat(canvasEl.style.width) || canvasEl.width;
          const currentZoom = parseFloat(canvasEl.dataset.zoom) || 1;
          const ratio = canvasEl.width / cssW;
          
          const fontSizeOnCanvas = 16 * currentZoom * ratio;
          tCtx.font = `${fontSizeOnCanvas}px sans-serif`;
          tCtx.fillStyle = textarea.style.color || '#1e293b';
          tCtx.textBaseline = "top";
          
          const lines = textarea.value.split('\n');
          let y = 16 * currentZoom * ratio; 
          const x = 16 * currentZoom * ratio; 
          const lineHeight = fontSizeOnCanvas * 1.5;
          
          lines.forEach(line => {
             tCtx.fillText(line, x, y);
             y += lineHeight;
          });
        }

        const imgData = tempCanvas.toDataURL('image/jpeg', 1.0);
        pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
      });

      pdf.save(`${filename}.pdf`);
    }

    window.setDrawMode = function(btn, mode) {
      const card = btn.closest('.codex-card');
      if (!card) return;
      card.dataset.currentGlobalMode = mode;
      
      const canvases = card.querySelectorAll('.drawing-canvas');
      canvases.forEach(c => c.dataset.mode = mode);

      const textareas = card.querySelectorAll('.note-textarea');
      if (mode === 'text') {
        textareas.forEach(ta => ta.style.pointerEvents = 'auto');
      } else {
        textareas.forEach(ta => ta.style.pointerEvents = 'none');
      }

      btn.parentElement.querySelectorAll('button').forEach(b => {
        if (b.title === 'Caneta' || b.title === 'Borracha' || b.title === 'Mover pela folha' || b.title === 'Digitar Texto') {
          b.className = "p-1.5 rounded-lg opacity-60 hover:opacity-100 hover:bg-slate-700/50 transition-all";
        }
      });
      
      btn.className = "p-1.5 rounded-lg bg-amber-500/30 ring-1 ring-amber-400 opacity-100 shadow-md transition-all scale-110";

      const scrollContainer = card.querySelector('.scroll-container-a4');
      if (scrollContainer) {
        scrollContainer.style.cursor = mode === 'move' ? 'grab' : (mode === 'text' ? 'text' : 'default');
      }
    }

    window.setStrokeWidthCard = function(card, value) {
      if (!card) return;
      card.dataset.currentGlobalStroke = value;
      const canvases = card.querySelectorAll('.drawing-canvas');
      canvases.forEach(c => c.dataset.strokeWidth = value);
    }
    
    window.setColorCard = function(card, value) {
      if (!card) return;
      card.dataset.currentGlobalColor = value;
      const canvases = card.querySelectorAll('.drawing-canvas');
      canvases.forEach(c => {
         c.dataset.color = value;
         const wrapper = c.closest('.canvas-item-wrapper');
         const textarea = wrapper ? wrapper.querySelector('.note-textarea') : null;
         if (textarea) textarea.style.color = value;
      });
    }

    window.clearAllCanvasesInCard = function(card) {
      if (!card) return;
      const canvases = card.querySelectorAll('.drawing-canvas');
      canvases.forEach(canvasEl => {
        const ctx = canvasEl.getContext('2d', { desynchronized: true });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
        canvasEl.dataset.isDirty = "true"; 
      });

      const textareas = card.querySelectorAll('.note-textarea');
      textareas.forEach(ta => ta.value = '');
      salvarEstadoNoStorage();
    }

    // Reconstrói cards de notas e suas páginas salvas a partir dos dados persistidos.
    function reconstruirCardNotasComPaginas(c) {
      const paperType = c.paperType || "A4";
      const config = paperConfigs[paperType] || paperConfigs['A4'];
      
      const a4Width = c.width || `${config.cardW}px`;
      const a4Height = c.height || `${config.cardH}px`;
      const savedPages = c.pagesArray || [];
      const globalColor = c.globalColor || "#1e293b";

      let pagesContentHtml = "";
      savedPages.forEach((page, index) => {
        const currentZoom = parseFloat(page.zoom) || 1;
        const pageColor = page.color || globalColor;
        const savedText = page.text || "";
        const calculatedWidth = config.cssW * currentZoom;
        const calculatedHeight = config.cssH * currentZoom;

        const deleteButton = index > 0 ? `<button onclick="this.parentElement.remove(); salvarEstadoNoStorage();" class="absolute -top-2 -right-2 bg-rose-500 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[11px] font-bold shadow-lg z-20">&times;</button>` : "";

        pagesContentHtml += `
          <div class="canvas-item-wrapper m-auto relative">
            ${deleteButton}
            <textarea class="note-textarea absolute top-0 left-0 w-full h-full bg-transparent resize-none outline-none z-10 pointer-events-none" style="color: ${pageColor}; padding: ${16 * currentZoom}px; font-size: ${16 * currentZoom}px; line-height: 1.5; white-space: pre-wrap;" oninput="agendarSalvamento();">${escapeHTML(savedText)}</textarea>
            <canvas id="${page.id}" class="drawing-canvas shadow-xl bg-white block" width="${config.canvasW}" height="${config.canvasH}" data-mode="pen" data-stroke-width="4" data-color="${pageColor}" data-zoom="${currentZoom}" style="width: ${calculatedWidth}px; height: ${calculatedHeight}px;"></canvas>
          </div>
        `;
      });

      const bodyHtml = `
        <div class="flex flex-col h-full bg-white relative select-none pointer-events-auto">
          <div class="flex-shrink-0 sticky top-0 left-0 w-full bg-slate-800/95 backdrop-blur text-white px-2 sm:px-3 py-1.5 flex flex-wrap gap-1.5 sm:gap-2.5 z-20 shadow-lg items-center justify-center text-xs" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
            <button onclick="setDrawMode(this, 'pen')" class="p-1.5 rounded-lg bg-amber-500/30 ring-1 ring-amber-400 opacity-100 shadow-md transition-all scale-110" title="Caneta">✏️</button>
            <button onclick="setDrawMode(this, 'text')" class="p-1.5 rounded-lg opacity-60 hover:opacity-100 hover:bg-slate-700/50 transition-all" title="Digitar Texto">⌨️</button>
            <button onclick="setDrawMode(this, 'eraser')" class="p-1.5 rounded-lg opacity-60 hover:opacity-100 hover:bg-slate-700/50 transition-all" title="Borracha">🧽</button>
            <button onclick="setDrawMode(this, 'move')" class="p-1.5 rounded-lg opacity-60 hover:opacity-100 hover:bg-slate-700/50 transition-all" title="Mover pela folha">🖐️</button>
            
            <div class="flex items-center gap-1 text-[11px] bg-slate-700/60 px-1.5 py-0.5 rounded-md">
              <span class="text-slate-400">px:</span>
              <input type="number" min="1" max="50" value="4" oninput="setStrokeWidthCard(this.closest('.codex-card'), this.value)" class="w-7 bg-transparent text-center text-amber-400 font-bold font-mono focus:outline-none pointer-events-auto">
            </div>
            
            <input type="color" value="${globalColor}" oninput="setColorCard(this.closest('.codex-card'), this.value)" class="w-6 h-6 ml-1 p-0 border-0 rounded bg-transparent cursor-pointer pointer-events-auto" title="Cor da Caneta">

            <div class="hidden sm:block w-px h-3 bg-slate-600"></div>
            
            <button onclick="adicionarNovaPaginaAoCard(this.closest('.codex-card'))" class="text-indigo-400 hover:text-indigo-300 transition-colors font-bold text-[11px]" title="Adicionar outra folha">+📄</button>
            <div class="hidden sm:block w-px h-3 bg-slate-600"></div>
            <button onclick="zoomCanvasCard(this.closest('.codex-card'), 0.15)" class="text-slate-300 hover:text-amber-300 transition-colors font-bold text-xs" title="Aumentar Zoom">➕</button>
            <button onclick="zoomCanvasCard(this.closest('.codex-card'), -0.15)" class="text-slate-300 hover:text-amber-300 transition-colors font-bold text-xs" title="Diminuir Zoom">➖</button>
            <div class="hidden sm:block w-px h-3 bg-slate-600"></div>
            <button onclick="downloadCardAsMultiPagePDF(this.closest('.codex-card'))" class="text-slate-300 hover:text-emerald-400 transition-colors text-sm" title="Baixar Tudo em PDF">📥</button>
            <button onclick="clearAllCanvasesInCard(this.closest('.codex-card'))" class="text-slate-300 hover:text-rose-400 transition-colors" title="Limpar Tudo">🗑️</button>
            <div class="hidden sm:block w-px h-3 bg-slate-600"></div>
            <button onclick="toggleFullscreenCard(this.closest('.codex-card'))" class="fullscreen-toggle-btn text-slate-300 hover:text-amber-400 transition-colors font-bold text-xs" title="Tela Cheia">⛶</button>
          </div>
          <div class="scroll-container-a4 flex-1 w-full h-full overflow-y-auto bg-slate-100 dark:bg-slate-950/30 p-4 flex flex-col gap-6 justify-start items-center m-0 pointer-events-auto" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
            ${pagesContentHtml}
          </div>
        </div>
      `;

      const props = { width: a4Width, height: a4Height, left: c.left, top: c.top, groupId: c.groupId };
      const newCard = createCard('NOTAS', c.filename, bodyHtml, config.cardW, props);
      newCard.dataset.currentGlobalMode = c.currentGlobalMode || "pen";
      newCard.dataset.currentGlobalStroke = c.currentGlobalStroke || "4";
      newCard.dataset.currentGlobalColor = globalColor;
      newCard.dataset.paperType = paperType; 

      const canvases = newCard.querySelectorAll('.drawing-canvas');
      canvases.forEach(canvasEl => {
        canvasEl.classList.add('initialized');
        initDrawingCanvas(canvasEl);
        
        const cachedData = savedPages.find(p => p.id === canvasEl.id)?.data;
        if (cachedData) {
          const ctx = canvasEl.getContext('2d', { desynchronized: true });
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0);
            canvasEl.dataset.cachedData = cachedData;
            canvasEl.dataset.isDirty = "false";
          };
          img.src = cachedData;
        }
      });
    }

    // Inicializa o desenho manual usado como fallback quando TLDraw não está disponível.
    function initDrawingCanvas(canvas) {
      let isDrawing = false;
      let ctx = canvas.getContext('2d');
      let lastX = 0; let lastY = 0;
      
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function start(e) {
        if (canvas.dataset.mode === 'move' || canvas.dataset.mode === 'text') return;
        
        // Permite scroll nativo do navegador caso toquem na tela com 2 dedos
        if (e.touches && e.touches.length >= 2) return; 
        
        if (e.cancelable) e.preventDefault(); // Impede o scroll nativo se desenhar com 1 dedo só
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x; lastY = pos.y;
      }
      
      function draw(e) {
        if (!isDrawing) return;
        
        // Interrompe imediatamente a linha caso um 2º dedo encoste durante o traço (para arrastar a tela)
        if (e.touches && e.touches.length >= 2) {
           isDrawing = false;
           return;
        }
        
        if (e.cancelable) e.preventDefault();
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (canvas.dataset.mode === 'eraser') {
           ctx.strokeStyle = '#ffffff'; 
           ctx.lineWidth = (canvas.dataset.strokeWidth || 4) * 3;
        } else {
           ctx.strokeStyle = canvas.dataset.color || '#1e293b';
           ctx.lineWidth = canvas.dataset.strokeWidth || 4;
        }
        ctx.stroke();
        lastX = pos.x; lastY = pos.y;
        canvas.dataset.isDirty = "true";
      }
      
      function stop(e) {
        if (isDrawing) {
          isDrawing = false;
          agendarSalvamento();
        }
      }
      
      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('mouseout', stop);
      canvas.addEventListener('touchstart', start, {passive: false});
      canvas.addEventListener('touchmove', draw, {passive: false});
      canvas.addEventListener('touchend', stop);
    }
  </script>
