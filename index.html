  <!-- Script principal: calendário, quadro, arquivamento, cards e notas. -->
  <script>
    // Relógio digital e seleção de fuso horário.
    // ==========================================
    // LÓGICA DO RELÓGIO DIGITAL (INÍCIO)
    // ==========================================
    const tzSelect = document.getElementById('timezone-selector');
    
    // Recupera o último fuso horário salvo pelo usuário (ou usa Brasília como padrão)
    const savedTz = localStorage.getItem('dexi_timezone');
    if (savedTz && tzSelect) {
      tzSelect.value = savedTz;
    }

    // Salva a nova preferência de fuso ao alterar o seletor
    if (tzSelect) {
      tzSelect.addEventListener('change', () => {
        localStorage.setItem('dexi_timezone', tzSelect.value);
        updateClock(); // Força a atualização imediata na troca
      });
    }

    function updateClock() {
      const clockDisplay = document.getElementById('clock-display');
      const dateDisplay = document.getElementById('date-display');
      
      if (!clockDisplay || !tzSelect || !dateDisplay) return;

      const timezone = tzSelect.value;
      const now = new Date();

      try {
        // Renderiza a hora formato 24h
        const timeString = now.toLocaleTimeString('pt-BR', { timeZone: timezone, hour12: false });
        
        // Renderiza a data (ex: sex., 18 de out.)
        const dateOptions = { timeZone: timezone, weekday: 'short', day: '2-digit', month: 'short' };
        let dateString = now.toLocaleDateString('pt-BR', dateOptions);
        
        clockDisplay.innerText = timeString;
        dateDisplay.innerText = dateString;
      } catch (e) {
        console.error("Erro ao atualizar relógio digital:", e);
      }
    }

    // Inicia a rotina de atualização (1000ms = 1 segundo)
    setInterval(updateClock, 1000);
    setTimeout(updateClock, 100); // Roda imediatamente na abertura

    // Estado do calendário, tarefas salvas e escolha de som das notificações.
    const calendarAlarmPanel = document.getElementById('calendar-alarm-panel');
    const taskSoundSelect = document.getElementById('task-sound-select');
    const savedTaskSound = localStorage.getItem('dexi_task_sound');
    if (savedTaskSound && taskSoundSelect.querySelector(`option[value="${savedTaskSound}"]`)) taskSoundSelect.value = savedTaskSound;
    let calendarMonth = new Date();
    let selectedTaskDate = new Date();
    let scheduledTasks = [];
    let taskAudioContext = null;
    try {
      const savedTasks = JSON.parse(localStorage.getItem('dexi_tasks') || '[]');
      if (Array.isArray(savedTasks)) scheduledTasks = savedTasks;
    } catch (error) {
      scheduledTasks = [];
    }

    function formatLocalDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Renderiza o mês atual e marca os dias que possuem tarefas pendentes.
    function renderCalendar() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      document.getElementById('calendar-month-label').textContent = calendarMonth.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      const days = document.getElementById('calendar-days');
      days.replaceChildren();
      for (let blank = 0; blank < firstWeekday; blank++) days.appendChild(document.createElement('span'));
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateValue = formatLocalDate(date);
        const hasTask = scheduledTasks.some(task => task.date === dateValue && !task.completed);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `relative flex h-8 items-center justify-center rounded-lg text-xs transition hover:bg-amber-100 dark:hover:bg-slate-800 ${dateValue === formatLocalDate(selectedTaskDate) ? 'bg-amber-500 font-bold text-slate-900' : 'text-slate-700 dark:text-slate-200'} ${dateValue === formatLocalDate(new Date()) ? 'ring-1 ring-amber-500' : ''}`;
        button.setAttribute('aria-label', `${date.toLocaleDateString('pt-BR', { dateStyle: 'full' })}${hasTask ? ', tem tarefa' : ''}`);
        button.append(document.createTextNode(String(day)));
        if (hasTask) {
          const marker = document.createElement('span');
          marker.className = 'absolute bottom-0.5 h-1 w-1 rounded-full bg-rose-500';
          button.appendChild(marker);
        }
        button.addEventListener('click', () => {
          selectedTaskDate = date;
          document.getElementById('task-date').value = dateValue;
          renderCalendar();
          renderTasks();
        });
        days.appendChild(button);
      }
      document.getElementById('task-date').value = formatLocalDate(selectedTaskDate);
    }

    function saveTasks() {
      localStorage.setItem('dexi_tasks', JSON.stringify(scheduledTasks));
    }

    // Atualiza a lista do dia selecionado e os controles de conclusão.
    function renderTasks() {
      const list = document.getElementById('task-list');
      list.replaceChildren();
      const selectedDate = formatLocalDate(selectedTaskDate);
      const visibleTasks = scheduledTasks.filter(task => task.date === selectedDate);
      if (!visibleTasks.length) {
        const empty = document.createElement('li');
        empty.className = 'py-2 text-center text-[10px] text-slate-400';
        empty.textContent = 'Nenhuma tarefa nesta data';
        list.appendChild(empty);
      }
      visibleTasks.forEach(task => {
        const row = document.createElement('li');
        row.className = 'flex items-center gap-2 rounded-lg bg-slate-100 px-2 py-1.5 text-[10px] dark:bg-slate-900';
        const complete = document.createElement('input');
        complete.type = 'checkbox';
        complete.checked = Boolean(task.completed);
        complete.className = 'h-4 w-4 shrink-0 accent-amber-500';
        complete.setAttribute('aria-label', `Marcar ${task.title} como concluída`);
        complete.addEventListener('change', () => {
          task.completed = complete.checked;
          saveTasks();
          renderTasks();
          renderCalendar();
        });
        const label = document.createElement('span');
        label.className = `min-w-0 flex-1 ${task.completed ? 'text-slate-400 line-through' : 'text-slate-700 dark:text-slate-200'}`;
        const localDate = new Date(`${task.date}T00:00:00`);
        label.textContent = `${task.title} · ${localDate.toLocaleDateString('pt-BR')} ${task.time || '09:00'}`;
        label.title = label.textContent;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '×';
        remove.className = 'px-1 text-base font-bold text-slate-400 hover:text-rose-500';
        remove.setAttribute('aria-label', `Remover tarefa ${task.title}`);
        remove.addEventListener('click', () => {
          scheduledTasks = scheduledTasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
          renderCalendar();
        });
        row.append(complete, label, remove);
        list.appendChild(row);
      });
    }

    // Mostra o aviso do navegador e toca o som escolhido para a tarefa vencida.
    function showTaskNotification(task) {
      let toast = document.getElementById('task-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'task-toast';
        toast.className = 'fixed left-1/2 top-4 z-[120] -translate-x-1/2 rounded-xl border border-amber-400 bg-amber-100 px-4 py-3 text-sm font-bold text-slate-900 shadow-2xl dark:bg-amber-300';
        toast.setAttribute('role', 'alert');
        document.body.appendChild(toast);
      }
      toast.textContent = `Tarefa: ${task.title}`;
      try {
        if ('Notification' in window && Notification.permission === 'granted') new Notification('Dexi: tarefa', { body: task.title, tag: task.id });
      } catch (error) {}
      toast.onclick = () => toast.remove();
      playTaskSound();
    }

    function enableTaskSound() {
      try {
        const AudioContextType = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextType) return;
        if (!taskAudioContext) taskAudioContext = new AudioContextType();
        if (taskAudioContext.state === 'suspended') taskAudioContext.resume().catch(() => {});
      } catch (error) {}
    }

    async function playTaskSound() {
      const pattern = {
        bell: [{ frequency: 880, delay: 0, duration: 0.55 }, { frequency: 1175, delay: 0.16, duration: 0.65 }],
        double: [{ frequency: 740, delay: 0, duration: 0.18 }, { frequency: 740, delay: 0.28, duration: 0.18 }],
        soft: [{ frequency: 523, delay: 0, duration: 0.5 }, { frequency: 659, delay: 0.22, duration: 0.55 }]
      }[taskSoundSelect.value];
      if (!pattern) return;
      enableTaskSound();
      if (!taskAudioContext) return;
      try {
        if (taskAudioContext.state === 'suspended') await taskAudioContext.resume();
        pattern.forEach(note => {
          const startAt = taskAudioContext.currentTime + note.delay;
          const oscillator = taskAudioContext.createOscillator();
          const gain = taskAudioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(note.frequency, startAt);
          gain.gain.setValueAtTime(0.0001, startAt);
          gain.gain.exponentialRampToValueAtTime(0.18, startAt + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, startAt + note.duration);
          oscillator.connect(gain);
          gain.connect(taskAudioContext.destination);
          oscillator.start(startAt);
          oscillator.stop(startAt + note.duration + 0.03);
        });
      } catch (error) {}
    }

    taskSoundSelect.addEventListener('change', () => localStorage.setItem('dexi_task_sound', taskSoundSelect.value));
    document.getElementById('test-task-sound').addEventListener('click', playTaskSound);

    document.getElementById('clock-display').addEventListener('click', () => {
      enableTaskSound();
      document.getElementById('favorite-sites-panel').classList.add('hidden');
      calendarAlarmPanel.classList.toggle('hidden');
      const clockWidget = document.getElementById('digital-clock-widget');
      clockWidget.classList.remove('clock-widget-pop');
      requestAnimationFrame(() => clockWidget.classList.add('clock-widget-pop'));
      renderCalendar();
      renderTasks();
    });
    document.getElementById('calendar-previous-month').addEventListener('click', () => {
      calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1);
      renderCalendar();
    });
    document.getElementById('calendar-next-month').addEventListener('click', () => {
      calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1);
      renderCalendar();
    });
    document.getElementById('task-date').addEventListener('change', event => {
      const [year, month, day] = event.target.value.split('-').map(Number);
      if (!year) return;
      selectedTaskDate = new Date(year, month - 1, day);
      calendarMonth = new Date(year, month - 1, 1);
      renderCalendar();
      renderTasks();
    });
    document.getElementById('add-task-button').addEventListener('click', () => {
      enableTaskSound();
      const titleInput = document.getElementById('task-title');
      const title = titleInput.value.trim();
      const date = document.getElementById('task-date').value;
      const time = document.getElementById('task-time').value || '09:00';
      if (!title || !date || Number.isNaN(new Date(`${date}T${time}`).getTime())) {
        alert('Informe o nome, a data e o horário da tarefa.');
        return;
      }
      scheduledTasks.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, title, date, time, completed: false, notified: false });
      scheduledTasks.sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
      titleInput.value = '';
      try {
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
      } catch (error) {}
      saveTasks();
      renderTasks();
      renderCalendar();
    });
    document.addEventListener('click', event => {
      if (!calendarAlarmPanel.classList.contains('hidden') && !calendarAlarmPanel.contains(event.target) && !document.getElementById('clock-display').contains(event.target)) calendarAlarmPanel.classList.add('hidden');
    });
    setInterval(() => {
      const now = new Date();
      const dueTasks = scheduledTasks.filter(task => {
        if (task.completed || task.notified) return false;
        const dueAt = new Date(`${task.date}T${task.time || '09:00'}`);
        return dueAt <= now;
      });
      if (!dueTasks.length) return;
      dueTasks.forEach(task => {
        task.notified = true;
        showTaskNotification(task);
      });
      saveTasks();
      renderTasks();
      renderCalendar();
    }, 1000);
    // ==========================================
    // LÓGICA DO RELÓGIO DIGITAL (FIM)
    // ==========================================

    // Lista legada usada apenas para remover os favoritos que vinham pré-carregados.
    // Lê, salva, ordena e remove atalhos do painel de favoritos.
    const seededFavoritesToRemove = [
      { name: 'Gmail', url: 'https://mail.google.com' },
      { name: 'Mapas', url: 'https://maps.google.com' },
      { name: 'Drive', url: 'https://drive.google.com' },
      { name: 'OneDrive', url: 'https://onedrive.live.com/' }
    ];

    function getFavoriteSites() {
      try {
        const rawSaved = localStorage.getItem('dexi_favorite_sites');
        if (rawSaved === null) {
          localStorage.setItem('dexi_favorite_sites', '[]');
          return [];
        }
        const saved = JSON.parse(rawSaved);
        if (Array.isArray(saved)) {
          const isOldSeed = saved.length === seededFavoritesToRemove.length &&
            saved.every((site, index) => site.name === seededFavoritesToRemove[index].name && site.url === seededFavoritesToRemove[index].url);
          if (isOldSeed) {
            localStorage.setItem('dexi_favorite_sites', '[]');
            return [];
          }
          return saved;
        }
      } catch (e) {
        console.warn('Erro ao ler favoritos:', e);
      }
      localStorage.setItem('dexi_favorite_sites', '[]');
      return [];
    }

    function saveFavoriteSites(items) {
      localStorage.setItem('dexi_favorite_sites', JSON.stringify(items));
    }

    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
      } catch (e) {
        return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23999"><circle cx="12" cy="12" r="10"/></svg>';
      }
    }

    let draggedFavoriteIndex = null;

    // Desenha a lista de favoritos e conecta remoção, ordenação e arraste.
    function renderFavoriteSites() {
      const list = document.getElementById('favorite-sites-list');
      if (!list) return;
      const favorites = getFavoriteSites();
      list.innerHTML = favorites.map((site, index) => {
        const faviconUrl = getFaviconUrl(site.url);
        return `
        <div draggable="true" data-index="${index}" class="favorite-site-row flex cursor-grab items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-2 py-2 dark:border-slate-700 dark:bg-slate-900 group hover:border-amber-300 dark:hover:border-amber-600 transition">
          <img src="${faviconUrl}" alt="${site.name}" class="w-5 h-5 rounded-sm flex-shrink-0 object-contain bg-white dark:bg-slate-800 p-0.5" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23999%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
          <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="flex-1 text-left text-[10px] font-bold text-slate-700 transition hover:text-amber-600 dark:text-slate-200 dark:hover:text-amber-400 truncate">${site.name}</a>
          <button type="button" data-index="${index}" data-direction="-1" class="favorite-move-btn px-1 text-xs text-slate-400 hover:text-amber-600" aria-label="Mover ${site.name} para cima" title="Mover para cima">↑</button>
          <button type="button" data-index="${index}" data-direction="1" class="favorite-move-btn px-1 text-xs text-slate-400 hover:text-amber-600" aria-label="Mover ${site.name} para baixo" title="Mover para baixo">↓</button>
          <button type="button" data-index="${index}" class="favorite-remove-btn text-lg font-black text-slate-300 transition hover:text-rose-500 opacity-0 group-hover:opacity-100" aria-label="Remover ${site.name}">×</button>
        </div>
      `;
      }).join('');

      list.querySelectorAll('.favorite-remove-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          e.stopPropagation();
          const favorites = getFavoriteSites();
          const index = Number(button.dataset.index);
          favorites.splice(index, 1);
          saveFavoriteSites(favorites);
          renderFavoriteSites();
        });
      });
      list.querySelectorAll('.favorite-move-btn').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          const favorites = getFavoriteSites();
          const index = Number(button.dataset.index);
          const targetIndex = index + Number(button.dataset.direction);
          if (targetIndex < 0 || targetIndex >= favorites.length) return;
          [favorites[index], favorites[targetIndex]] = [favorites[targetIndex], favorites[index]];
          saveFavoriteSites(favorites);
          renderFavoriteSites();
        });
      });
      list.querySelectorAll('.favorite-site-row').forEach(row => {
        row.addEventListener('dragstart', (event) => {
          draggedFavoriteIndex = Number(row.dataset.index);
          event.dataTransfer.effectAllowed = 'move';
          row.classList.add('opacity-40');
        });
        row.addEventListener('dragover', event => event.preventDefault());
        row.addEventListener('drop', event => {
          event.preventDefault();
          const targetIndex = Number(row.dataset.index);
          if (draggedFavoriteIndex === null || draggedFavoriteIndex === targetIndex) return;
          const favorites = getFavoriteSites();
          const [favorite] = favorites.splice(draggedFavoriteIndex, 1);
          favorites.splice(targetIndex, 0, favorite);
          saveFavoriteSites(favorites);
          renderFavoriteSites();
        });
        row.addEventListener('dragend', () => {
          draggedFavoriteIndex = null;
          row.classList.remove('opacity-40');
        });
      });
    }

    function toggleFavoriteSitesPanel() {
      const panel = document.getElementById('favorite-sites-panel');
      if (!panel) return;
      panel.classList.toggle('hidden');
    }

    document.getElementById('favorite-sites-toggle')?.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleFavoriteSitesPanel();
    });

    document.getElementById('close-favorite-panel')?.addEventListener('click', (event) => {
      event.stopPropagation();
      document.getElementById('favorite-sites-panel')?.classList.add('hidden');
    });

    document.getElementById('add-favorite-btn')?.addEventListener('click', () => {
      const nameInput = document.getElementById('favorite-name-input');
      const urlInput = document.getElementById('favorite-url-input');
      const name = nameInput?.value.trim();
      let url = urlInput?.value.trim();
      if (!name || !url) { alert('Preencha nome e URL do favorito.'); return; }
      if (!/^https?:\/\//i.test(url)) url = `https://${url}`;
      const favorites = getFavoriteSites();
      favorites.push({ name, url });
      saveFavoriteSites(favorites);
      renderFavoriteSites();
      if (nameInput) nameInput.value = '';
      if (urlInput) urlInput.value = '';
    });

    document.addEventListener('click', (event) => {
      const panel = document.getElementById('favorite-sites-panel');
      const toggle = document.getElementById('favorite-sites-toggle');
      if (panel && !panel.classList.contains('hidden') && !panel.contains(event.target) && !toggle?.contains(event.target)) {
        panel.classList.add('hidden');
      }
    });

    renderFavoriteSites();

    // ==========================================
    // Sincronização opcional com Google Drive.
    // ==========================================
    const GOOGLE_CLIENT_ID = "#"; // <--- COLOQUE SEU CLIENT ID
    
    let googleAccessToken = null;
    let driveSyncFileId = null;

    // Função de Login e Inicialização do Google Sync
    function handleGoogleLogin() {
      if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes("SEU_CLIENT_ID_AQUI")) {
        alert("Configuração Necessária: Para sincronizar na nuvem, você precisa inserir seu GOOGLE_CLIENT_ID no código fonte ao baixar o projeto na sua máquina para manter a segurança das suas credênciais.");
        return;
      }
      
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.appdata',
        callback: (response) => {
          if (response && response.access_token) {
            googleAccessToken = response.access_token;
            
            const btn = document.getElementById('google-login-btn');
            btn.innerHTML = '✅ Nuvem Ativa';
            btn.classList.add('border-green-500', 'text-green-600', 'dark:text-green-400');
            btn.classList.remove('text-slate-700', 'dark:text-slate-300');
            
            loadFromGoogleDrive();
          }
        },
      });
      client.requestAccessToken();
    }

    // Busca o arquivo JSON oculto no Google Drive (App Data Folder)
    async function findSyncFile() {
       try {
         const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='dexi_sync_board.json'`, {
           headers: { 'Authorization': 'Bearer ' + googleAccessToken }
         });
         const data = await res.json();
         if (data.files && data.files.length > 0) {
           driveSyncFileId = data.files[0].id;
           return driveSyncFileId;
         }
       } catch(e) { console.error(e); }
       return null;
    }

    // Carrega o quadro infinito direto da nuvem
    async function loadFromGoogleDrive() {
      const fileId = await findSyncFile();
      if (fileId) {
        driveSyncFileId = fileId;
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
           headers: { 'Authorization': 'Bearer ' + googleAccessToken }
        });
        const text = await res.text();
        if (text && text.length > 10) {
          try {
            localStorage.setItem('dexi_codex_cards', text);
            localStorage.setItem('dexi_codex_cards_saved_at', String(Date.now()));
          } catch (error) { console.warn('Estado da nuvem mantido fora do localStorage:', error); }
          salvarSnapshotQuadroNoDb(text, Date.now());
          // Limpa tudo visualmente antes de carregar o novo
          document.querySelectorAll('.codex-card').forEach(c => c.remove());
          carregarEstadoDoStorage(text);
        }
      } else {
         // Primeira vez na nuvem, faz upload do estado local atual
         saveToGoogleDrive(localStorage.getItem('dexi_codex_cards') || '[]');
      }
    }

    // Faz upload do quadro para a nuvem
    async function saveToGoogleDrive(jsonData) {
      if (!googleAccessToken) return;
      try {
        const metadata = { name: 'dexi_sync_board.json', parents: ['appDataFolder'] };
        const file = new Blob([jsonData], { type: 'application/json' });
        
        if (!driveSyncFileId) await findSyncFile();

        const method = driveSyncFileId ? 'PATCH' : 'POST';
        const path = driveSyncFileId ? `/upload/drive/v3/files/${driveSyncFileId}` : '/upload/drive/v3/files';
        
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        const res = await fetch(`https://www.googleapis.com${path}?uploadType=multipart`, {
          method: method,
          headers: new Headers({ 'Authorization': 'Bearer ' + googleAccessToken }),
          body: form
        });
        const val = await res.json();
        if (val.id) driveSyncFileId = val.id;
      } catch (e) {
        console.error("Erro no sync de nuvem:", e);
      }
    }

    // Debounce para Sincronização Google
    let timerDriveSync = null;
    function agendarSyncDrive(data) {
       clearTimeout(timerDriveSync);
       // Aguarda 3 segundos após parar de mexer para sincronizar no Google e poupar API
       timerDriveSync = setTimeout(() => saveToGoogleDrive(data), 3000);
    }
    // ==========================================
    // FIM CONFIGURAÇÃO GOOGLE SYNC
    // ==========================================


    // Estado global do quadro: zoom, pan, seleção, toque e posição de criação.
    const canvas = document.getElementById('canvas');
    const boardWrapper = document.getElementById('board-wrapper');
    const canvasContainer = document.getElementById('canvas-container');
    
    let isPanning = false;
    let forcePanMode = false;
    let startX = 0, startY = 0;
    let panX = 0, panY = 0;
    let zoom = 1;
    let multiSelectMode = false;

    let mouseXCanvas = 200;
    let mouseYCanvas = 200;

    let touchStartDist = 0;
    let touchStartZoom = 1;
    let touchStartCenter = { x: 0, y: 0 };
    let isPinching = false;
    let isTwoFingerPanning = false;

    let boardWritingActive = false;
    let boardWritingMode = 'pen';
    let boardWritingDrawing = false;
    let boardWritingStart = null;
    let boardWritingSelection = null;
    let boardWritingSelectionSnapshot = null;
    let boardWritingCurrentStroke = [];
    let boardWritingStrokes = [];
    let boardWritingTexts = [];
    const boardUndoStack = [];
    let boardWritingSelectionMove = null;
    let activeStickyNote = null;
    let activeTextEditor = null;
    let boardSelectionJustCreated = false;
    const boardWritingLayer = document.getElementById('board-writing-layer');
    const boardWritingSvg = document.getElementById('board-writing-svg');
    const boardWritingSelectionEl = document.getElementById('board-writing-selection');
    const boardWritingContext = boardWritingLayer.getContext('2d');
    const boardWritingEdgeMargin = 240;
    const boardWritingGrowthStep = 2000;
    const boardWritingVirtualSize = 100000;
    let boardWritingWidth = boardWritingVirtualSize;
    let boardWritingHeight = boardWritingVirtualSize;
    let boardWritingPreviewPath = null;

    boardWritingSvg.setAttribute('width', boardWritingWidth);
    boardWritingSvg.setAttribute('height', boardWritingHeight);
    boardWritingSvg.style.width = `${boardWritingWidth}px`;
    boardWritingSvg.style.height = `${boardWritingHeight}px`;
    canvasContainer.style.width = `${boardWritingWidth}px`;
    canvasContainer.style.height = `${boardWritingHeight}px`;

    function createBoardWritingSvgPath(stroke) {
      if (!stroke.points.length) return null;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', stroke.points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x} ${point.y}`).join(' '));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', stroke.color);
      path.setAttribute('stroke-width', stroke.width);
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      return path;
    }

    function renderBoardWritingSvg() {
      boardWritingSvg.replaceChildren();
      boardWritingStrokes.forEach(stroke => {
        const path = createBoardWritingSvgPath(stroke);
        if (path) boardWritingSvg.appendChild(path);
      });
      boardWritingPreviewPath = null;
    }

    function updateBoardWritingSvgPreview(stroke) {
      if (!boardWritingPreviewPath) {
        boardWritingPreviewPath = createBoardWritingSvgPath(stroke);
        if (boardWritingPreviewPath) boardWritingSvg.appendChild(boardWritingPreviewPath);
        return;
      }
      boardWritingPreviewPath.setAttribute('d', stroke.points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x} ${point.y}`).join(' '));
      boardWritingPreviewPath.setAttribute('stroke', stroke.color);
      boardWritingPreviewPath.setAttribute('stroke-width', stroke.width);
    }

    function expandBoardWritingLayerIfNeeded(x, y) {
      const needsWidthGrowth = x >= boardWritingWidth - boardWritingEdgeMargin;
      const needsHeightGrowth = y >= boardWritingHeight - boardWritingEdgeMargin;
      if (!needsWidthGrowth && !needsHeightGrowth) return;

      while (x >= boardWritingWidth - boardWritingEdgeMargin) boardWritingWidth += boardWritingGrowthStep;
      while (y >= boardWritingHeight - boardWritingEdgeMargin) boardWritingHeight += boardWritingGrowthStep;
      boardWritingSvg.setAttribute('width', boardWritingWidth);
      boardWritingSvg.setAttribute('height', boardWritingHeight);
      boardWritingSvg.style.width = `${boardWritingWidth}px`;
      boardWritingSvg.style.height = `${boardWritingHeight}px`;
      canvasContainer.style.width = `${Math.max(canvasContainer.offsetWidth, boardWritingWidth)}px`;
      canvasContainer.style.height = `${Math.max(canvasContainer.offsetHeight, boardWritingHeight)}px`;
    }

    function getBoardWritingPosition(event) {
      const rect = canvasContainer.getBoundingClientRect();
      const point = event.touches ? event.touches[0] : event;
      const rawX = (point.clientX - rect.left) / zoom;
      const rawY = (point.clientY - rect.top) / zoom;
      expandBoardWritingLayerIfNeeded(rawX, rawY);
      return {
        x: rawX,
        y: rawY
      };
    }

    function pushBoardUndoSnapshot() {
      boardUndoStack.push({
        type: 'writing',
        strokes: JSON.parse(JSON.stringify(boardWritingStrokes)),
        texts: JSON.parse(JSON.stringify(boardWritingTexts))
      });
      if (boardUndoStack.length > 50) boardUndoStack.shift();
    }

    function undoBoardAction() {
      const action = boardUndoStack.pop();
      if (!action) return;
      if (action.type === 'writing') {
        boardWritingStrokes = action.strokes;
        boardWritingTexts = action.texts;
        renderBoardWriting();
        renderBoardWritingTexts();
        saveBoardWriting();
        saveBoardWritingTexts();
      } else if (action.type === 'cards') {
        action.ids.forEach(id => document.querySelector(`[data-board-undo-id="${id}"]`)?.remove());
        salvarEstadoNoStorage();
      }
    }

    function pushPastedCardsUndo(beforeCards) {
      const ids = Array.from(document.querySelectorAll('.codex-card'))
        .filter(card => !beforeCards.has(card))
        .map(card => card.dataset.boardUndoId)
        .filter(Boolean);
      if (!ids.length) return;
      boardUndoStack.push({ type: 'cards', ids });
      if (boardUndoStack.length > 50) boardUndoStack.shift();
    }

    function updateBoardWritingSelection(start, end) {
      const left = Math.min(start.x, end.x);
      const top = Math.min(start.y, end.y);
      const width = Math.abs(end.x - start.x);
      const height = Math.abs(end.y - start.y);
      boardWritingSelection = { left, top, width, height };
      boardWritingSelectionEl.style.display = 'block';
      boardWritingSelectionEl.style.left = `${left}px`;
      boardWritingSelectionEl.style.top = `${top}px`;
      boardWritingSelectionEl.style.width = `${width}px`;
      boardWritingSelectionEl.style.height = `${height}px`;
      boardWritingSelectionEl.style.pointerEvents = 'none';
      const minSize = 5;
      document.getElementById('download-board-selection').disabled = width < minSize || height < minSize;
    }

    function hideBoardWritingSelection() {
      boardWritingSelectionEl.style.display = 'none';
      boardWritingSelectionEl.style.pointerEvents = 'none';
      boardWritingSelection = null;
      boardWritingSelectionSnapshot = null;
      document.getElementById('download-board-selection').disabled = true;
    }

    function drawBoardStroke(stroke) {
      if (stroke.points.length === 0) return;
      boardWritingContext.beginPath();
      boardWritingContext.moveTo(stroke.points[0].x, stroke.points[0].y);
      stroke.points.slice(1).forEach(point => boardWritingContext.lineTo(point.x, point.y));
      boardWritingContext.lineCap = 'round';
      boardWritingContext.lineJoin = 'round';
      boardWritingContext.strokeStyle = stroke.color;
      boardWritingContext.lineWidth = stroke.width;
      boardWritingContext.stroke();
    }

    function renderBoardWriting() {
      boardWritingContext.clearRect(0, 0, boardWritingLayer.width, boardWritingLayer.height);
      boardWritingStrokes.forEach(drawBoardStroke);
      renderBoardWritingSvg();
    }

    function saveBoardWriting() {
      localStorage.setItem('dexi_board_writing_strokes', JSON.stringify(boardWritingStrokes));
    }

    // Persiste e renderiza caixas de texto livres junto às camadas de desenho.
    function saveBoardWritingTexts() {
      localStorage.setItem('dexi_board_writing_texts', JSON.stringify(boardWritingTexts));
    }

    function resizeBoardTextInput(textarea) {
      if (textarea.dataset.manualSize === 'true') return;
      const style = getComputedStyle(textarea);
      boardWritingContext.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      const widestLine = textarea.value.split('\n').reduce((width, line) => Math.max(width, boardWritingContext.measureText(line || ' ').width), 0);
      const maxWidth = Math.max(80, Math.min(520, (window.innerWidth * 0.72) / zoom));
      textarea.style.width = `${Math.min(maxWidth, Math.max(24, widestLine + 12))}px`;
      textarea.style.height = 'auto';
      textarea.style.height = `${Math.max(30, textarea.scrollHeight)}px`;
    }

    function getBoardTextFontSize() {
      const pxValue = Number(document.getElementById('board-stroke-width').value) || 4;
      return Math.max(12, Math.min(120, pxValue * 4));
    }

    function getActiveBoardText() {
      if (boardWritingMode !== 'text' || !activeTextEditor) return null;
      const textId = activeTextEditor.closest('.board-text-element')?.dataset.textId;
      return boardWritingTexts.find(item => item.id === textId) || null;
    }

    document.getElementById('board-stroke-width').addEventListener('input', () => {
      const text = getActiveBoardText();
      if (!text) return;
      text.fontSize = getBoardTextFontSize();
      activeTextEditor.style.fontSize = `${text.fontSize}px`;
      resizeBoardTextInput(activeTextEditor);
      saveBoardWritingTexts();
    });

    document.getElementById('board-stroke-color').addEventListener('input', event => {
      const text = getActiveBoardText();
      if (!text) return;
      text.color = event.target.value;
      activeTextEditor.style.color = text.color;
      saveBoardWritingTexts();
    });

    function renderBoardWritingTexts() {
      const textElements = document.querySelectorAll('.board-text-element');
      textElements.forEach(el => {
        const textId = el.dataset.textId;
        const textData = boardWritingTexts.find(t => t.id === textId);
        if (!textData) el.remove();
      });
      boardWritingTexts.forEach(text => {
        let textEl = document.querySelector(`[data-text-id="${text.id}"]`);
        if (!textEl) {
          textEl = document.createElement('div');
          textEl.className = 'board-text-element';
          textEl.dataset.textId = text.id;
          textEl.style.position = 'absolute';
          textEl.style.left = `${text.x}px`;
          textEl.style.top = `${text.y}px`;
          textEl.style.zIndex = '40';
          const textarea = document.createElement('textarea');
          textarea.className = 'board-text-input';
          textarea.value = text.content;
          textarea.rows = 1;
          textarea.dataset.manualSize = text.manualSize ? 'true' : 'false';
          textarea.style.fontSize = `${text.fontSize || 16}px`;
          if (text.color) textarea.style.color = text.color;
          if (text.manualSize && text.width && text.height) {
            textarea.style.width = `${text.width}px`;
            textarea.style.height = `${text.height}px`;
          }
          textarea.spellcheck = true;
          textarea.setAttribute('aria-label', 'Texto no quadro');
          textarea.addEventListener('pointerdown', event => event.stopPropagation());
          textarea.addEventListener('mousedown', event => event.stopPropagation());
          textarea.addEventListener('touchstart', event => event.stopPropagation(), { passive: true });
          textarea.addEventListener('click', event => {
            if (!boardWritingActive || boardWritingMode !== 'select') return;
            event.preventDefault();
            event.stopPropagation();
            const bounds = textarea.getBoundingClientRect();
            const rect = canvasContainer.getBoundingClientRect();
            const left = (bounds.left - rect.left) / zoom;
            const top = (bounds.top - rect.top) / zoom;
            updateBoardWritingSelection(
              { x: left, y: top },
              { x: left + textarea.offsetWidth, y: top + textarea.offsetHeight }
            );
            boardSelectionJustCreated = true;
          });
          textarea.addEventListener('focus', () => { activeTextEditor = textarea; });
          textarea.addEventListener('input', () => {
            text.content = textarea.value;
            resizeBoardTextInput(textarea);
            saveBoardWritingTexts();
          });
          let pointerStartSize = null;
          textarea.addEventListener('pointerdown', () => {
            pointerStartSize = { width: textarea.offsetWidth, height: textarea.offsetHeight };
          });
          const persistManualSize = () => {
            if (textarea.offsetWidth <= 0 || textarea.offsetHeight <= 0) return;
            if (!pointerStartSize || (Math.abs(textarea.offsetWidth - pointerStartSize.width) < 2 && Math.abs(textarea.offsetHeight - pointerStartSize.height) < 2)) return;
            text.width = textarea.offsetWidth;
            text.height = textarea.offsetHeight;
            text.manualSize = true;
            textarea.dataset.manualSize = 'true';
            saveBoardWritingTexts();
            pointerStartSize = null;
          };
          textarea.addEventListener('pointerup', persistManualSize);
          textarea.addEventListener('blur', () => saveBoardTextElement(text.id));
          textarea.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
              if (!textarea.value.trim()) deleteBoardTextElement(text.id);
              else textarea.blur();
            } else if (event.key === 'Backspace' && !textarea.value && event.target.selectionStart === 0) {
              deleteBoardTextElement(text.id);
            }
          });
          textEl.appendChild(textarea);
          canvasContainer.appendChild(textEl);
          resizeBoardTextInput(textarea);
        }
        textEl.style.left = `${text.x}px`;
        textEl.style.top = `${text.y}px`;
      });
    }

    window.createBoardTextElement = function(x, y) {
      if (boardWritingMode !== 'text') return;
      pushBoardUndoSnapshot();
      const textId = Date.now().toString();
      boardWritingTexts.push({
        id: textId,
        x: x,
        y: y,
        content: '',
        fontSize: getBoardTextFontSize(),
        color: getBoardInkColor(),
        manualSize: false
      });
      renderBoardWritingTexts();
      const textarea = document.querySelector(`[data-text-id="${textId}"] .board-text-input`);
      if (textarea) {
        textarea.focus();
        activeTextEditor = textarea;
      }
      saveBoardWritingTexts();
    };

    window.saveBoardTextElement = function(textId) {
      const textData = boardWritingTexts.find(t => t.id === textId);
      if (textData) {
        const textarea = document.querySelector(`[data-text-id="${textId}"] .board-text-input`);
        if (textarea) {
          textData.content = textarea.value;
          saveBoardWritingTexts();
        }
      }
      const editor = activeTextEditor;
      if (editor?.closest('.board-text-element')?.dataset.textId === textId) {
        setTimeout(() => {
          if (activeTextEditor !== editor) return;
          const focusedElement = document.activeElement;
          if (focusedElement?.id !== 'board-stroke-width' && focusedElement?.id !== 'board-stroke-color') activeTextEditor = null;
        }, 0);
      }
    };

    window.deleteBoardTextElement = function(textId) {
      boardWritingTexts = boardWritingTexts.filter(t => t.id !== textId);
      const textEl = document.querySelector(`[data-text-id="${textId}"]`);
      if (textEl) textEl.remove();
      if (activeTextEditor?.closest('.board-text-element')?.dataset.textId === textId) activeTextEditor = null;
      saveBoardWritingTexts();
    };

    function getBoardInkColor() {
      const colorInput = document.getElementById('board-stroke-color');
      if (colorInput && colorInput.value) {
        return colorInput.value;
      }
      return document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000';
    }

    function atualizarTracosPadraoPeloTema(previousDark) {
      const nextColor = document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000';
      const previousColors = previousDark ? ['#ffffff', '#fff'] : ['#000000', '#000', '#1e293b'];
      let changed = false;
      boardWritingStrokes.forEach(stroke => {
        if (previousColors.includes(String(stroke.color).toLowerCase())) {
          stroke.color = nextColor;
          changed = true;
        }
      });
      if (changed) {
        renderBoardWriting();
        saveBoardWriting();
      }
    }

    function persistBoardWritingBeforeExit() {
      if (boardWritingMode === 'pen' && boardWritingCurrentStroke.length > 0) {
        boardWritingStrokes.push({
          points: boardWritingCurrentStroke,
          color: getBoardInkColor(),
          width: Number(document.getElementById('board-stroke-width').value)
        });
        boardWritingCurrentStroke = [];
      }
      saveBoardWriting();
    }

    window.addEventListener('pagehide', persistBoardWritingBeforeExit);
    window.addEventListener('beforeunload', persistBoardWritingBeforeExit);

    function loadBoardWriting() {
      try {
        const savedStrokes = JSON.parse(localStorage.getItem('dexi_board_writing_strokes') || '[]');
        if (Array.isArray(savedStrokes)) boardWritingStrokes = savedStrokes;
      } catch (error) {
        boardWritingStrokes = [];
      }
      try {
        const savedTexts = JSON.parse(localStorage.getItem('dexi_board_writing_texts') || '[]');
        if (Array.isArray(savedTexts)) boardWritingTexts = savedTexts;
      } catch (error) {
        boardWritingTexts = [];
      }
      const furthestPoint = boardWritingStrokes.reduce((furthest, stroke) => {
        stroke.points.forEach(point => {
          furthest.x = Math.max(furthest.x, point.x);
          furthest.y = Math.max(furthest.y, point.y);
        });
        return furthest;
      }, { x: 0, y: 0 });
      expandBoardWritingLayerIfNeeded(furthestPoint.x, furthestPoint.y);
      renderBoardWriting();
      renderBoardWritingTexts();
      const legacyData = localStorage.getItem('dexi_board_writing');
      if (legacyData) {
        const image = new Image();
        image.onload = () => boardWritingContext.drawImage(image, 0, 0);
        image.src = legacyData;
      }
    }

    function selecionarStickyNote(card) {
      activeStickyNote = card;
    }

    window.aplicarEstiloSticky = function(card, property, value) {
      if (!card) return;
      const textarea = card.querySelector('.sticky-note-textarea');
      const body = card.querySelector('.sticky-note-body');
      if (!textarea || !body) return;
      const datasetKey = {
        background: 'stickyBackground',
        color: 'stickyTextColor',
        fontFamily: 'stickyFontFamily',
        fontSize: 'stickyFontSize',
        fontWeight: 'stickyFontWeight',
        fontStyle: 'stickyFontStyle',
        textDecoration: 'stickyTextDecoration'
      }[property];
      if (datasetKey) card.dataset[datasetKey] = value;
      if (property === 'background') body.style.backgroundColor = value;
      if (property === 'color') textarea.style.color = value;
      if (property === 'fontFamily') textarea.style.fontFamily = value;
      if (property === 'fontSize') textarea.style.fontSize = `${value}px`;
      if (property === 'fontWeight') textarea.style.fontWeight = value;
      if (property === 'fontStyle') textarea.style.fontStyle = value;
      if (property === 'textDecoration') textarea.style.textDecoration = value;
      salvarEstadoNoStorage();
    };

    window.alternarEstiloSticky = function(card, property) {
      if (!card) return;
      const textarea = card.querySelector('.sticky-note-textarea');
      if (!textarea) return;
      const values = {
        fontWeight: ['400', '700'],
        fontStyle: ['normal', 'italic'],
        textDecoration: ['none', 'underline']
      }[property];
      const nextValue = textarea.style[property] === values[1] ? values[0] : values[1];
      aplicarEstiloSticky(card, property, nextValue);
      const button = card.querySelector(`[data-sticky-style="${property}"]`);
      if (button) button.classList.toggle('active', nextValue === values[1]);
    };

    window.toggleBoardWriting = function(active) {
      boardWritingActive = active;
      localStorage.setItem('dexi_board_writing_active', active ? 'true' : 'false');
      document.getElementById('writing-toolbar').classList.toggle('hidden', !active);
      document.getElementById('writing-toolbar').classList.toggle('flex', active);
      boardWritingLayer.style.pointerEvents = active ? 'auto' : 'none';
      boardWritingSvg.style.pointerEvents = active ? 'auto' : 'none';
      boardWrapper.style.cursor = active ? 'crosshair' : '';
      if (!active) boardWrapper.classList.remove('writing-eraser');
      if (!active) {
        boardWritingDrawing = false;
        boardWritingSelectionEl.style.display = 'none';
        boardWritingSelection = null;
        document.getElementById('download-board-selection').disabled = true;
      }
      setBoardWritingMode('pen');
    };

    window.setBoardWritingMode = function(mode) {
      boardWritingMode = mode;
      boardWrapper.classList.toggle('writing-eraser', mode === 'eraser' && boardWritingActive);
      document.querySelectorAll('[data-writing-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.writingMode === mode);
      });
      boardWritingLayer.style.pointerEvents = 'none';
      boardWritingSvg.style.pointerEvents = mode === 'text' ? 'none' : (boardWritingActive ? 'auto' : 'none');
      if (mode === 'move') {
        boardWritingSvg.style.cursor = 'grab';
        boardWrapper.style.cursor = 'grab';
        return;
      }
      boardWritingSvg.style.cursor = mode === 'select' ? 'crosshair' : (mode === 'eraser' ? 'cell' : (mode === 'text' ? 'text' : 'crosshair'));
      if (mode === 'pen' && boardWritingActive) {
        boardWritingSvg.style.pointerEvents = 'auto';
        boardWrapper.style.cursor = 'crosshair';
      }
    };

    function startBoardWriting(event) {
      if (!boardWritingActive) return;
      if (boardWritingMode === 'text') return;
      if (event.target.closest?.('.codex-card, .board-text-element, #writing-toolbar')) return;
      if (event.touches && event.touches.length > 1) {
        boardWritingDrawing = false;
        boardWritingCurrentStroke = [];
        return;
      }
      event.stopPropagation();
      if (event.cancelable) event.preventDefault();
      const position = getBoardWritingPosition(event);
      if (boardWritingMode === 'select' && boardWritingSelection &&
          position.x >= boardWritingSelection.left && position.x <= boardWritingSelection.left + boardWritingSelection.width &&
          position.y >= boardWritingSelection.top && position.y <= boardWritingSelection.top + boardWritingSelection.height) {
        pushBoardUndoSnapshot();
        const selectedStrokeIndexes = boardWritingStrokes.reduce((indexes, stroke, index) => {
          if (stroke.points.some(point => point.x >= boardWritingSelection.left && point.x <= boardWritingSelection.left + boardWritingSelection.width && point.y >= boardWritingSelection.top && point.y <= boardWritingSelection.top + boardWritingSelection.height)) indexes.push(index);
          return indexes;
        }, []);
        const selectedTexts = boardWritingTexts.filter(text => text.x >= boardWritingSelection.left && text.x <= boardWritingSelection.left + boardWritingSelection.width && text.y >= boardWritingSelection.top && text.y <= boardWritingSelection.top + boardWritingSelection.height);
        boardWritingSelectionMove = {
          start: position,
          selection: { ...boardWritingSelection },
          strokes: selectedStrokeIndexes.map(index => ({ index, points: boardWritingStrokes[index].points.map(point => ({ ...point })) })),
          texts: selectedTexts.map(text => ({ id: text.id, x: text.x, y: text.y }))
        };
        boardWritingDrawing = true;
        return;
      }
      boardWritingStart = position;
      boardWritingDrawing = true;
      if (boardWritingMode === 'eraser') {
        pushBoardUndoSnapshot();
        eraseBoardWritingAt(position);
        return;
      }
      if (boardWritingMode === 'select') {
        updateBoardWritingSelection(position, position);
        return;
      }
      if (boardWritingMode === 'move') {
        isPanning = true;
        const pageX = event.touches ? event.touches[0].pageX : event.pageX;
        const pageY = event.touches ? event.touches[0].pageY : event.pageY;
        startX = pageX - panX;
        startY = pageY - panY;
        return;
      }
      if (boardWritingMode === 'pen') pushBoardUndoSnapshot();
      boardWritingCurrentStroke = [position];
    }

    function createBoardTextOnDoubleClick(event) {
      if (!boardWritingActive || boardWritingMode !== 'text') return;
      if (!(event.target instanceof Element) || event.target.closest('.codex-card, .board-text-element, #writing-toolbar, button, input, select')) return;
      event.preventDefault();
      event.stopPropagation();
      if (activeTextEditor) {
        const activeElement = activeTextEditor.closest('.board-text-element');
        if (activeElement) saveBoardTextElement(activeElement.dataset.textId);
      }
      const position = getBoardWritingPosition(event);
      createBoardTextElement(position.x, position.y);
    }

    function eraseBoardWritingAt(position) {
      const eraserRadius = Math.max(8, Number(document.getElementById('board-stroke-width').value) * 2);
      const hitText = boardWritingTexts.find(text => {
        const textElement = document.querySelector(`[data-text-id="${CSS.escape(text.id)}"] .board-text-input`);
        const width = textElement?.offsetWidth || 24;
        const height = textElement?.offsetHeight || 30;
        return position.x >= text.x - eraserRadius && position.x <= text.x + width + eraserRadius &&
          position.y >= text.y - eraserRadius && position.y <= text.y + height + eraserRadius;
      });
      if (hitText) window.deleteBoardTextElement(hitText.id);
      const remainingStrokes = boardWritingStrokes.filter(stroke => {
        const hitRadius = eraserRadius + (stroke.width / 2);
        return !stroke.points.some(point => {
          const dx = point.x - position.x;
          const dy = point.y - position.y;
          return (dx * dx) + (dy * dy) <= hitRadius * hitRadius;
        });
      });
      if (remainingStrokes.length !== boardWritingStrokes.length) {
        boardWritingStrokes = remainingStrokes;
        renderBoardWriting();
        saveBoardWriting();
      }
    }

    function moveBoardWriting(event) {
      if (!boardWritingDrawing) return;
      event.stopPropagation();
      if (event.cancelable) event.preventDefault();
      if (boardWritingMode === 'text' || boardWritingMode === 'move') {
        if (boardWritingMode === 'move') {
          const pageX = event.touches ? event.touches[0].pageX : event.pageX;
          const pageY = event.touches ? event.touches[0].pageY : event.pageY;
          panX = pageX - startX;
          panY = pageY - startY;
          updateTransform();
        }
        return;
      }
      const position = getBoardWritingPosition(event);
      if (boardWritingSelectionMove) {
        const deltaX = position.x - boardWritingSelectionMove.start.x;
        const deltaY = position.y - boardWritingSelectionMove.start.y;
        boardWritingSelectionMove.strokes.forEach(({ index, points }) => {
          boardWritingStrokes[index].points = points.map(point => ({ x: point.x + deltaX, y: point.y + deltaY }));
        });
        boardWritingSelectionMove.texts.forEach(original => {
          const text = boardWritingTexts.find(item => item.id === original.id);
          if (text) { text.x = original.x + deltaX; text.y = original.y + deltaY; }
        });
        updateBoardWritingSelection(
          { x: boardWritingSelectionMove.selection.left + deltaX, y: boardWritingSelectionMove.selection.top + deltaY },
          { x: boardWritingSelectionMove.selection.left + boardWritingSelectionMove.selection.width + deltaX, y: boardWritingSelectionMove.selection.top + boardWritingSelectionMove.selection.height + deltaY }
        );
        renderBoardWriting();
        renderBoardWritingTexts();
        return;
      }
      if (boardWritingMode === 'eraser') {
        eraseBoardWritingAt(position);
        return;
      }
      if (boardWritingMode === 'select') {
        updateBoardWritingSelection(boardWritingStart, position);
        return;
      }
      boardWritingCurrentStroke.push(position);
      const previewStroke = {
        points: boardWritingCurrentStroke,
        color: getBoardInkColor(),
        width: Number(document.getElementById('board-stroke-width').value)
      };
      updateBoardWritingSvgPreview(previewStroke);
    }

    function stopBoardWriting(event) {
      if (!boardWritingDrawing) return;
      if (event) event.stopPropagation();
      boardWritingDrawing = false;
      if (boardWritingMode === 'select' && boardWritingSelection) {
        boardSelectionJustCreated = true;
      }
      if (boardWritingSelectionMove) {
        boardWritingSelectionMove = null;
        renderBoardWriting();
        renderBoardWritingTexts();
        saveBoardWriting();
        saveBoardWritingTexts();
      }
      if (boardWritingMode === 'pen' && boardWritingCurrentStroke.length > 0) {
        boardWritingStrokes.push({
          points: boardWritingCurrentStroke,
          color: getBoardInkColor(),
          width: Number(document.getElementById('board-stroke-width').value)
        });
        renderBoardWriting();
        saveBoardWriting();
      }
      if (boardWritingMode === 'move') {
        isPanning = false;
      }
      boardWritingCurrentStroke = [];
    }

    boardWrapper.addEventListener('mousedown', startBoardWriting);
    boardWrapper.addEventListener('dblclick', createBoardTextOnDoubleClick);
    boardWrapper.addEventListener('mousemove', moveBoardWriting);
    boardWrapper.addEventListener('mouseup', stopBoardWriting);
    boardWrapper.addEventListener('mouseleave', stopBoardWriting);
    boardWrapper.addEventListener('touchstart', startBoardWriting, { passive: false });
    boardWrapper.addEventListener('touchmove', moveBoardWriting, { passive: false });
    boardWrapper.addEventListener('touchend', stopBoardWriting, { passive: false });

    window.clearBoardWriting = function() {
      pushBoardUndoSnapshot();
      // Salva os traços e textos antes de limpar
      if (boardWritingStrokes.length > 0 || boardWritingTexts.length > 0) {
        const timestamp = new Date().toLocaleString('pt-BR');
        const clearedItem = {
          id: Date.now(),
          type: 'drawing',
          timestamp: timestamp,
          strokes: JSON.parse(JSON.stringify(boardWritingStrokes)),
          texts: JSON.parse(JSON.stringify(boardWritingTexts)),
          title: `Desenho (${boardWritingStrokes.length} traço${boardWritingStrokes.length > 1 ? 's' : ''} + ${boardWritingTexts.length} texto${boardWritingTexts.length > 1 ? 's' : ''})`
        };
        deletedItems.unshift(clearedItem);
        if (deletedItems.length > MAX_DELETED_ITEMS) {
          deletedItems = deletedItems.slice(0, MAX_DELETED_ITEMS);
        }
        try {
          localStorage.setItem('dexi_deleted_items', JSON.stringify(deletedItems));
        } catch (e) {
          console.warn("Erro ao salvar histórico de deletados:", e);
        }
      }
      
      boardWritingStrokes = [];
      boardWritingTexts = [];
      boardWritingCurrentStroke = [];
      boardWritingContext.clearRect(0, 0, boardWritingLayer.width, boardWritingLayer.height);
      renderBoardWritingSvg();
      document.querySelectorAll('.board-text-element').forEach(el => el.remove());
      localStorage.removeItem('dexi_board_writing_strokes');
      localStorage.removeItem('dexi_board_writing_texts');
      hideBoardWritingSelection();
    };

    // Compõe traços e textos dentro da seleção num canvas exportável.
    window.downloadBoardSelection = function() {
      const selection = boardWritingSelection || boardWritingSelectionSnapshot;
      console.log("downloadBoardSelection chamada");
      console.log("selection:", selection);
      console.log("boardWritingStrokes:", boardWritingStrokes.length);
      
      const minSelectionSize = 5;
      if (!selection || selection.width < minSelectionSize || selection.height < minSelectionSize) {
        console.error("Seleção inválida:", selection);
        alert("⚠️ Selecione uma área maior para baixar!");
        return null;
      }
      
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = Math.ceil(selection.width);
      finalCanvas.height = Math.ceil(selection.height);
      const finalContext = finalCanvas.getContext('2d');
      if (!finalContext) {
        console.error("Contexto 2D não disponível");
        return null;
      }
      
      finalContext.fillStyle = '#ffffff';
      finalContext.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

      finalContext.save();
      finalContext.beginPath();
      finalContext.rect(0, 0, finalCanvas.width, finalCanvas.height);
      finalContext.clip();
      
      const selectionStrokes = boardWritingStrokes.filter(stroke => {
        if (!stroke.points || stroke.points.length === 0) return false;
        return stroke.points.some(point => 
          point.x >= selection.left &&
          point.x <= selection.left + selection.width &&
          point.y >= selection.top &&
          point.y <= selection.top + selection.height
        );
      });
      
      console.log("Traços selecionados:", selectionStrokes.length);
      
      selectionStrokes.forEach(stroke => {
        if (stroke.points.length === 0) return;
        const exportedStrokeColor = (stroke.color && (stroke.color.toLowerCase() === '#ffffff' || stroke.color.toLowerCase() === '#fff')) ? '#000000' : (stroke.color || '#000000');
        finalContext.beginPath();
        finalContext.moveTo(
          stroke.points[0].x - selection.left,
          stroke.points[0].y - selection.top
        );
        stroke.points.slice(1).forEach(point => {
          finalContext.lineTo(
            point.x - selection.left,
            point.y - selection.top
          );
        });
        finalContext.lineCap = 'round';
        finalContext.lineJoin = 'round';
        finalContext.strokeStyle = exportedStrokeColor;
        finalContext.lineWidth = stroke.width || 2;
        finalContext.stroke();
      });

      const selectedTexts = boardWritingTexts.filter(text => {
        const textarea = document.querySelector(`[data-text-id="${CSS.escape(text.id)}"] .board-text-input`);
        const textWidth = text.width || textarea?.offsetWidth || 24;
        const textHeight = text.height || textarea?.offsetHeight || (text.fontSize || 16) * 1.8;
        return text.x < selection.left + selection.width && text.x + textWidth > selection.left &&
          text.y < selection.top + selection.height && text.y + textHeight > selection.top;
      });

      selectedTexts.forEach(text => {
        const textarea = document.querySelector(`[data-text-id="${CSS.escape(text.id)}"] .board-text-input`);
        const style = textarea ? getComputedStyle(textarea) : null;
        const fontSize = parseFloat(style?.fontSize) || text.fontSize || 16;
        const fontFamily = style?.fontFamily || 'sans-serif';
        const fontWeight = style?.fontWeight || '400';
        const textColor = style?.color || '#000000';
        finalContext.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        finalContext.fillStyle = /rgba?\(\s*255\s*,\s*255\s*,\s*255/i.test(textColor) || textColor.toLowerCase() === '#fff' || textColor.toLowerCase() === '#ffffff'
          ? '#000000'
          : textColor;
        finalContext.textBaseline = 'alphabetic';

        const maxTextWidth = Math.max(8, (text.width || textarea?.offsetWidth || 520) - 10);
        const lineHeight = parseFloat(style?.lineHeight) || fontSize * 1.4;
        const lines = [];
        String(text.content || '').split('\n').forEach(paragraph => {
          const words = paragraph.split(/\s+/);
          let line = '';
          words.forEach(word => {
            const candidate = line ? `${line} ${word}` : word;
            if (line && finalContext.measureText(candidate).width > maxTextWidth) {
              lines.push(line);
              line = word;
            } else {
              line = candidate;
            }
          });
          lines.push(line);
        });

        const offsetX = (textarea ? parseFloat(style.paddingLeft) : 5) || 5;
        const offsetY = (textarea ? parseFloat(style.paddingTop) : 3) || 3;
        lines.forEach((line, index) => {
          finalContext.fillText(
            line,
            text.x + offsetX - selection.left,
            text.y + offsetY + fontSize + index * lineHeight - selection.top,
            maxTextWidth
          );
        });
      });
      finalContext.restore();
      
      console.log("Canvas criado com sucesso");
      return finalCanvas;
    };

    window.abrirModalDownloadFormat = function() {
      console.log("Abrindo modal de download");
      const activeSelection = boardWritingSelection || boardWritingSelectionSnapshot;
      console.log("boardWritingSelection:", activeSelection);
      
      const minSelectionSize = 5;
      if (!activeSelection || activeSelection.width < minSelectionSize || activeSelection.height < minSelectionSize) {
        alert("⚠️ Nenhuma seleção válida. Faça uma seleção maior primeiro!");
        return;
      }

      boardWritingSelectionSnapshot = { ...activeSelection };
      document.getElementById('download-format-modal').classList.remove('hidden');
    };

    window.fecharModalDownloadFormat = function() {
      console.log("Fechando modal de download");
      document.getElementById('download-format-modal').classList.add('hidden');
    };

    // Converte o canvas selecionado para PNG, JPG ou PDF e inicia o download.
    window.executarDownloadBoard = function(format) {
      console.log("Executando download no formato:", format);
      
      try {
        const canvas = downloadBoardSelection();
        if (!canvas) {
          console.error("Canvas não foi criado");
          alert("Erro: não foi possível criar a imagem");
          return;
        }
        
        console.log("Canvas criado, size:", canvas.width, "x", canvas.height);
        
        fecharModalDownloadFormat();
        
        const timestamp = Date.now();
        
        if (format === 'png') {
          try {
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `dexi-nota-${timestamp}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            console.log("PNG baixado");
            hideBoardWritingSelection();
          } catch (e) {
            console.error("Erro ao gerar PNG:", e);
            alert("Erro ao gerar PNG: " + e.message);
          }
        } else if (format === 'jpg') {
          try {
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            link.download = `dexi-nota-${timestamp}.jpg`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            console.log("JPG baixado");
            hideBoardWritingSelection();
          } catch (e) {
            console.error("Erro ao gerar JPG:", e);
            alert("Erro ao gerar JPG: " + e.message);
          }
        } else if (format === 'pdf') {
          try {
            if (!window.jspdf || !window.jspdf.jsPDF) {
              alert('Erro: jsPDF não está disponível');
              console.error("jsPDF não disponível");
              return;
            }
            
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const width = canvas.width;
            const height = canvas.height;
            const ratio = width / height;
            
            // Calcula dimensões para caber no A4
            let pdfWidth = 190; // margem de 10mm
            let pdfHeight = pdfWidth / ratio;
            
            if (pdfHeight > 277) {
              pdfHeight = 277;
              pdfWidth = pdfHeight * ratio;
            }
            
            const xOffset = (210 - pdfWidth) / 2;
            const yOffset = (297 - pdfHeight) / 2;
            
            pdf.addImage(imgData, 'JPEG', xOffset, yOffset, pdfWidth, pdfHeight);
            pdf.save(`dexi-nota-${timestamp}.pdf`);
            console.log("PDF baixado");
            hideBoardWritingSelection();
          } catch (e) {
            console.error("Erro ao gerar PDF:", e);
            alert("Erro ao gerar PDF: " + e.message);
          }
        }
      } catch (e) {
        console.error("Erro geral ao baixar:", e);
        alert("Erro ao baixar: " + e.message);
      }
    };

    loadBoardWriting();
    if (localStorage.getItem('dexi_board_writing_active') === 'true') {
      toggleBoardWriting(true);
    }

    // Configurações das folhas usadas pelas notas locais e pelo editor TLDraw.
    const paperConfigs = {
        'A4': { canvasW: 794, canvasH: 1123, cssW: 340, cssH: 481, cardW: 400, cardH: 565 },
        'Carta': { canvasW: 816, canvasH: 1056, cssW: 340, cssH: 440, cardW: 400, cardH: 520 },
        'Quadro': { canvasW: 4000, canvasH: 4000, cssW: 2000, cssH: 2000, cardW: 600, cardH: 500 }
    };

    // IndexedDB guarda arquivos binários, como PDFs e vídeos, fora do localStorage.
    let db;
    let resolveDexiDatabase;
    const dexiDatabaseReady = new Promise(resolve => { resolveDexiDatabase = resolve; });
    let boardRestoreStarted = false;
    function iniciarRestauracaoDoQuadro() {
      if (boardRestoreStarted) return;
      boardRestoreStarted = true;
      carregarEstadoDoStorage();
    }
    const dbRequest = indexedDB.open("DexiDatabase");
    dbRequest.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("pdfs")) db.createObjectStore("pdfs");
      if (!db.objectStoreNames.contains("media")) db.createObjectStore("media");
    };
    dbRequest.onsuccess = (e) => {
      db = e.target.result;
      db.onversionchange = () => db.close();
      resolveDexiDatabase(db);
      iniciarRestauracaoDoQuadro();
    };
    dbRequest.onerror = (e) => {
      console.error("Erro ao abrir IndexedDB", e);
      resolveDexiDatabase(null);
      iniciarRestauracaoDoQuadro();
    };
    dbRequest.onblocked = () => {
      console.warn('A abertura do IndexedDB está aguardando outra aba do Dexi fechar.');

    async function guardarPdfNoDb(id, blob) {
      await solicitarArmazenamentoPersistente();
      const database = db || await dexiDatabaseReady;
      if (!database) {
        folderFileMemoryCache.set(id, blob);
        lastMediaStorageFailure = 'IndexedDB indisponível ou bloqueado';
        return false;
      }
      return new Promise(resolve => {
        let settled = false;
        const fallback = error => {
          if (settled) return;
          settled = true;
          folderFileMemoryCache.set(id, blob);
          lastMediaStorageFailure = descreverFalhaDeArmazenamento(error);
          resolve(false);
        };
        try {
          const transaction = database.transaction(['pdfs'], 'readwrite');
          const request = transaction.objectStore('pdfs').put(blob, id);
          request.onsuccess = () => {};
          transaction.oncomplete = () => { if (!settled) { settled = true; resolve(true); } };
          transaction.onerror = () => fallback(transaction.error);
          transaction.onabort = () => fallback(transaction.error);
        } catch (error) {
          fallback(error);
        }
      });
    }

    const folderFileMemoryCache = new Map();
    let persistentStorageRequest = null;
    let lastMediaStorageFailure = 'falha anterior de armazenamento (motivo não registrado)';

    function descreverFalhaDeArmazenamento(error) {
      if (!error) return 'transação do IndexedDB abortada';
      return `${error.name || 'Erro'}${error.message ? `: ${error.message}` : ''}`;
    }

    async function solicitarArmazenamentoPersistente() {
      if (!persistentStorageRequest) {
        persistentStorageRequest = (async () => {
          try {
            if (!navigator.storage?.persist || !navigator.storage?.persisted) return false;
            if (await navigator.storage.persisted()) return true;
            return await navigator.storage.persist();
          } catch (error) {
            return false;
          }
        })();
      }
      return persistentStorageRequest;
    }

    function mostrarAvisoArmazenamentoArquivo(filename, count = 1) {
      let notice = document.getElementById('media-storage-warning');
      if (!notice) {
        notice = document.createElement('div');
        notice.id = 'media-storage-warning';
        notice.className = 'fixed bottom-4 right-4 z-[130] flex w-[min(360px,calc(100vw-2rem))] items-start gap-3 rounded-lg border border-rose-300 bg-white/95 px-3 py-2.5 text-xs text-rose-800 shadow-lg backdrop-blur dark:border-rose-900 dark:bg-slate-950/95 dark:text-rose-200';
        const message = document.createElement('span');
        message.dataset.noticeMessage = 'true';
        message.className = 'min-w-0 flex-1 leading-relaxed';
        const dismiss = document.createElement('button');
        dismiss.type = 'button';
        dismiss.className = 'shrink-0 px-1 text-base leading-none text-slate-400 hover:text-rose-600';
        dismiss.textContent = '×';
        dismiss.setAttribute('aria-label', 'Fechar aviso');
        dismiss.addEventListener('click', () => notice.remove());
        notice.append(message, dismiss);
        document.body.appendChild(notice);
      }
      const message = notice.querySelector('[data-notice-message]');
      message.textContent = `${count > 1 ? `${count} arquivos não foram salvos` : `${filename} não foi salvo`} (${lastMediaStorageFailure}). Reimporte após corrigir o armazenamento.`;
      clearTimeout(notice.dismissTimer);
      notice.dismissTimer = setTimeout(() => notice.remove(), 12000);
      if (navigator.storage?.estimate) {
        navigator.storage.estimate().then(({ usage, quota }) => {
          if (!usage || !quota || !notice.isConnected) return;
          message.textContent += ` Uso: ${(usage / 1024 / 1024).toFixed(0)} de ${(quota / 1024 / 1024).toFixed(0)} MB.`;
        }).catch(() => {});
      }
    }

    async function guardarMediaNoDb(id, blob) {
      await solicitarArmazenamentoPersistente();
      const database = db || await dexiDatabaseReady;
      if (!database) {
        folderFileMemoryCache.set(id, blob);
        lastMediaStorageFailure = 'IndexedDB indisponível ou bloqueado';
        return false;
      }
      return new Promise(resolve => {
        let requestSucceeded = false;
        let settled = false;
        const fallback = error => {
          if (settled) return;
          settled = true;
          folderFileMemoryCache.set(id, blob);
          lastMediaStorageFailure = descreverFalhaDeArmazenamento(error);
          resolve(false);
        };
        try {
          const transaction = database.transaction(['media'], 'readwrite');
          const request = transaction.objectStore('media').put(blob, id);
          request.onsuccess = () => { requestSucceeded = true; };
          request.onerror = event => { event.preventDefault(); fallback(request.error); };
          transaction.oncomplete = () => {
            if (settled) return;
            settled = true;
            resolve(requestSucceeded);
          };
          transaction.onerror = () => fallback(transaction.error);
          transaction.onabort = () => fallback(transaction.error);
        } catch (error) {
          fallback(error);
        }
      });
    }

    async function lerSnapshotQuadroDoDb() {

      return new Promise(resolve => {

          const request = database.transaction(['media'], 'readonly').objectStore('media').get('dexi_board_state_v1');

            resolve(typeof value === 'string' ? { jsonData: value, updatedAt: 0 } : value?.jsonData ? value : null);

        } catch (error) { resolve(null); }
