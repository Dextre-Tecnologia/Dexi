    let archiveStorageCleanup = null;

    function coletarReferenciasArmazenadas(rawCards, mediaIds, pdfIds) {
      if (!rawCards) return;
      try {
        const cards = JSON.parse(rawCards);
        if (!Array.isArray(cards)) return;
        cards.forEach(card => {
          if (card.mediaSourceId) mediaIds.add(card.mediaSourceId);
          if (card.pdfSourceId) pdfIds.add(card.pdfSourceId);
          if (!card.bodyContent) return;
          const template = document.createElement('template');
          template.innerHTML = card.bodyContent;
          template.content.querySelectorAll('[data-mediasourceid]').forEach(el => mediaIds.add(el.dataset.mediasourceid));
          template.content.querySelectorAll('[data-pdfsourceid]').forEach(el => pdfIds.add(el.dataset.pdfsourceid));
          template.content.querySelectorAll('[data-kind="file"][data-entry-id]').forEach(el => mediaIds.add(el.dataset.entryId));
        });
      } catch (error) {
        console.warn('Não foi possível analisar referências para liberar espaço:', error);
      }
    }

    function coletarReferenciasDoHistorico(mediaIds, pdfIds) {
      try {
        const deleted = JSON.parse(localStorage.getItem('dexi_deleted_items') || '[]');
        deleted.forEach(item => {
          if (!item.html) return;
          const template = document.createElement('template');
          template.innerHTML = item.html;
          template.content.querySelectorAll('[data-mediasourceid]').forEach(el => mediaIds.add(el.dataset.mediasourceid));
          template.content.querySelectorAll('[data-pdfsourceid]').forEach(el => pdfIds.add(el.dataset.pdfsourceid));
          template.content.querySelectorAll('[data-kind="file"][data-entry-id]').forEach(el => mediaIds.add(el.dataset.entryId));
        });
      } catch (error) {}
    }

    async function liberarBlobsOrfaos() {
      const database = db || await dexiDatabaseReady;
      if (!database) return 0;
      const mediaIds = new Set(['dexi_board_state_v1']);
      const pdfIds = new Set();
      document.querySelectorAll('.codex-card').forEach(card => {
        const media = card.querySelector('[data-mediasourceid]');
        const pdf = card.querySelector('[data-pdfsourceid]');
        if (media?.dataset.mediasourceid) mediaIds.add(media.dataset.mediasourceid);
        if (pdf?.dataset.pdfsourceid) pdfIds.add(pdf.dataset.pdfsourceid);
        card.querySelectorAll('[data-kind="file"][data-entry-id]').forEach(row => mediaIds.add(row.dataset.entryId));
      });
      coletarReferenciasArmazenadas(localStorage.getItem('dexi_codex_cards'), mediaIds, pdfIds);
      const snapshot = await lerSnapshotQuadroDoDb();
      coletarReferenciasArmazenadas(snapshot?.jsonData, mediaIds, pdfIds);
      coletarReferenciasDoHistorico(mediaIds, pdfIds);
      return new Promise(resolve => {
        let removed = 0;
        try {
          const transaction = database.transaction(['media', 'pdfs'], 'readwrite');
          const mediaStore = transaction.objectStore('media');
          const pdfStore = transaction.objectStore('pdfs');
          const mediaKeys = mediaStore.getAllKeys();
          const pdfKeys = pdfStore.getAllKeys();
          mediaKeys.onsuccess = () => mediaKeys.result.forEach(key => {
            if (!mediaIds.has(String(key))) { mediaStore.delete(key); removed += 1; }
          });
          pdfKeys.onsuccess = () => pdfKeys.result.forEach(key => {
            if (!pdfIds.has(String(key))) { pdfStore.delete(key); removed += 1; }
          });
          transaction.oncomplete = () => resolve(removed);
          transaction.onerror = () => resolve(0);
          transaction.onabort = () => resolve(0);
        } catch (error) { resolve(0); }
      });
    }

    function prepararArmazenamentoParaArquivar() {
      if (!archiveStorageCleanup) {
        archiveStorageCleanup = liberarBlobsOrfaos().finally(() => { archiveStorageCleanup = null; });
      }
      return archiveStorageCleanup;
    }

    // Navegação do quadro infinito: zoom, arraste, pinça e coordenadas do mouse.
    function updateTransform() {
      canvasContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      boardWrapper.style.backgroundPosition = `${panX}px ${panY}px`;
      boardWrapper.style.backgroundSize = `${32 * zoom}px ${32 * zoom}px`;
      document.getElementById('zoom-indicator').innerText = `${Math.round(zoom * 100)}%`;
    }

    function handleWheel(e) {
      if (boardWritingActive && e.target === boardWritingSvg && (Math.abs(e.deltaX) > 0 || Math.abs(e.deltaY) > 0)) {
        e.preventDefault();
        panX -= e.deltaX;
        panY -= e.deltaY;
        updateTransform();
        return;
      }
      if (e.target.closest('.drawing-canvas') || e.target.closest('.scroll-container-a4') || e.target.closest('textarea')) return; 
      e.preventDefault();
      const zoomFactor = 1.1;
      let newZoom = zoom;

      if (e.deltaY < 0) {
        newZoom = Math.min(zoom * zoomFactor, 3);
      } else {
        newZoom = Math.max(zoom / zoomFactor, 0.15);
      }

      const rect = boardWrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      panX = mouseX - (mouseX - panX) * (newZoom / zoom);
      panY = mouseY - (mouseY - panY) * (newZoom / zoom);
      zoom = newZoom;
      
      updateTransform();
    }
    boardWrapper.addEventListener('wheel', handleWheel, { passive: false });

    function getTouchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getTouchCenter(e) {
      return {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }

    window.changeZoom = function(delta) {
      let newZoom = zoom + delta;
      newZoom = Math.max(0.15, Math.min(newZoom, 3));
      const width = window.innerWidth;
      const height = window.innerHeight;
      panX = width / 2 - (width / 2 - panX) * (newZoom / zoom);
      panY = height / 2 - (height / 2 - panY) * (newZoom / zoom);
      zoom = newZoom;
      updateTransform();
    }
    window.resetZoom = function() {
      zoom = 1; panX = 0; panY = 0;
      updateTransform();
    }

    function startPan(e) {
      if (boardWritingActive && (!e.touches || e.touches.length < 2)) {
        isPanning = false;
        return;
      }
      if (e.touches && e.touches.length === 2) {
        touchStartCenter = getTouchCenter(e);
        startX = touchStartCenter.x - panX;
        startY = touchStartCenter.y - panY;
        if (boardWritingActive) {
          isPanning = true;
          isPinching = false;
          isTwoFingerPanning = true;
        } else {
          isPanning = false;
          isPinching = true;
          isTwoFingerPanning = false;
          touchStartDist = getTouchDist(e);
          touchStartZoom = zoom;
        }
        e.preventDefault();
        return;
      }
      isPinching = false;
      isTwoFingerPanning = false;

      if (!forcePanMode) {
        if (e.target.closest('.codex-card') || e.target.closest('aside') || e.target.closest('button') || e.target.closest('input') || e.target.closest('a') || e.target.closest('canvas') || e.target.closest('textarea') || e.target.closest('embed') || e.target.closest('iframe')) {
          isPanning = false; return;
        }
      } else {
        if (e.target.closest('aside') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) {
          isPanning = false; return;
        }
      }

      isPanning = true;
      const pageX = e.touches ? e.touches[0].pageX : e.pageX;
      const pageY = e.touches ? e.touches[0].pageY : e.pageY;
      startX = pageX - panX;
      startY = pageY - panY;
    }

    function doPan(e) {
      if (e.touches && e.touches.length === 2 && isTwoFingerPanning) {
        e.preventDefault();
        const currentCenter = getTouchCenter(e);
        panX += currentCenter.x - touchStartCenter.x;
        panY += currentCenter.y - touchStartCenter.y;
        touchStartCenter = currentCenter;
        updateTransform();
        return;
      }
      if (e.touches && e.touches.length === 2 && isPinching) {
        e.preventDefault();
        const currentDist = getTouchDist(e);
        const currentCenter = getTouchCenter(e);
        
        let newZoom = touchStartZoom * (currentDist / touchStartDist);
        newZoom = Math.max(0.15, Math.min(newZoom, 3));
        
        const rect = boardWrapper.getBoundingClientRect();
        const centerCanvasX = currentCenter.x - rect.left;
        const centerCanvasY = currentCenter.y - rect.top;
        
        const zoomFactor = newZoom / zoom;
        panX = centerCanvasX - (centerCanvasX - panX) * zoomFactor;
        panY = centerCanvasY - (centerCanvasY - panY) * zoomFactor;
        
        const dx = currentCenter.x - touchStartCenter.x;
        const dy = currentCenter.y - touchStartCenter.y;
        panX += dx;
        panY += dy;

        touchStartCenter = currentCenter;
        zoom = newZoom;
        updateTransform();
        return;
      }

      if (!isPanning) return;
      const pageX = e.touches ? e.touches[0].pageX : e.pageX;
      const pageY = e.touches ? e.touches[0].pageY : e.pageY;
      panX = pageX - startX;
      panY = pageY - startY;
      updateTransform();
    }

    function endPan(e) { 
      isPanning = false; 
      isPinching = false;
      isTwoFingerPanning = false;
    }

    boardWrapper.addEventListener('mousedown', startPan);
    window.addEventListener('mousemove', doPan);
    window.addEventListener('mouseup', endPan);

    window.addEventListener('touchmove', doPan, { passive: false });

    // Detecta o mecanismo de busca pelo navegador e monta a consulta web.
    function detectarMotorBusca() {
      const ua = navigator.userAgent || '';
      if (/OPR\//.test(ua) || /Opera/.test(ua)) {
        return { nome: 'Opera', url: 'https://search.opera.com/search?query=' };
      }
      if (/EdgA?\//.test(ua) || /EdgiOS\//.test(ua)) {
        return { nome: 'Edge', url: 'https://www.bing.com/search?q=' };
      }
      if (/Chrome|CriOS/.test(ua)) {
        return { nome: 'Google', url: 'https://www.google.com/search?q=' };
      }
      if (/Firefox/.test(ua)) {
        return { nome: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' };
      }
      if (/Safari/.test(ua)) {
        return { nome: 'Google', url: 'https://www.google.com/search?q=' };
      }
      return { nome: 'Google', url: 'https://www.google.com/search?q=' };
    }

    function atualizarBadgeBusca() {
      const badge = document.getElementById('search-engine-badge');
      const input = document.getElementById('top-web-search-input');
      if (!badge || !input) return;
      const motor = detectarMotorBusca();
      badge.textContent = motor.nome;
      input.placeholder = `Pesquisar no ${motor.nome}...`;
    }

    function executarPesquisaWeb() {
      const input = document.getElementById('top-web-search-input');
      const query = input ? input.value.trim() : '';
      if (!query) {
        if (input) input.focus();
        return;
      }
      const motor = detectarMotorBusca();
      const url = `${motor.url}${encodeURIComponent(query)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    document.getElementById('top-web-search-input')?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        executarPesquisaWeb();
      }
    });

    atualizarBadgeBusca();

    // Entrada de arquivos e links: transforma cada item em um card do quadro.
    // Cada entrada de pasta recebe um ID estável para ligar o card ao blob no IndexedDB.
    function createFolderEntryId() {
      return `folder-entry-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function renderFolderEntryRow(entry) {
      const isFolder = entry.kind === 'folder';
      const icon = isFolder ? '📁' : (entry.type || '').startsWith('image/') ? '▧' : entry.type === 'application/pdf' ? '▤' : '▫';
      return `<li data-folder-entry="true" data-entry-id="${escapeHTML(entry.id)}" data-kind="${entry.kind}" data-temporary="${entry.temporary ? 'true' : 'false'}" data-storage-failure="${escapeHTML(entry.storageFailure || '')}" data-path="${escapeHTML(entry.path)}" data-search="${escapeHTML(entry.path.toLowerCase())}" class="folder-file-row flex flex-wrap items-center gap-1.5 border-b border-slate-200/70 px-2 py-1.5 last:border-0 dark:border-slate-700/70">
        <button type="button" data-folder-action="open" class="order-1 flex min-w-0 basis-full items-center gap-2 overflow-hidden py-1 text-left" aria-label="${isFolder ? 'Abrir pasta' : 'Visualizar arquivo'} ${escapeHTML(entry.path)}">
          <span class="shrink-0 text-amber-500">${icon}</span><span data-entry-label="true" class="min-w-0 flex-1 truncate text-xs text-slate-700 dark:text-slate-200" title="${escapeHTML(entry.path)}">${escapeHTML(entry.path)}</span>
          <span class="shrink-0 text-[10px] text-slate-400" title="${entry.temporary ? escapeHTML(entry.storageFailure || 'Arquivo não persistido') : ''}">${isFolder ? '' : entry.temporary ? 'temp.' : `${(entry.size / 1024).toFixed(1)} KB`}</span>
        </button>
        <button type="button" draggable="true" data-folder-drag-handle="true" class="h-7 w-7 shrink-0 cursor-grab touch-none rounded-md text-sm text-slate-400 hover:bg-slate-200 hover:text-slate-700 dark:hover:bg-slate-700 dark:hover:text-slate-100" title="Arrastar para reordenar" aria-label="Arrastar para reordenar">⠿</button>
        <button type="button" data-folder-action="up" class="h-7 w-7 shrink-0 touch-manipulation rounded-md text-sm text-slate-500 hover:bg-amber-100 hover:text-amber-700 dark:hover:bg-slate-700" title="Mover para cima" aria-label="Mover para cima">↑</button>
        <button type="button" data-folder-action="down" class="h-7 w-7 shrink-0 touch-manipulation rounded-md text-sm text-slate-500 hover:bg-amber-100 hover:text-amber-700 dark:hover:bg-slate-700" title="Mover para baixo" aria-label="Mover para baixo">↓</button>
        <button type="button" data-folder-action="download" class="h-7 w-7 shrink-0 touch-manipulation rounded-md text-sm text-slate-500 hover:bg-blue-100 hover:text-blue-700 dark:hover:bg-slate-700 ${isFolder ? 'hidden' : ''}" title="Baixar arquivo" aria-label="Baixar arquivo">⤓</button>
        <button type="button" data-folder-action="rename" class="h-7 w-7 shrink-0 touch-manipulation rounded-md text-sm text-slate-500 hover:bg-amber-100 hover:text-amber-700 dark:hover:bg-slate-700" title="Renomear" aria-label="Renomear">✎</button>
        <button type="button" data-folder-action="delete" class="h-7 w-7 shrink-0 touch-manipulation rounded-md text-base text-slate-500 hover:bg-rose-100 hover:text-rose-700 dark:hover:bg-slate-700" title="Excluir" aria-label="Excluir">×</button>
      </li>`;
    }

    // Armazena os blobs e monta um card navegável com entradas e subpastas.
    async function createFolderCard(folderName, entries) {
      await prepararArmazenamentoParaArquivar();
      const folderEntries = new Map();
      const fileEntries = [];
      for (const { file, path } of entries) {
        const normalizedPath = String(path || file.name).replace(/\\/g, '/').split('/').filter(part => part && part !== '.' && part !== '..').join('/') || file.name;
        const parts = normalizedPath.split('/').filter(Boolean);
        let currentPath = '';
        parts.slice(0, -1).forEach(part => {
          currentPath = currentPath ? `${currentPath}/${part}` : part;
          if (!folderEntries.has(currentPath)) folderEntries.set(currentPath, { id: createFolderEntryId(), kind: 'folder', path: currentPath });
        });
        const id = createFolderEntryId();
        const storedPersistently = await guardarArquivoPastaNoDb(id, file);
        fileEntries.push({ id, kind: 'file', path: normalizedPath, name: parts[parts.length - 1] || file.name, type: file.type || '', size: file.size || 0, temporary: !storedPersistently, storageFailure: storedPersistently ? '' : lastMediaStorageFailure });
      }
      const temporaryFiles = fileEntries.filter(entry => entry.temporary);
      if (temporaryFiles.length) mostrarAvisoArmazenamentoArquivo(temporaryFiles[0].name, temporaryFiles.length);
      const renderedEntries = [...folderEntries.values(), ...fileEntries].sort((a, b) => a.path.localeCompare(b.path, 'pt-BR'));
      const rows = renderedEntries.map(renderFolderEntryRow).join('');
      const bodyHtml = `<div class="folder-card-body flex h-full min-h-0 flex-col bg-slate-50 dark:bg-slate-950/40" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
        <div class="flex shrink-0 gap-1 border-b border-slate-200 p-2 dark:border-slate-700">
          <input type="search" placeholder="Filtrar arquivos..." aria-label="Filtrar arquivos da pasta" oninput="filtrarArquivosPasta(this)" class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-xs outline-none focus:border-amber-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
          <button type="button" data-folder-action="new-folder" class="shrink-0 rounded-lg bg-slate-200 px-2 text-xs font-bold text-slate-700 hover:bg-amber-200 dark:bg-slate-800 dark:text-slate-200" title="Criar pasta" aria-label="Criar pasta">+ Pasta</button>
          <button type="button" data-folder-action="zip" class="shrink-0 rounded-lg bg-amber-500 px-2 text-xs font-bold text-slate-900 hover:bg-amber-400" title="Baixar como ZIP" aria-label="Baixar pasta como ZIP">ZIP</button>
        </div>
        <ul class="folder-file-list min-h-0 flex-1 list-none overflow-auto overscroll-contain p-0">${rows}</ul>
        <div data-folder-count="true" class="shrink-0 border-t border-slate-200 px-3 py-1.5 text-[10px] text-slate-500 dark:border-slate-700 dark:text-slate-400">${fileEntries.length} arquivo${fileEntries.length === 1 ? '' : 's'} · ${folderEntries.size} pasta${folderEntries.size === 1 ? '' : 's'}${fileEntries.some(entry => entry.temporary) ? ` · ${fileEntries.filter(entry => entry.temporary).length} temporário(s), não persistido(s)` : ''}</div>
      </div>`;
      const card = createCard('FOLDERS', folderName, bodyHtml, 360);
      card.dataset.folderCardId = createFolderEntryId();
      bindFolderCardInteractions(card);
      await salvarEstadoNoStorage();
      return card;
    }

    let draggedFolderEntry = null;
    let activeFolderPreviewUrl = null;
    const folderListsWithEvents = new WeakSet();

    function bindFolderCardInteractions(card) {
      const body = card.querySelector('.folder-card-body');
      const list = card.querySelector('.folder-file-list');
      if (!body || !list || folderListsWithEvents.has(list)) return;
      folderListsWithEvents.add(list);
      delete list.dataset.eventsBound;
      body.addEventListener('click', handleFolderCardAction);
      list.addEventListener('dragstart', handleFolderEntryDragStart);
      list.addEventListener('dragover', handleFolderEntryDragOver);
      list.addEventListener('drop', handleFolderEntryDrop);
      list.addEventListener('dragend', handleFolderEntryDragEnd);
    }

    function handleFolderEntryDragStart(event) {
      if (!event.target.closest('[data-folder-drag-handle]')) {
        event.preventDefault();
        return;
      }
      draggedFolderEntry = event.target.closest('[data-folder-entry]');
      if (!draggedFolderEntry) return;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', draggedFolderEntry.dataset.entryId);
      draggedFolderEntry.classList.add('opacity-40');
    }

    function handleFolderEntryDragOver(event) {
      event.preventDefault();
      const target = event.target.closest('[data-folder-entry]');
      if (!target || !draggedFolderEntry || target === draggedFolderEntry) return;
      const bounds = target.getBoundingClientRect();
      target.parentElement.insertBefore(draggedFolderEntry, event.clientY < bounds.top + bounds.height / 2 ? target : target.nextSibling);
    }

    function handleFolderEntryDrop(event) {
      event.preventDefault();
      const card = event.target.closest('.codex-card');
      if (card) salvarEstadoNoStorage();
    }

    function handleFolderEntryDragEnd() {
      draggedFolderEntry?.classList.remove('opacity-40');
      draggedFolderEntry = null;
      salvarEstadoNoStorage();
    }

    function updateFolderCardCount(card) {
      const rows = Array.from(card.querySelectorAll('[data-folder-entry]'));
      const files = rows.filter(row => row.dataset.kind === 'file').length;
      const folders = rows.filter(row => row.dataset.kind === 'folder').length;
      const temporary = rows.filter(row => row.dataset.temporary === 'true').length;
      const counter = card.querySelector('[data-folder-count]');
      if (counter) counter.textContent = `${files} arquivo${files === 1 ? '' : 's'} · ${folders} pasta${folders === 1 ? '' : 's'}${temporary ? ` · ${temporary} temporário(s), não persistido(s)` : ''}`;
    }

    async function previewFolderFile(row) {
      const file = await obterArquivoPastaDoDb(row.dataset.entryId);
      if (!file) { alert('Este arquivo não está mais disponível.'); return; }
      if (activeFolderPreviewUrl) URL.revokeObjectURL(activeFolderPreviewUrl);
      const url = URL.createObjectURL(file);
      activeFolderPreviewUrl = url;
      const safeName = escapeHTML(row.dataset.path);
      let content;
      if (file.type.startsWith('image/')) content = `<div class="flex h-full items-center justify-center bg-slate-950"><img src="${url}" alt="${safeName}" class="max-h-full max-w-full object-contain"></div>`;
      else if (file.type === 'application/pdf') content = `<iframe src="${url}" title="${safeName}" class="h-full w-full border-0"></iframe>`;
      else if (file.type.startsWith('video/')) content = `<div class="flex h-full items-center justify-center bg-slate-950"><video src="${url}" controls class="max-h-full max-w-full"></video></div>`;
      else if (file.type.startsWith('audio/')) content = `<div class="flex h-full items-center justify-center p-6"><audio src="${url}" controls class="w-full"></audio></div>`;
      else if (file.type.startsWith('text/') || /\.(txt|md|json|csv|xml|html|css|js|ts|py|log)$/i.test(file.name)) content = `<pre class="h-full overflow-auto whitespace-pre-wrap break-words bg-white p-4 text-xs text-slate-800 dark:bg-slate-950 dark:text-slate-100"></pre>`;
      else content = `<div class="flex h-full flex-col items-center justify-center gap-3 p-6 text-center"><p class="text-sm text-slate-600 dark:text-slate-300">Prévia indisponível para este formato.</p><a href="${url}" download="${escapeHTML(file.name)}" class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-bold text-slate-900">Baixar arquivo</a></div>`;
      openModal(row.dataset.path, content);
      const pre = document.querySelector('#modal-content pre');
      if (pre) pre.textContent = await file.text();
    }

    async function downloadFolderFile(row) {
      const file = await obterArquivoPastaDoDb(row.dataset.entryId);
      if (!file) { alert('Este arquivo não está mais disponível.'); return; }
      const url = URL.createObjectURL(file);
      const link = document.createElement('a');
      link.href = url;
      link.download = row.dataset.path.split('/').pop();
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function downloadFolderCardZip(card) {
      if (!window.JSZip) { alert('Não foi possível carregar a função ZIP. Verifique sua conexão.'); return; }
      const zip = new JSZip();
      const root = (card.dataset.filename || 'FOLDERS').replace(/[\\/:*?"<>|]/g, '_');
      for (const row of card.querySelectorAll('[data-folder-entry]')) {
        const path = row.dataset.path.replace(/\\/g, '/').split('/').filter(part => part && part !== '.' && part !== '..').join('/');
        if (!path) continue;
        if (row.dataset.kind === 'folder') zip.folder(`${root}/${path}`);
        else {
          const file = await obterArquivoPastaDoDb(row.dataset.entryId);
          if (file) zip.file(`${root}/${path}`, file);
        }
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${root}.zip`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function handleFolderCardAction(event) {
      const button = event.target.closest('[data-folder-action]');
      if (!button) return;
      event.stopPropagation();
      const action = button.dataset.folderAction;
      const card = button.closest('.codex-card');
      const list = card.querySelector('.folder-file-list');
      const row = button.closest('[data-folder-entry]');
      if (action === 'new-folder') {
        const name = prompt('Nome da nova pasta (use / para criar subpastas):');
        if (!name?.trim()) return;
        const parts = name.trim().replace(/\\/g, '/').split('/').map(part => part.trim()).filter(part => part && part !== '.' && part !== '..');
        let folderPath = '';
        parts.forEach(part => {
          folderPath = folderPath ? `${folderPath}/${part}` : part;
          if (Array.from(list.querySelectorAll('[data-kind="folder"]')).some(item => item.dataset.path === folderPath)) return;
          const wrapper = document.createElement('ul');
          wrapper.innerHTML = renderFolderEntryRow({ id: createFolderEntryId(), kind: 'folder', path: folderPath });
          list.appendChild(wrapper.firstElementChild);
        });
        updateFolderCardCount(card);
      } else if (action === 'zip') {
        await downloadFolderCardZip(card).catch(error => {
          console.error('Falha ao baixar pasta ZIP:', error);
          alert('Não foi possível criar o ZIP desta pasta.');
        });
        return;
      } else if (!row) return;
      else if (action === 'open') {
        if (row.dataset.kind === 'folder') {
          const prefix = `${row.dataset.path}/`;
          const descendants = Array.from(list.querySelectorAll('[data-folder-entry]')).filter(item => item !== row && item.dataset.path.startsWith(prefix));
          const hideChildren = descendants.some(child => !child.classList.contains('hidden'));
          descendants.forEach(child => child.classList.toggle('hidden', hideChildren));
        } else await previewFolderFile(row).catch(error => {
          console.error('Falha ao abrir arquivo da pasta:', error);
          alert('Não foi possível abrir este arquivo.');
        });
        return;
      } else if (action === 'download') {
        await downloadFolderFile(row).catch(error => {
          console.error('Falha ao baixar arquivo da pasta:', error);
          alert('Não foi possível baixar este arquivo.');
        });
        return;
      } else if (action === 'rename') {
        const oldPath = row.dataset.path;
        const oldName = oldPath.split('/').pop();
        const newName = prompt('Novo nome:', oldName)?.trim().replace(/[\\/]/g, '-');
        if (!newName || newName === oldName) return;
        const parentPath = oldPath.includes('/') ? oldPath.slice(0, oldPath.lastIndexOf('/') + 1) : '';
        const newPath = `${parentPath}${newName}`;
        const pathPrefix = row.dataset.kind === 'folder' ? `${oldPath}/` : null;
        Array.from(list.querySelectorAll('[data-folder-entry]')).forEach(item => {
          if (item === row) item.dataset.path = newPath;
          else if (pathPrefix && item.dataset.path.startsWith(pathPrefix)) item.dataset.path = `${newPath}${item.dataset.path.slice(oldPath.length)}`;
          item.dataset.search = item.dataset.path.toLowerCase();
          const label = item.querySelector('[data-entry-label]');
          if (label) { label.textContent = item.dataset.path; label.title = item.dataset.path; }
        });
      } else if (action === 'delete') {
        const path = row.dataset.path;
        const isFolder = row.dataset.kind === 'folder';
        if (!confirm(`Excluir ${isFolder ? 'a pasta' : 'o arquivo'} "${path}"?`)) return;
        const rowsToDelete = isFolder
          ? [row, ...Array.from(list.querySelectorAll('[data-folder-entry]')).filter(item => item.dataset.path.startsWith(`${path}/`))]
          : [row];
        rowsToDelete.forEach(item => {
          if (item.dataset.kind === 'file') removerArquivoPastaDoDb(item.dataset.entryId);
          item.remove();
        });
        updateFolderCardCount(card);
      } else if (action === 'up' || action === 'down') {
        const sibling = action === 'up' ? row.previousElementSibling : row.nextElementSibling;
        if (sibling) list.insertBefore(row, action === 'up' ? sibling : sibling.nextElementSibling);
      }
      salvarEstadoNoStorage();
    }

    async function handleFolderSelection(files) {
      const selectedFiles = Array.from(files);
      if (selectedFiles.length === 0) {
        document.getElementById('folder-selector').value = '';
        return;
      }
      const folders = new Map();
      selectedFiles.forEach(file => {
        const relativePath = file.webkitRelativePath || '';
        const pathParts = relativePath.split('/').filter(Boolean);
        const folderName = pathParts.length > 1 ? pathParts.shift() : 'Pasta selecionada';
        if (!folders.has(folderName)) folders.set(folderName, []);
        folders.get(folderName).push({ file, path: pathParts.join('/') || file.name });
      });
      await Promise.all(Array.from(folders, ([folderName, entries]) => createFolderCard(folderName, entries)));
      document.getElementById('folder-selector').value = '';
    }

    async function handleIndividualFileSelection(files) {
      const selectedFiles = Array.from(files);
      try {
        for (const file of selectedFiles) await processAndCreateCard(file);
      } finally {
        document.getElementById('archive-files-selector').value = '';
      }
    }

    function readDroppedDirectory(entry, parentPath = '') {
      return new Promise(resolve => {
        if (entry.isFile) {
          entry.file(file => resolve([{ file, path: parentPath ? `${parentPath}/${entry.name}` : entry.name }]), () => resolve([]));
          return;
        }
        if (!entry.isDirectory) { resolve([]); return; }
        const reader = entry.createReader();
        const children = [];
        const readNextBatch = () => reader.readEntries(async entries => {
          if (!entries.length) { resolve(children.flat()); return; }
          const batch = await Promise.all(entries.map(child => {
            const childPath = child.isDirectory
              ? (parentPath ? `${parentPath}/${child.name}` : child.name)
              : parentPath;
            return readDroppedDirectory(child, childPath);
          }));
          children.push(...batch);
          readNextBatch();
        }, () => resolve(children.flat()));
        readNextBatch();
      });
    }

    async function readDirectoryHandle(handle, parentPath = '') {
      if (handle.kind === 'file') return [{ file: await handle.getFile(), path: parentPath || handle.name }];
      const files = [];
      for await (const [name, child] of handle.entries()) {
        files.push(...await readDirectoryHandle(child, parentPath ? `${parentPath}/${name}` : name));
      }
      return files;
    }

    // Lê arquivos e diretórios arrastados e cria cards no quadro.
    async function processDroppedItems(dataTransfer, fileSystemHandles = null, capturedDirectoryEntries = null) {
      const items = Array.from(dataTransfer.items || []);
      const directoryEntries = capturedDirectoryEntries || items.map(item => item.webkitGetAsEntry?.()).filter(entry => entry?.isDirectory);
      const directoryHandles = fileSystemHandles || await Promise.all(items.map(async item => {
        try { return await item.getAsFileSystemHandle?.(); } catch (error) { return null; }
      }));
      const folderSources = directoryEntries.length
        ? directoryEntries.map(entry => ({ name: entry.name, read: () => readDroppedDirectory(entry) }))
        : directoryHandles.filter(handle => handle?.kind === 'directory').map(handle => ({ name: handle.name, read: () => readDirectoryHandle(handle) }));
      if (folderSources.length) {
        const folders = await Promise.all(folderSources.map(async folder => ({ name: folder.name, files: await folder.read() })));
        await Promise.all(folders.filter(folder => folder.files.length).map(folder => createFolderCard(folder.name, folder.files)));
        return;
      }
      const files = Array.from(dataTransfer.files || []);
      const droppedFolders = new Map();
      const individualFiles = [];
      files.forEach(file => {
        const relativePath = file.webkitRelativePath || '';
        if (!relativePath.includes('/')) {
          individualFiles.push(file);
          return;
        }
        const [folderName, ...pathParts] = relativePath.split('/').filter(Boolean);
        if (!droppedFolders.has(folderName)) droppedFolders.set(folderName, []);
        droppedFolders.get(folderName).push({ file, path: pathParts.join('/') || file.name });
      });
      await Promise.all([
        ...Array.from(droppedFolders, ([name, folderFiles]) => createFolderCard(name, folderFiles)),
        ...individualFiles.map(file => processAndCreateCard(file))
      ]);
    }

    window.filtrarArquivosPasta = function(input) {
      const query = input.value.trim().toLowerCase();
      input.closest('.card-body-holder').querySelectorAll('.folder-file-row').forEach(row => {
        row.classList.toggle('hidden', !row.dataset.search.includes(query));
      });
    };

    const dropZone = boardWrapper;
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, e => e.preventDefault(), false);
    });
    dropZone.addEventListener('dragover', () => dropZone.classList.add('bg-slate-200/40', 'dark:bg-slate-800/40'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-slate-200/40', 'dark:bg-slate-800/40'));
    dropZone.addEventListener('drop', async (e) => {
      dropZone.classList.remove('bg-slate-200/40', 'dark:bg-slate-800/40');
      const linkData = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
      if (linkData && (linkData.startsWith('http://') || linkData.startsWith('https://'))) {
        tratarLinkColado(linkData);
        return;
      }
      if (e.dataTransfer.files.length || e.dataTransfer.items.length) {
        try {
          await processDroppedItems(e.dataTransfer);
        } catch (error) {
          console.error('Falha ao arquivar itens arrastados:', error);
          alert('Não foi possível concluir o arquivamento de todos os itens.');
        }
      }
    });

    // Seleção múltipla e agrupamento de cards.
    function atualizarToolbarSelecao() {
      const selecionados = document.querySelectorAll('.selected-card');
      const toolbar = document.getElementById('selection-toolbar');
      const countSpan = document.getElementById('selection-count');
      if (selecionados.length > 0) {
        countSpan.innerText = `${selecionados.length} selecionado(s)`;
        toolbar.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
        toolbar.classList.add('opacity-100', 'scale-100');
      } else {
        toolbar.classList.remove('opacity-100', 'scale-100');
        toolbar.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
      }
    }

    function limparSelecao() {
      document.querySelectorAll('.selected-card').forEach(card => {
        card.classList.remove('ring-4', 'ring-indigo-500', 'dark:ring-indigo-400', 'selected-card');

    window.dragStartLink = function(e) {
      draggedLinkItem = e.target.closest('.link-item-row');

        if(draggedLinkItem) draggedLinkItem.classList.add('opacity-40', 'scale-[0.98]');

    window.dragOverLink = function(e) {
      e.preventDefault(); 
      const overItem = e.target.closest('.link-item-row');
      if (!overItem || overItem === draggedLinkItem || !draggedLinkItem) return;
      const container = overItem.parentElement;
      const rect = overItem.getBoundingClientRect();
      const isAfter = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
      
      if (isAfter) {
        container.insertBefore(draggedLinkItem, overItem.nextSibling);
      } else {
        container.insertBefore(draggedLinkItem, overItem);
      }
    }

        container.insertBefore(item, item.previousElementSibling);

    async function criarConteudoArquivoPersistente(fileType, filename, mediaId, blob) {
      const shellStart = `<div data-mediasourceid="${escapeHTML(mediaId)}" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">`;
      if (!blob) return `${shellStart}<div class="flex h-full items-center justify-center p-4 text-center text-xs text-rose-600">Arquivo não disponível neste navegador. Reimporte este arquivo.</div></div>`;
      const url = URL.createObjectURL(blob);
      const lowerName = filename.toLowerCase();
      const mime = blob.type || '';
      if (mime.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(lowerName)) {
        return `${shellStart}<div class="flex h-full items-center justify-center overflow-hidden bg-slate-100 dark:bg-slate-950"><img src="${url}" alt="${escapeHTML(filename)}" class="h-full w-full cursor-pointer object-contain"></div></div>`;
      }
      if (mime.startsWith('video/') || /\.(mp4|webm|ogg|mov)$/i.test(lowerName)) {
        return `${shellStart}<div class="flex h-full items-center justify-center bg-slate-950"><video src="${url}" controls class="h-full w-full object-contain pointer-events-auto"></video></div></div>`;
      }
      if (mime.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac)$/i.test(lowerName)) {
        return `${shellStart}<div class="flex h-full flex-col items-center justify-center gap-3 bg-slate-50 p-4 dark:bg-slate-950"><span class="text-3xl">🎵</span><audio src="${url}" controls class="w-full pointer-events-auto"></audio></div></div>`;
      }
      if (mime.startsWith('text/') || /\.(txt|md|json|csv|xml|html|css|js|ts|py|log)$/i.test(lowerName)) {
        return `${shellStart}<div class="h-full overflow-auto whitespace-pre-wrap break-words bg-slate-50 p-4 text-xs text-slate-700 dark:bg-slate-950 dark:text-slate-200">${escapeHTML(await blob.text())}</div></div>`;
      }
      return `${shellStart}<div class="flex h-full flex-col items-center justify-center gap-3 p-5 text-center"><span class="text-3xl">📄</span><span class="break-all text-xs text-slate-500">${escapeHTML(blob.type || fileType)}</span><a href="${url}" download="${escapeHTML(filename)}" class="rounded-lg bg-amber-500 px-3 py-2 text-xs font-bold text-slate-900">Baixar arquivo</a></div></div>`;
    }

    async function criarCardDeArquivoPersistente(file, fileType, width) {
      const mediaId = `media_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const persisted = await guardarMediaNoDb(mediaId, file);
      const bodyHtml = await criarConteudoArquivoPersistente(fileType, file.name, mediaId, file);
      const card = createCard(fileType, file.name, bodyHtml, width);
      if (!persisted) marcarCardComoTemporario(card, fileType, file.name);
      await salvarEstadoNoStorage();
      return card;
    }

    async function migrarMidiasDataUrlLegadas() {
      let changed = false;
      const mediaTypes = new Set(['JPG', 'JPEG', 'PNG', 'GIF', 'WEBP', 'SVG', 'MP3', 'WAV', 'OGG', 'M4A', 'FLAC', 'MP4', 'WEBM', 'MOV']);
      for (const card of document.querySelectorAll('.codex-card')) {
        if (!mediaTypes.has((card.dataset.filetype || '').toUpperCase())) continue;
        if (card.querySelector('[data-mediasourceid]')) continue;
        const source = card.querySelector('img[src^="data:"], audio[src^="data:"], video[src^="data:"]');
        const bodyHolder = card.querySelector('.card-body-holder');
        if (!source || !bodyHolder) continue;
        try {
          const blob = await (await fetch(source.getAttribute('src'))).blob();
          const mediaId = `media_legacy_${Date.now()}_${Math.random().toString(36).slice(2)}`;
          if (!await guardarMediaNoDb(mediaId, blob)) continue;
          bodyHolder.innerHTML = await criarConteudoArquivoPersistente(card.dataset.filetype, card.dataset.filename, mediaId, blob);
          changed = true;
        } catch (error) {
          console.warn('Não foi possível migrar uma mídia antiga:', error);
        }
      }
      if (changed) salvarEstadoNoStorage();
    }

    // Guarda arquivos binários fora do localStorage e escolhe a prévia adequada.
    async function processAndCreateCard(file) {
      await prepararArmazenamentoParaArquivar();
      const fileNameLower = file.name.toLowerCase();
      const extension = file.name.includes('.') ? file.name.split('.').pop().toUpperCase() : 'ARQUIVO';
      if (fileNameLower.endsWith('.pdf')) {
        const pdfId = `pdf_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const persisted = await guardarPdfNoDb(pdfId, file);
        const card = montarEGerarLeitorPdf(pdfId, file.name, 1);
        if (!persisted) {
          marcarCardComoTemporario(card, extension, file.name);
          salvarEstadoNoStorage();
        }
        return;
      }
      const width = /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(fileNameLower) ? 320
        : /\.(mp4|webm|ogg|mov)$/i.test(fileNameLower) ? 360
          : /\.(mp3|wav|ogg|m4a|flac)$/i.test(fileNameLower) ? 300
            : /\.(txt|md|json|csv|xml|html|css|js|ts|py|log)$/i.test(fileNameLower) ? 290 : 260;
      await criarCardDeArquivoPersistente(file, extension, width);
    }

    window.baixarStickyNote = function(card) {
      if (!card) return;
      const text = card.querySelector('.sticky-note-textarea')?.value || '';
      const filename = (card.dataset.filename || 'sticky-note').trim().replace(/[\\/:*?"<>|]/g, '-') || 'sticky-note';
      const link = document.createElement('a');
      link.download = `${filename}.txt`;
      link.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 0);
    };

    window.baixarStickyNoteComoPDF = function(card) {
      if (!card || !window.jspdf?.jsPDF) return;
      const textarea = card.querySelector('.sticky-note-textarea');
      if (!textarea) return;
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const filename = (card.dataset.filename || 'sticky-note').trim().replace(/[\\/:*?"<>|]/g, '-') || 'sticky-note';
      const margin = 16;
      const maxWidth = 178;
      const fontSize = Math.max(10, Math.min(28, parseFloat(card.dataset.stickyFontSize) || 14));
      const background = card.dataset.stickyBackground || '#fef08a';
      const textColor = card.dataset.stickyTextColor || '#1e293b';
      const backgroundRgb = hexToRgb(background);
      const textRgb = hexToRgb(textColor);
      const fontFamily = card.dataset.stickyFontFamily || 'sans-serif';
      const pdfFont = fontFamily === 'serif' ? 'times' : (fontFamily === 'monospace' ? 'courier' : 'helvetica');
      if (backgroundRgb) {
        pdf.setFillColor(...backgroundRgb);
        pdf.rect(0, 0, 210, 297, 'F');
      }
      pdf.setFontSize(fontSize);
      const pdfFontStyle = card.dataset.stickyFontWeight === '700'
        ? (card.dataset.stickyFontStyle === 'italic' ? 'bolditalic' : 'bold')
        : (card.dataset.stickyFontStyle === 'italic' ? 'italic' : 'normal');
      pdf.setFont(pdfFont, pdfFontStyle);
      if (textRgb) pdf.setTextColor(...textRgb);
      const lines = pdf.splitTextToSize(textarea.value || '', maxWidth);
      const lineHeight = fontSize * 0.45;
      const underline = card.dataset.stickyTextDecoration === 'underline';
      const boardOverlay = getStickyBoardSegments(card);
      let y = margin;
      lines.forEach(line => {
        if (y > 280) {
          pdf.addPage();
          y = margin;
          if (backgroundRgb) {
            pdf.setFillColor(...backgroundRgb);
            pdf.rect(0, 0, 210, 297, 'F');
          }
          pdf.setFont(pdfFont, pdfFontStyle);
          pdf.setFontSize(fontSize);
          if (textRgb) pdf.setTextColor(...textRgb);
        }
        pdf.text(line, margin, y);
        if (underline) {
          const lineWidth = pdf.getTextWidth(line);
          pdf.setLineWidth(0.25);
          pdf.line(margin, y + 1, margin + lineWidth, y + 1);
        }
        y += lineHeight;
      });
      boardOverlay.segments.forEach(({ stroke, points }) => {
        const strokeRgb = hexToRgb(stroke.color);
        if (!strokeRgb) return;
        pdf.setDrawColor(...strokeRgb);
        pdf.setLineWidth(Math.max(0.2, stroke.width * 210 / boardOverlay.width * 0.12));
        for (let index = 1; index < points.length; index += 1) {
          pdf.line(
            points[index - 1].x * 210 / boardOverlay.width,
            points[index - 1].y * 297 / boardOverlay.height,
            points[index].x * 210 / boardOverlay.width,
            points[index].y * 297 / boardOverlay.height
          );
        }
      });
      pdf.save(`${filename}.pdf`);
    };

    function hexToRgb(value) {
      const hex = String(value || '').replace('#', '');
      if (!/^[\da-f]{6}$/i.test(hex)) return null;
      return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
    }

    function getStickyBoardSegments(card) {
      const left = parseFloat(card.style.left) || 0;
      const top = parseFloat(card.style.top) || 0;
      const width = parseFloat(card.style.width) || 260;
      const height = parseFloat(card.style.height) || 280;
      const segments = [];
      boardWritingStrokes.forEach(stroke => {
        let segment = [];
        stroke.points.forEach(point => {
          const inside = point.x >= left && point.x <= left + width && point.y >= top && point.y <= top + height;
          if (inside) {
            segment.push({ x: point.x - left, y: point.y - top });
          } else if (segment.length > 1) {
            segments.push({ stroke, points: segment });
            segment = [];
          } else {
            segment = [];
          }
        });
        if (segment.length > 1) segments.push({ stroke, points: segment });
      });
      return { width, height, segments };
    }

    window.baixarStickyNoteComoDOC = function(card) {
      if (!card) return;
      const textarea = card.querySelector('.sticky-note-textarea');
      if (!textarea) return;
      const filename = (card.dataset.filename || 'sticky-note').trim().replace(/[\\/:*?"<>|]/g, '-') || 'sticky-note';
      const textColor = card.dataset.stickyTextColor || '#1e293b';
      const background = card.dataset.stickyBackground || '#fef08a';
      const fontFamily = card.dataset.stickyFontFamily || 'sans-serif';
      const fontSize = card.dataset.stickyFontSize || '14';
      const fontWeight = card.dataset.stickyFontWeight || '400';
      const fontStyle = card.dataset.stickyFontStyle || 'normal';
      const textDecoration = card.dataset.stickyTextDecoration || 'none';
      const content = escapeHTML(textarea.value || '').replace(/\n/g, '<br>');
      const boardOverlay = getStickyBoardSegments(card);
      const svgPaths = boardOverlay.segments.map(({ stroke, points }) => {
        const path = points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x} ${point.y}`).join(' ');
        return `<path d="${path}" fill="none" stroke="${stroke.color}" stroke-width="${stroke.width}" stroke-linecap="round" stroke-linejoin="round" />`;
      }).join('');
      const overlaySvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${boardOverlay.width} ${boardOverlay.height}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">${svgPaths}</svg>`;
      const docHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHTML(filename)}</title></head><body style="position:relative;overflow:hidden;background:${background};color:${textColor};font-family:${fontFamily};font-size:${fontSize}px;font-weight:${fontWeight};font-style:${fontStyle};text-decoration:${textDecoration};padding:24px;white-space:normal;">${content}${overlaySvg}</body></html>`;
      const link = document.createElement('a');
      link.download = `${filename}.doc`;
      link.href = URL.createObjectURL(new Blob([docHtml], { type: 'application/msword' }));
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 0);
    };

    function montarEGerarLeitorPdf(id, filename, paginaInicial = 1, savedProps = null) {
