<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dexi</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <meta name="description" content="Seu Codex de Conteúdos">
  
  <!-- Dependências externas: estilos utilitários, interação, PDF, React e TLDraw. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/tldraw/tldraw.css">
  <style>
    .board-text-element { pointer-events: auto; }
    .board-text-input { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
  <script type="module">
    try {
      const ReactModule = await import('https://esm.sh/react@18.3.1');
      const ReactDOMModule = await import('https://esm.sh/react-dom@18.3.1/client');
      const TldrawModule = await import('https://esm.sh/tldraw?bundle&external=react,react-dom');

      window.mountDexiTldraw = (host, persistenceKey) => {
        const root = ReactDOMModule.createRoot(host);
        root.render(ReactModule.createElement(TldrawModule.Tldraw, {
          persistenceKey,
          autoFocus: true,
          onMount: (editor) => editor.selectAll()
        }));
        return root;
      };
    } catch (error) {
      console.error('Erro ao carregar TLDraw:', error);
    }
  </script>
  <!-- API do Google para Login e Sincronização 
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  -->
  
  <script>
    tailwind.config = {
      darkMode: 'class', 
      theme: {
        extend: {
          colors: {
            gold: {
              DEFAULT: '#c9a227',
              light: '#f5e6a8',
              glow: 'rgba(201, 162, 39, 0.25)',
            }
          },
          backgroundImage: {
            'grid-light': 'linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px)',
            'grid-dark': 'linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px)',
          }
        }
      }
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  </script>
  <link rel="stylesheet" href="style.css">
 
</head>

<!-- Interface principal: barra lateral, quadro infinito, ferramentas flutuantes e modais. -->
<body class="bg-[#f8f7f4] dark:bg-[#0f172a] text-[#1e293b] dark:text-[#f8f7f4] min-h-screen overflow-hidden font-sans transition-colors duration-200 relative">

  <input type="file" id="folder-selector" multiple class="hidden" onchange="handleFolderSelection(this.files)">

  <button id="trigger-left" onclick="toggleMenu(true)" class="fixed left-0 top-1/2 -translate-y-1/2 z-40 bg-amber-500 hover:bg-amber-600 text-white p-3 rounded-r-xl shadow-lg transition-all font-bold hidden">&gt;</button>

  <div id="selection-toolbar" class="fixed top-2 sm:top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur border border-slate-800 text-white px-2.5 sm:px-5 py-2 sm:py-2.5 rounded-xl sm:rounded-2xl shadow-2xl flex flex-wrap items-center justify-center gap-1.5 sm:gap-4 transition-all duration-200 transform scale-95 opacity-0 pointer-events-none w-[95vw] sm:w-auto max-w-xl">
    <span id="selection-count" class="text-[10px] sm:text-xs font-mono font-bold text-amber-400 whitespace-nowrap">0 selecionados</span>
    <div class="hidden sm:block w-px h-4 bg-slate-700"></div>
    <button onclick="agruparSelecionados()" class="text-[10px] sm:text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-bold transition-all shadow-sm whitespace-nowrap">Agrupar</button>
    <button onclick="desagruparSelecionados()" class="text-[10px] sm:text-xs bg-slate-700 hover:bg-slate-600 text-white px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-bold transition-all shadow-sm whitespace-nowrap">Desagrupar</button>
    <button onclick="excluirSelecionados()" class="text-[10px] sm:text-xs bg-rose-600 hover:bg-rose-700 text-white px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl font-bold transition-all shadow-sm whitespace-nowrap">Excluir</button>
  </div>

  <div id="writing-toolbar" class="fixed bottom-2 left-2 right-2 sm:bottom-4 sm:left-1/2 sm:-translate-x-1/2 z-[90] hidden flex-wrap justify-center items-center gap-1 sm:gap-2 bg-slate-900/95 backdrop-blur border border-slate-700 text-white px-2 sm:px-3 py-2 rounded-xl sm:rounded-2xl shadow-2xl max-w-[calc(100vw-1rem)]">
    <button onclick="toggleBoardWriting(true); setBoardWritingMode('pen')" data-writing-mode="pen" class="writing-tool-button active w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base" title="Caneta">✏️</button>
    <button onclick="setBoardWritingMode('eraser')" data-writing-mode="eraser" class="writing-tool-button w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base" title="Borracha">🧽</button>
    <button onclick="setBoardWritingMode('select')" data-writing-mode="select" class="writing-tool-button w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base" title="Selecionar uma área">⬚</button>
    <button onclick="setBoardWritingMode('move')" data-writing-mode="move" class="writing-tool-button w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base" title="Mover pelo quadro">↔️</button>
    <button onclick="setBoardWritingMode('text')" data-writing-mode="text" class="writing-tool-button w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base" title="Teclado">⌨️</button>
    <button onclick="criarStickyNote()" class="writing-tool-button w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base" title="Criar sticky note">🗒️</button>
    <input id="board-stroke-width" type="number" min="1" max="50" value="4" class="writing-size-input w-10 h-7 sm:w-12 sm:h-8 text-xs sm:text-sm" title="Espessura do traço" aria-label="Espessura do traço">
    <input id="board-stroke-color" type="color" value="#1e293b" class="writing-color-input w-7 h-7 sm:w-8 sm:h-8" title="Cor do traço" aria-label="Cor do traço">
    <button onclick="clearBoardWriting()" class="writing-tool-button w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base" title="Apagar tudo">🗑️</button>
    <button id="download-board-selection" onclick="abrirModalDownloadFormat()" class="writing-command-button px-2 sm:px-3 py-1 sm:py-1.5 text-xs sm:text-sm rounded-lg" disabled title="Baixar seleção">Baixar</button>
    <button onclick="toggleBoardWriting(false)" class="writing-close-button px-2 sm:px-3 py-1 sm:py-1.5 text-xs sm:text-sm rounded-lg" title="Fechar Notar">Fechar</button>
  </div>

  <div class="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-2">
    <button onclick="toggleFloatingTools()" id="floating-toggle-btn" class="w-10 h-10 rounded-xl bg-white/80 dark:bg-slate-900/80 backdrop-blur border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all font-bold text-sm flex items-center justify-center shadow-xl text-slate-500 dark:text-slate-400 z-50" title="Ocultar Ferramentas">▼</button>
    <div id="floating-tools-panel" class="flex flex-col gap-2 bg-white/80 dark:bg-slate-900/80 backdrop-blur border border-slate-200 dark:border-slate-800 p-2 rounded-2xl shadow-xl transition-all duration-300 transform origin-bottom">
      <div class="w-8 h-px bg-slate-200 dark:bg-slate-700 mx-auto my-1"></div>
      <button id="multi-select-toggle" onclick="toggleMultiSelectMode()" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all font-bold text-lg flex items-center justify-center" title="Modo de multiseleção">⊛</button>
      <button onclick="changeZoom(0.1)" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-amber-500 hover:text-white transition-all font-bold text-lg flex items-center justify-center">+</button>
      <button onclick="resetZoom()" id="zoom-indicator" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all font-mono text-[10px] font-bold flex items-center justify-center">100%</button>
      <button onclick="changeZoom(-0.1)" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-amber-500 hover:text-white transition-all font-bold text-lg flex items-center justify-center">-</button>
    </div>
  </div>

  <div class="flex h-screen w-screen relative overflow-hidden">
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-[280px] bg-white/95 dark:bg-slate-900/95 backdrop-blur-md p-6 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between z-50 overflow-y-auto transition-colors duration-200 shadow-2xl transform none">
      <div>
        <div class="flex justify-between items-center mb-2">
          <button onclick="toggleMenu(false)" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-rose-500/20 hover:text-rose-500 transition-all text-slate-500 text-xs font-bold">&lt;</button>
          <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all text-slate-700 dark:text-slate-300 flex items-center justify-center text-sm font-medium">
            <span id="theme-icon-sun" class="hidden dark:inline">☀️</span>
            <span id="theme-icon-moon" class="inline dark:hidden">🌙</span>
          </button>
        </div>

        <div class="text-center mb-6">
          <img src="Dexi.png" alt="DEXI" onerror="this.src='https://placehold.co/88x88?text=DEXI'" class="w-[88px] h-auto mx-auto drop-shadow-[0_8px_18px_rgba(201, 162, 39, 0.25)]">
          <h1 class="text-2xl font-extrabold tracking-wider mt-3 mb-0.5 text-slate-900 dark:text-white">Dexi</h1>
          <p class="text-[0.72rem] tracking-[0.18em] uppercase text-slate-500 dark:text-slate-400 m-0">Codex</p>
        </div>

        <!-- BOTAO GOOGLE LOGIN PARA SINCRONIZACAO
        <div class="mb-4">
          <button id="google-login-btn" onclick="handleGoogleLogin()" class="w-full bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 transition-all text-xs flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm">
            Sincronizar
          </button>
        </div>
      -->

        <div class="flex flex-col gap-2 mb-6">
          <button onclick="triggerFolderSelector()" class="w-full bg-green-500/10 hover:bg-green-500/20 text-green-600 dark:text-green-400 font-medium py-2 px-4 rounded-xl border border-green-500/20 transition-all text-xs text-center flex items-center justify-center gap-2">Arquivar</button>
          <button onclick="colarLinkManual()" class="w-full bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 font-medium py-2 px-4 rounded-xl border border-blue-500/20 transition-all text-xs text-center flex items-center justify-center gap-2">Colar</button>
          <button onclick="toggleBoardWriting(true)" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 font-medium py-2 px-4 rounded-xl border border-amber-500/20 transition-all text-xs text-center flex items-center justify-center gap-2">Notar</button>
          <br>
          <button onclick="limparQuadro()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 font-medium py-2 px-4 rounded-xl border border-rose-500/20 transition-all text-xs text-center flex items-center justify-center gap-2">Deletar</button>
          <button onclick="abrirModalRecuperaveis()" class="w-full bg-purple-500/10 hover:bg-purple-500/20 text-purple-600 dark:text-purple-400 font-medium py-2 px-4 rounded-xl border border-purple-500/20 transition-all text-xs text-center flex items-center justify-center gap-2">Gerenciar</button>
        
      </div>

      <a href="https://github.com/Dextre-Tecnologia/Dexi" target="_blank" rel="noopener noreferrer" class="absolute bottom-4 left-4 z-10 flex h-12 w-12 items-center justify-center rounded-full bg-white/95 dark:bg-slate-900/95 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-lg shadow-slate-400/20 transition-transform duration-200 hover:scale-105 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Abrir GitHub">
        <img src="https://images.icon-icons.com/3685/PNG/512/github_logo_icon_229278.png" class="w-6 h-6" alt="GitHub">
      </a>
    </aside>

    <div id="board-wrapper" class="bg-grid-light dark:bg-grid-dark transition-all duration-200" style="background-size: 32px 32px;">
      <div id="canvas-container">
        <main class="w-full h-full relative select-none" id="canvas"></main>
        <canvas id="board-writing-layer" width="100%" height="100%" aria-label="Camada de escrita do quadro"></canvas>
        <svg id="board-writing-svg" width="100%" height="100%" aria-label="Traços do quadro"></svg>
        <div id="board-writing-selection" aria-hidden="true"></div>
        
      </div>
    </div>
  </div>

  <div id="preview-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="relative bg-white dark:bg-slate-900 border border-transparent dark:border-slate-700 rounded-2xl max-w-5xl w-full h-[90vh] flex flex-col shadow-2xl transition-all duration-200">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center shrink-0">
        <h3 id="modal-title" class="font-bold text-slate-800 dark:text-slate-200 truncate pr-4">Visualização</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-rose-500 font-bold text-xl px-2 transition-colors">&times;</button>
      </div>
      <div id="modal-content" class="p-1 flex-1 overflow-hidden bg-slate-100 dark:bg-slate-950 rounded-b-2xl flex flex-col"></div>
    </div>
  </div>

  <div id="paper-select-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="relative bg-white dark:bg-slate-900 border border-transparent dark:border-slate-700 rounded-2xl w-full max-w-sm flex flex-col shadow-2xl transition-all duration-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
        <h3 class="font-bold text-slate-800 dark:text-slate-200">Nova Nota</h3>
        <button onclick="fecharModalNota()" class="text-slate-400 hover:text-rose-500 font-bold text-xl px-2 transition-colors">&times;</button>
      </div>
      <div class="p-5 flex flex-col">
        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">Título da Nota</label>
        <input type="text" id="nota-nome-input" value="Folha Rascunho" class="mb-5 w-full text-sm px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white focus:outline-none focus:border-amber-500 transition-colors" placeholder="Nome da folha">
        
        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2">Formato da Folha</label>
        <div class="grid grid-cols-3 gap-3 mb-2">
          <button onclick="criarNotaFromModal('A4')" class="py-4 px-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 hover:bg-amber-500 hover:text-white transition-all flex flex-col items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 shadow-sm group">
            <div class="w-6 h-8 bg-white border-2 border-slate-300 dark:border-slate-600 group-hover:border-white rounded-sm transition-colors shadow-sm"></div>
            <span class="text-[11px] font-bold">A4</span>
          </button>
          <button onclick="criarNotaFromModal('Carta')" class="py-4 px-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 hover:bg-amber-500 hover:text-white transition-all flex flex-col items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 shadow-sm group">
            <div class="w-[1.6rem] h-8 bg-white border-2 border-slate-300 dark:border-slate-600 group-hover:border-white rounded-sm transition-colors shadow-sm"></div>
            <span class="text-[11px] font-bold">Carta</span>
          </button>
          <button onclick="criarNotaFromModal('Quadro')" class="py-4 px-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 hover:bg-amber-500 hover:text-white transition-all flex flex-col items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 shadow-sm group">
            <div class="w-8 h-8 bg-white border-2 border-slate-300 dark:border-slate-600 group-hover:border-white rounded-sm border-dashed transition-colors shadow-sm"></div>
            <span class="text-[11px] font-bold">Quadro</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="recuperaveis-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="relative bg-white dark:bg-slate-900 border border-transparent dark:border-slate-700 rounded-2xl w-full max-w-2xl flex flex-col shadow-2xl transition-all duration-200 overflow-hidden h-[80vh]">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
        <h3 class="font-bold text-slate-800 dark:text-slate-200">Gerenciar Itens Deletados</h3>
        <button onclick="fecharModalRecuperaveis()" class="text-slate-400 hover:text-rose-500 font-bold text-xl px-2 transition-colors">&times;</button>
      </div>
      <div id="recuperaveis-content" class="p-5 flex-1 overflow-y-auto flex flex-col gap-3">
        <p class="text-center text-slate-500 dark:text-slate-400 text-sm">Carregando...</p>
      </div>
      <div class="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 flex gap-3">
        <button id="recuperaveis-recuperar-todos" onclick="recuperarTodosDeletados()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">Recuperar Tudo</button>
        <button id="recuperaveis-limpar-todos" onclick="limparTodoHistorico()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 px-4 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">Deletar Tudo</button>
        <button onclick="fecharModalRecuperaveis()" class="flex-1 bg-slate-300 dark:bg-slate-700 hover:bg-slate-400 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold py-2 px-4 rounded-xl transition-all">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal de Escolha de Formato de Download -->
  <div id="download-format-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="relative bg-white dark:bg-slate-900 border border-transparent dark:border-slate-700 rounded-2xl w-full max-w-sm flex flex-col shadow-2xl transition-all duration-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
        <h3 class="font-bold text-slate-800 dark:text-slate-200">Escolher Formato de Download</h3>
        <button onclick="fecharModalDownloadFormat()" class="text-slate-400 hover:text-rose-500 font-bold text-xl px-2 transition-colors">&times;</button>
      </div>
      <div class="p-5 flex flex-col gap-3">
        <button onclick="executarDownloadBoard('png')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
          <span class="text-xl">🖼️</span> PNG (Alta Qualidade)
        </button>
        <button onclick="executarDownloadBoard('jpg')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
          <span class="text-xl">📷</span> JPG (Comprimido)
        </button>
        <button onclick="executarDownloadBoard('pdf')" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
          <span class="text-xl">📄</span> PDF (Documento)
        </button>
      </div>
      <div class="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-950">
        <button onclick="fecharModalDownloadFormat()" class="w-full bg-slate-300 dark:bg-slate-700 hover:bg-slate-400 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-bold py-2 px-4 rounded-xl transition-all">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="top-web-search" class="fixed left-2 right-2 top-3 z-40 max-w-[calc(100%-1rem)] sm:left-1/2 sm:right-auto sm:-translate-x-1/2 sm:w-[min(58vw,620px)]">
    <div class="flex items-center gap-2 rounded-2xl border border-slate-200/80 bg-white/90 p-2 shadow-xl backdrop-blur-md dark:border-slate-700 dark:bg-slate-900/80">
      <div id="search-engine-badge" class="flex h-9 min-w-[70px] items-center justify-center rounded-xl bg-slate-100 px-2 text-[9px] font-black uppercase tracking-[0.16em] text-slate-700 dark:bg-slate-800 dark:text-slate-200 sm:text-[10px]">Google</div>
      <input id="top-web-search-input" type="search" placeholder="Pesquisar na web..." aria-label="Pesquisar na web" class="h-10 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3 text-sm text-slate-800 placeholder:text-slate-400 focus:border-amber-500 focus:outline-none dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:placeholder:text-slate-500">
      <button id="top-web-search-btn" onclick="executarPesquisaWeb()" class="h-10 rounded-xl bg-amber-500 px-3 text-xs font-bold text-slate-900 shadow-sm transition hover:bg-amber-400 focus:outline-none sm:px-4 sm:text-sm">Buscar</button>
    </div>
  </div>

        <button id="add-favorite-btn" type="button" class="mt-2 w-full rounded-xl bg-amber-500 px-3 py-2 text-[10px] font-black uppercase tracking-[0.12em] text-slate-900 transition hover:bg-amber-400">Adicionar</button>

  <!-- FUNCIONALIDADES -->
  <script>
    // Relógio digital e seleção de fuso horário.
    // ==========================================
    // LÓGICA DO RELÓGIO DIGITAL (INÍCIO)
    // ==========================================
    const tzSelect = document.getElementById('timezone-selector');
    
    // Recupera o último fuso horário salvo pelo usuário (ou usa Brasília como padrão)
    const savedTz = localStorage.getItem('dexi_timezone');
    if (savedTz && tzSelect) {
      tzSelect.value = savedTz;
    }

    // Salva a nova preferência de fuso ao alterar o seletor
    if (tzSelect) {
      tzSelect.addEventListener('change', () => {
        localStorage.setItem('dexi_timezone', tzSelect.value);
        updateClock(); // Força a atualização imediata na troca
      });
    }

    function updateClock() {
      const clockDisplay = document.getElementById('clock-display');
      const dateDisplay = document.getElementById('date-display');
      
      if (!clockDisplay || !tzSelect || !dateDisplay) return;

      const timezone = tzSelect.value;
      const now = new Date();

      try {
        // Renderiza a hora formato 24h
        const timeString = now.toLocaleTimeString('pt-BR', { timeZone: timezone, hour12: false });
        
        // Renderiza a data (ex: sex., 18 de out.)
        const dateOptions = { timeZone: timezone, weekday: 'short', day: '2-digit', month: 'short' };
        let dateString = now.toLocaleDateString('pt-BR', dateOptions);
        
        clockDisplay.innerText = timeString;
        dateDisplay.innerText = dateString;
      } catch (e) {
        console.error("Erro ao atualizar relógio digital:", e);
      }
    }

    // Inicia a rotina de atualização (1000ms = 1 segundo)
    setInterval(updateClock, 1000);
    setTimeout(updateClock, 100); // Roda imediatamente na abertura
    // ==========================================
    // LÓGICA DO RELÓGIO DIGITAL (FIM)
    // ==========================================

    const defaultFavorites = [
      { name: 'Gmail', url: 'https://mail.google.com' },
      { name: 'Mapas', url: 'https://maps.google.com' },
      { name: 'Drive', url: 'https://drive.google.com' },
      { name: 'OneDrive', url: 'https://onedrive.live.com/' }
    ];

    function getFavoriteSites() {
      try {
        const saved = JSON.parse(localStorage.getItem('dexi_favorite_sites') || 'null');
        if (Array.isArray(saved) && saved.length) return saved;
      } catch (e) {
        console.warn('Erro ao ler favoritos:', e);
      }
      localStorage.setItem('dexi_favorite_sites', JSON.stringify(defaultFavorites));
      return defaultFavorites;
    }

    function saveFavoriteSites(items) {
      localStorage.setItem('dexi_favorite_sites', JSON.stringify(items));
    }

    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
      } catch (e) {
        return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23999"><circle cx="12" cy="12" r="10"/></svg>';
      }
    }

    function renderFavoriteSites() {
      const list = document.getElementById('favorite-sites-list');
      if (!list) return;
      const favorites = getFavoriteSites();
      list.innerHTML = favorites.map((site, index) => {
        const faviconUrl = getFaviconUrl(site.url);
        return `
        <div class="flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-2 py-2 dark:border-slate-700 dark:bg-slate-900 group hover:border-amber-300 dark:hover:border-amber-600 transition">
          <img src="${faviconUrl}" alt="${site.name}" class="w-5 h-5 rounded-sm flex-shrink-0 object-contain bg-white dark:bg-slate-800 p-0.5" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23999%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'">
          <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="flex-1 text-left text-[10px] font-bold text-slate-700 transition hover:text-amber-600 dark:text-slate-200 dark:hover:text-amber-400 truncate">${site.name}</a>
          <button type="button" data-index="${index}" class="favorite-remove-btn text-lg font-black text-slate-300 transition hover:text-rose-500 opacity-0 group-hover:opacity-100" aria-label="Remover ${site.name}">×</button>
        </div>
      `;
      }).join('');

      list.querySelectorAll('.favorite-remove-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          e.stopPropagation();
          const favorites = getFavoriteSites();
          const index = Number(button.dataset.index);
          favorites.splice(index, 1);
          saveFavoriteSites(favorites);
          renderFavoriteSites();
        });
      });
    }

    function toggleFavoriteSitesPanel() {
      const panel = document.getElementById('favorite-sites-panel');
      if (!panel) return;
      panel.classList.toggle('hidden');
    }

    document.getElementById('favorite-sites-toggle')?.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleFavoriteSitesPanel();
    });

    document.getElementById('close-favorite-panel')?.addEventListener('click', (event) => {
      event.stopPropagation();
      document.getElementById('favorite-sites-panel')?.classList.add('hidden');
    });

    document.getElementById('add-favorite-btn')?.addEventListener('click', () => {
      const nameInput = document.getElementById('favorite-name-input');
      const urlInput = document.getElementById('favorite-url-input');
      const name = nameInput?.value.trim();
      let url = urlInput?.value.trim();
      if (!name || !url) { alert('Preencha nome e URL do favorito.'); return; }
      if (!/^https?:\/\//i.test(url)) url = `https://${url}`;
      const favorites = getFavoriteSites();
      favorites.push({ name, url });
      saveFavoriteSites(favorites);
      renderFavoriteSites();
      if (nameInput) nameInput.value = '';
      if (urlInput) urlInput.value = '';
    });

    document.addEventListener('click', (event) => {
      const panel = document.getElementById('favorite-sites-panel');
      const toggle = document.getElementById('favorite-sites-toggle');
      if (panel && !panel.classList.contains('hidden') && !panel.contains(event.target) && !toggle?.contains(event.target)) {
        panel.classList.add('hidden');
      }
    });

    renderFavoriteSites();

    // ==========================================
    // Sincronização opcional com Google Drive.
    // ==========================================
    const GOOGLE_CLIENT_ID = "#"; // <--- COLOQUE SEU CLIENT ID
    
    let googleAccessToken = null;
    let driveSyncFileId = null;

    // Função de Login e Inicialização do Google Sync
    function handleGoogleLogin() {
      if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.includes("SEU_CLIENT_ID_AQUI")) {
        alert("Configuração Necessária: Para sincronizar na nuvem, você precisa inserir seu GOOGLE_CLIENT_ID no código fonte ao baixar o projeto na sua máquina para manter a segurança das suas credênciais.");
        return;
      }
      
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.appdata',
        callback: (response) => {
          if (response && response.access_token) {
            googleAccessToken = response.access_token;
            
            const btn = document.getElementById('google-login-btn');
            btn.innerHTML = '✅ Nuvem Ativa';
            btn.classList.add('border-green-500', 'text-green-600', 'dark:text-green-400');
            btn.classList.remove('text-slate-700', 'dark:text-slate-300');
            
            loadFromGoogleDrive();
          }
        },
      });
      client.requestAccessToken();
    }

    // Busca o arquivo JSON oculto no Google Drive (App Data Folder)
    async function findSyncFile() {
       try {
         const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='dexi_sync_board.json'`, {
           headers: { 'Authorization': 'Bearer ' + googleAccessToken }
         });
         const data = await res.json();
         if (data.files && data.files.length > 0) {
           driveSyncFileId = data.files[0].id;
           return driveSyncFileId;
         }
       } catch(e) { console.error(e); }
       return null;
    }

    // Carrega o quadro infinito direto da nuvem
    async function loadFromGoogleDrive() {
      const fileId = await findSyncFile();
      if (fileId) {
        driveSyncFileId = fileId;
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
           headers: { 'Authorization': 'Bearer ' + googleAccessToken }
        });
        const text = await res.text();
        if (text && text.length > 10) {
          localStorage.setItem('dexi_codex_cards', text);
          // Limpa tudo visualmente antes de carregar o novo
          document.querySelectorAll('.codex-card').forEach(c => c.remove());
          carregarEstadoDoStorage();
        }
      } else {
         // Primeira vez na nuvem, faz upload do estado local atual
         saveToGoogleDrive(localStorage.getItem('dexi_codex_cards') || '[]');
      }
    }

    // Faz upload do quadro para a nuvem
    async function saveToGoogleDrive(jsonData) {
      if (!googleAccessToken) return;
      try {
        const metadata = { name: 'dexi_sync_board.json', parents: ['appDataFolder'] };
        const file = new Blob([jsonData], { type: 'application/json' });
        
        if (!driveSyncFileId) await findSyncFile();

        const method = driveSyncFileId ? 'PATCH' : 'POST';
        const path = driveSyncFileId ? `/upload/drive/v3/files/${driveSyncFileId}` : '/upload/drive/v3/files';
        
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        const res = await fetch(`https://www.googleapis.com${path}?uploadType=multipart`, {
          method: method,
          headers: new Headers({ 'Authorization': 'Bearer ' + googleAccessToken }),
          body: form
        });
        const val = await res.json();
        if (val.id) driveSyncFileId = val.id;
      } catch (e) {
        console.error("Erro no sync de nuvem:", e);
      }
    }

    // Debounce para Sincronização Google
    let timerDriveSync = null;
    function agendarSyncDrive(data) {
       clearTimeout(timerDriveSync);
       // Aguarda 3 segundos após parar de mexer para sincronizar no Google e poupar API
       timerDriveSync = setTimeout(() => saveToGoogleDrive(data), 3000);
    }
    // ==========================================
    // FIM CONFIGURAÇÃO GOOGLE SYNC
    // ==========================================


    // Estado global do quadro: zoom, pan, seleção, toque e posição de criação.
    const canvas = document.getElementById('canvas');
    const boardWrapper = document.getElementById('board-wrapper');
    const canvasContainer = document.getElementById('canvas-container');
    
    let localizedFiles = [];
    let isPanning = false;
    let forcePanMode = false;
    let startX = 0, startY = 0;
    let panX = 0, panY = 0;
    let zoom = 1;
    let multiSelectMode = false;

    let mouseXCanvas = 200;
    let mouseYCanvas = 200;

    let touchStartDist = 0;
    let touchStartZoom = 1;
    let touchStartCenter = { x: 0, y: 0 };
    let isPinching = false;
    let isTwoFingerPanning = false;

    let boardWritingActive = false;
    let boardWritingMode = 'pen';
    let boardWritingDrawing = false;
    let boardWritingStart = null;
    let boardWritingSelection = null;
    let boardWritingSelectionSnapshot = null;
    let boardWritingCurrentStroke = [];
    let boardWritingStrokes = [];
    let boardWritingTexts = [];
    let activeStickyNote = null;
    let activeTextEditor = null;
    let boardSelectionJustCreated = false;
    const boardWritingLayer = document.getElementById('board-writing-layer');
    const boardWritingSvg = document.getElementById('board-writing-svg');
    const boardWritingSelectionEl = document.getElementById('board-writing-selection');
    const boardWritingContext = boardWritingLayer.getContext('2d');
    const boardWritingEdgeMargin = 240;
    const boardWritingGrowthStep = 2000;
    const boardWritingVirtualSize = 100000;
    let boardWritingWidth = boardWritingVirtualSize;
    let boardWritingHeight = boardWritingVirtualSize;
    let boardWritingPreviewPath = null;

    boardWritingSvg.setAttribute('width', boardWritingWidth);
    boardWritingSvg.setAttribute('height', boardWritingHeight);
    boardWritingSvg.style.width = `${boardWritingWidth}px`;
    boardWritingSvg.style.height = `${boardWritingHeight}px`;
    canvasContainer.style.width = `${boardWritingWidth}px`;
    canvasContainer.style.height = `${boardWritingHeight}px`;

    function createBoardWritingSvgPath(stroke) {
      if (!stroke.points.length) return null;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', stroke.points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x} ${point.y}`).join(' '));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', stroke.color);
      path.setAttribute('stroke-width', stroke.width);
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      return path;
    }

    function renderBoardWritingSvg() {
      boardWritingSvg.replaceChildren();
      boardWritingStrokes.forEach(stroke => {
        const path = createBoardWritingSvgPath(stroke);
        if (path) boardWritingSvg.appendChild(path);
      });
      boardWritingPreviewPath = null;
    }

    function updateBoardWritingSvgPreview(stroke) {
      if (!boardWritingPreviewPath) {
        boardWritingPreviewPath = createBoardWritingSvgPath(stroke);
        if (boardWritingPreviewPath) boardWritingSvg.appendChild(boardWritingPreviewPath);
        return;
      }
      boardWritingPreviewPath.setAttribute('d', stroke.points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x} ${point.y}`).join(' '));
      boardWritingPreviewPath.setAttribute('stroke', stroke.color);
      boardWritingPreviewPath.setAttribute('stroke-width', stroke.width);
    }

    function expandBoardWritingLayerIfNeeded(x, y) {
      const needsWidthGrowth = x >= boardWritingWidth - boardWritingEdgeMargin;
      const needsHeightGrowth = y >= boardWritingHeight - boardWritingEdgeMargin;
      if (!needsWidthGrowth && !needsHeightGrowth) return;

      if (needsWidthGrowth) boardWritingWidth += boardWritingGrowthStep;
      if (needsHeightGrowth) boardWritingHeight += boardWritingGrowthStep;
      boardWritingSvg.setAttribute('width', boardWritingWidth);
      boardWritingSvg.setAttribute('height', boardWritingHeight);
      boardWritingSvg.style.width = `${boardWritingWidth}px`;
      boardWritingSvg.style.height = `${boardWritingHeight}px`;
      canvasContainer.style.width = `${Math.max(canvasContainer.offsetWidth, boardWritingWidth)}px`;
      canvasContainer.style.height = `${Math.max(canvasContainer.offsetHeight, boardWritingHeight)}px`;
    }

    function getBoardWritingPosition(event) {
      const rect = canvasContainer.getBoundingClientRect();
      const point = event.touches ? event.touches[0] : event;
      const rawX = (point.clientX - rect.left) / zoom;
      const rawY = (point.clientY - rect.top) / zoom;
      expandBoardWritingLayerIfNeeded(rawX, rawY);
      return {
        x: Math.max(0, Math.min(boardWritingWidth, (point.clientX - rect.left) / zoom)),
        y: Math.max(0, Math.min(boardWritingHeight, (point.clientY - rect.top) / zoom))
      };
    }

    function updateBoardWritingSelection(start, end) {
      const left = Math.min(start.x, end.x);
      const top = Math.min(start.y, end.y);
      const width = Math.abs(end.x - start.x);
      const height = Math.abs(end.y - start.y);
      boardWritingSelection = { left, top, width, height };
      boardWritingSelectionEl.style.display = 'block';
      boardWritingSelectionEl.style.left = `${left}px`;
      boardWritingSelectionEl.style.top = `${top}px`;
      boardWritingSelectionEl.style.width = `${width}px`;
      boardWritingSelectionEl.style.height = `${height}px`;
      boardWritingSelectionEl.style.pointerEvents = 'none';
      const minSize = 5;
      document.getElementById('download-board-selection').disabled = width < minSize || height < minSize;
    }

    function hideBoardWritingSelection() {
      boardWritingSelectionEl.style.display = 'none';
      boardWritingSelectionEl.style.pointerEvents = 'none';
      boardWritingSelection = null;
      boardWritingSelectionSnapshot = null;
      document.getElementById('download-board-selection').disabled = true;
    }

    function drawBoardStroke(stroke) {
      if (stroke.points.length === 0) return;
      boardWritingContext.beginPath();
      boardWritingContext.moveTo(stroke.points[0].x, stroke.points[0].y);
      stroke.points.slice(1).forEach(point => boardWritingContext.lineTo(point.x, point.y));
      boardWritingContext.lineCap = 'round';
      boardWritingContext.lineJoin = 'round';
      boardWritingContext.strokeStyle = stroke.color;
      boardWritingContext.lineWidth = stroke.width;
      boardWritingContext.stroke();
    }

    function renderBoardWriting() {
      boardWritingContext.clearRect(0, 0, boardWritingLayer.width, boardWritingLayer.height);
      boardWritingStrokes.forEach(drawBoardStroke);
      renderBoardWritingSvg();
    }

    function saveBoardWriting() {
      localStorage.setItem('dexi_board_writing_strokes', JSON.stringify(boardWritingStrokes));
    }

    function saveBoardWritingTexts() {
      localStorage.setItem('dexi_board_writing_texts', JSON.stringify(boardWritingTexts));
    }

    function renderBoardWritingTexts() {
      const textElements = document.querySelectorAll('.board-text-element');
      textElements.forEach(el => {
        const textId = el.dataset.textId;
        const textData = boardWritingTexts.find(t => t.id === textId);
        if (!textData) el.remove();
      });
      boardWritingTexts.forEach(text => {
        let textEl = document.querySelector(`[data-text-id="${text.id}"]`);
        if (!textEl) {
          textEl = document.createElement('div');
          textEl.className = 'board-text-element';
          textEl.dataset.textId = text.id;
          textEl.style.position = 'absolute';
          textEl.style.left = `${text.x}px`;
          textEl.style.top = `${text.y}px`;
          textEl.style.zIndex = '40';
          textEl.innerHTML = `
            <div class="bg-white/95 dark:bg-slate-900/95 border-2 border-amber-500 rounded-lg p-2 shadow-lg backdrop-blur" 
                 onmousedown="event.stopPropagation()" 
                 ontouchstart="event.stopPropagation()">
              <textarea class="board-text-input w-40 h-24 text-sm p-2 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 resize-none focus:outline-none focus:border-amber-500" 
                        onblur="saveBoardTextElement('${text.id}')"
                        ondblclick="event.stopPropagation()">${escapeHTML(text.content)}</textarea>
              <div class="flex gap-1 mt-2">
                <button onclick="deleteBoardTextElement('${text.id}')" class="text-xs px-2 py-1 bg-rose-500 hover:bg-rose-600 text-white rounded font-bold">Deletar</button>
              </div>
            </div>
          `;
          canvasContainer.appendChild(textEl);
        }
      });
    }

    window.createBoardTextElement = function(x, y) {
      if (boardWritingMode !== 'text') return;
      const textId = Date.now().toString();
      boardWritingTexts.push({
        id: textId,
        x: x,
        y: y,
        content: ''
      });
      renderBoardWritingTexts();
      const textarea = document.querySelector(`[data-text-id="${textId}"] .board-text-input`);
      if (textarea) {
        textarea.focus();
        activeTextEditor = textarea;
      }
      saveBoardWritingTexts();
    };

    window.saveBoardTextElement = function(textId) {
      const textData = boardWritingTexts.find(t => t.id === textId);
      if (textData) {
        const textarea = document.querySelector(`[data-text-id="${textId}"] .board-text-input`);
        if (textarea) {
          textData.content = textarea.value;
          saveBoardWritingTexts();
        }
      }
      activeTextEditor = null;
    };

    window.deleteBoardTextElement = function(textId) {
      boardWritingTexts = boardWritingTexts.filter(t => t.id !== textId);
      const textEl = document.querySelector(`[data-text-id="${textId}"]`);
      if (textEl) textEl.remove();
      saveBoardWritingTexts();
    };

    function getBoardInkColor() {
      const colorInput = document.getElementById('board-stroke-color');
      if (colorInput && colorInput.value) {
        return colorInput.value;
      }
      return document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000';
    }

    function atualizarTracosPadraoPeloTema(previousDark) {
      const nextColor = document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000';
      const previousColors = previousDark ? ['#ffffff', '#fff'] : ['#000000', '#000', '#1e293b'];
      let changed = false;
      boardWritingStrokes.forEach(stroke => {
        if (previousColors.includes(String(stroke.color).toLowerCase())) {
          stroke.color = nextColor;
          changed = true;
        }
      });
      if (changed) {
        renderBoardWriting();
        saveBoardWriting();
      }
    }

    function persistBoardWritingBeforeExit() {
      if (boardWritingMode === 'pen' && boardWritingCurrentStroke.length > 0) {
        boardWritingStrokes.push({
          points: boardWritingCurrentStroke,
          color: getBoardInkColor(),
          width: Number(document.getElementById('board-stroke-width').value)
        });
        boardWritingCurrentStroke = [];
      }
      saveBoardWriting();
    }

    window.addEventListener('pagehide', persistBoardWritingBeforeExit);
    window.addEventListener('beforeunload', persistBoardWritingBeforeExit);

    function loadBoardWriting() {
      try {
        const savedStrokes = JSON.parse(localStorage.getItem('dexi_board_writing_strokes') || '[]');
        if (Array.isArray(savedStrokes)) boardWritingStrokes = savedStrokes;
      } catch (error) {
        boardWritingStrokes = [];
      }
      try {
        const savedTexts = JSON.parse(localStorage.getItem('dexi_board_writing_texts') || '[]');
        if (Array.isArray(savedTexts)) boardWritingTexts = savedTexts;
      } catch (error) {
        boardWritingTexts = [];
      }
      const furthestPoint = boardWritingStrokes.reduce((furthest, stroke) => {
        stroke.points.forEach(point => {
          furthest.x = Math.max(furthest.x, point.x);
          furthest.y = Math.max(furthest.y, point.y);
        });
        return furthest;
      }, { x: 0, y: 0 });
      expandBoardWritingLayerIfNeeded(furthestPoint.x, furthestPoint.y);
      renderBoardWriting();
      renderBoardWritingTexts();
      const legacyData = localStorage.getItem('dexi_board_writing');
      if (legacyData) {
        const image = new Image();
        image.onload = () => boardWritingContext.drawImage(image, 0, 0);
        image.src = legacyData;
      }
    }

    function selecionarStickyNote(card) {
      activeStickyNote = card;
    }

    window.aplicarEstiloSticky = function(card, property, value) {
      if (!card) return;
      const textarea = card.querySelector('.sticky-note-textarea');
      const body = card.querySelector('.sticky-note-body');
      if (!textarea || !body) return;
      const datasetKey = {
        background: 'stickyBackground',
        color: 'stickyTextColor',
        fontFamily: 'stickyFontFamily',
        fontSize: 'stickyFontSize',
        fontWeight: 'stickyFontWeight',
        fontStyle: 'stickyFontStyle',
        textDecoration: 'stickyTextDecoration'
      }[property];
      if (datasetKey) card.dataset[datasetKey] = value;
      if (property === 'background') body.style.backgroundColor = value;
      if (property === 'color') textarea.style.color = value;
      if (property === 'fontFamily') textarea.style.fontFamily = value;
      if (property === 'fontSize') textarea.style.fontSize = `${value}px`;
      if (property === 'fontWeight') textarea.style.fontWeight = value;
      if (property === 'fontStyle') textarea.style.fontStyle = value;
      if (property === 'textDecoration') textarea.style.textDecoration = value;
      salvarEstadoNoStorage();
    };

    window.alternarEstiloSticky = function(card, property) {
      if (!card) return;
      const textarea = card.querySelector('.sticky-note-textarea');
      if (!textarea) return;
      const values = {
        fontWeight: ['400', '700'],
        fontStyle: ['normal', 'italic'],
        textDecoration: ['none', 'underline']
      }[property];
      const nextValue = textarea.style[property] === values[1] ? values[0] : values[1];
      aplicarEstiloSticky(card, property, nextValue);
      const button = card.querySelector(`[data-sticky-style="${property}"]`);
      if (button) button.classList.toggle('active', nextValue === values[1]);
    };

    window.toggleBoardWriting = function(active) {
      boardWritingActive = active;
      localStorage.setItem('dexi_board_writing_active', active ? 'true' : 'false');
      document.getElementById('writing-toolbar').classList.toggle('hidden', !active);
      document.getElementById('writing-toolbar').classList.toggle('flex', active);
      boardWritingLayer.style.pointerEvents = active ? 'auto' : 'none';
      boardWritingSvg.style.pointerEvents = active ? 'auto' : 'none';
      boardWrapper.style.cursor = active ? 'crosshair' : '';
      if (!active) {
        boardWritingDrawing = false;
        boardWritingSelectionEl.style.display = 'none';
        boardWritingSelection = null;
        document.getElementById('download-board-selection').disabled = true;
      }
      setBoardWritingMode('pen');
    };

    window.setBoardWritingMode = function(mode) {
      boardWritingMode = mode;
      document.querySelectorAll('[data-writing-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.writingMode === mode);
      });
      boardWritingLayer.style.pointerEvents = 'none';
      boardWritingSvg.style.pointerEvents = mode === 'text' ? 'none' : (boardWritingActive ? 'auto' : 'none');
      if (mode === 'move') {
        boardWritingSvg.style.cursor = 'grab';
        boardWrapper.style.cursor = 'grab';
        return;
      }
      boardWritingSvg.style.cursor = mode === 'select' ? 'crosshair' : (mode === 'eraser' ? 'cell' : (mode === 'text' ? 'text' : 'crosshair'));
      if (mode === 'pen' && boardWritingActive) {
        boardWritingSvg.style.pointerEvents = 'auto';
        boardWrapper.style.cursor = 'crosshair';
      }
    };

    function startBoardWriting(event) {
      if (!boardWritingActive) return;
      if (event.touches && event.touches.length > 1) {
        boardWritingDrawing = false;
        boardWritingCurrentStroke = [];
        return;
      }
      event.stopPropagation();
      if (event.cancelable) event.preventDefault();
      const position = getBoardWritingPosition(event);
      boardWritingStart = position;
      boardWritingDrawing = true;
      if (boardWritingMode === 'text') {
        if (activeTextEditor) {
          saveBoardTextElement(activeTextEditor.closest('.board-text-element').dataset.textId);
        }
        createBoardTextElement(position.x, position.y);
        return;
      }
      if (boardWritingMode === 'eraser') {
        eraseBoardWritingAt(position);
        return;
      }
      if (boardWritingMode === 'select') {
        updateBoardWritingSelection(position, position);
        return;
      }
      if (boardWritingMode === 'move') {
        isPanning = true;
        const pageX = event.touches ? event.touches[0].pageX : event.pageX;
        const pageY = event.touches ? event.touches[0].pageY : event.pageY;
        startX = pageX - panX;
        startY = pageY - panY;
        return;
      }
      boardWritingCurrentStroke = [position];
    }

    function eraseBoardWritingAt(position) {
      const eraserRadius = Math.max(8, Number(document.getElementById('board-stroke-width').value) * 2);
      const remainingStrokes = boardWritingStrokes.filter(stroke => {
        const hitRadius = eraserRadius + (stroke.width / 2);
        return !stroke.points.some(point => {
          const dx = point.x - position.x;
          const dy = point.y - position.y;
          return (dx * dx) + (dy * dy) <= hitRadius * hitRadius;
        });
      });
      if (remainingStrokes.length !== boardWritingStrokes.length) {
        boardWritingStrokes = remainingStrokes;
        renderBoardWriting();
        saveBoardWriting();
      }
    }

    function moveBoardWriting(event) {
      if (!boardWritingDrawing) return;
      event.stopPropagation();
      if (event.cancelable) event.preventDefault();
      if (boardWritingMode === 'text' || boardWritingMode === 'move') {
        if (boardWritingMode === 'move') {
          const pageX = event.touches ? event.touches[0].pageX : event.pageX;
          const pageY = event.touches ? event.touches[0].pageY : event.pageY;
          panX = pageX - startX;
          panY = pageY - startY;
          updateTransform();
        }
        return;
      }
      const position = getBoardWritingPosition(event);
      if (boardWritingMode === 'eraser') {
        eraseBoardWritingAt(position);
        return;
      }
      if (boardWritingMode === 'select') {
        updateBoardWritingSelection(boardWritingStart, position);
        return;
      }
      boardWritingCurrentStroke.push(position);
      const previewStroke = {
        points: boardWritingCurrentStroke,
        color: getBoardInkColor(),
        width: Number(document.getElementById('board-stroke-width').value)
      };
      updateBoardWritingSvgPreview(previewStroke);
    }

    function stopBoardWriting(event) {
      if (!boardWritingDrawing) return;
      if (event) event.stopPropagation();
      boardWritingDrawing = false;
      if (boardWritingMode === 'select' && boardWritingSelection) {
        boardSelectionJustCreated = true;
      }
      if (boardWritingMode === 'pen' && boardWritingCurrentStroke.length > 0) {
        boardWritingStrokes.push({
          points: boardWritingCurrentStroke,
          color: getBoardInkColor(),
          width: Number(document.getElementById('board-stroke-width').value)
        });
        renderBoardWriting();
        saveBoardWriting();
      }
      if (boardWritingMode === 'move') {
        isPanning = false;
      }
      boardWritingCurrentStroke = [];
    }

    boardWrapper.addEventListener('mousedown', startBoardWriting);
    boardWrapper.addEventListener('mousemove', moveBoardWriting);
    boardWrapper.addEventListener('mouseup', stopBoardWriting);
    boardWrapper.addEventListener('mouseleave', stopBoardWriting);
    boardWrapper.addEventListener('touchstart', startBoardWriting, { passive: false });
    boardWrapper.addEventListener('touchmove', moveBoardWriting, { passive: false });
    boardWrapper.addEventListener('touchend', stopBoardWriting, { passive: false });

    window.clearBoardWriting = function() {
      // Salva os traços e textos antes de limpar
      if (boardWritingStrokes.length > 0 || boardWritingTexts.length > 0) {
        const timestamp = new Date().toLocaleString('pt-BR');
        const clearedItem = {
          id: Date.now(),
          type: 'drawing',
          timestamp: timestamp,
          strokes: JSON.parse(JSON.stringify(boardWritingStrokes)),
          texts: JSON.parse(JSON.stringify(boardWritingTexts)),
          title: `Desenho (${boardWritingStrokes.length} traço${boardWritingStrokes.length > 1 ? 's' : ''} + ${boardWritingTexts.length} texto${boardWritingTexts.length > 1 ? 's' : ''})`
        };
        deletedItems.unshift(clearedItem);
        if (deletedItems.length > MAX_DELETED_ITEMS) {
          deletedItems = deletedItems.slice(0, MAX_DELETED_ITEMS);
        }
        try {
          localStorage.setItem('dexi_deleted_items', JSON.stringify(deletedItems));
        } catch (e) {
          console.warn("Erro ao salvar histórico de deletados:", e);
        }
      }
      
      boardWritingStrokes = [];
      boardWritingTexts = [];
      boardWritingCurrentStroke = [];
      boardWritingContext.clearRect(0, 0, boardWritingLayer.width, boardWritingLayer.height);
      renderBoardWritingSvg();
      document.querySelectorAll('.board-text-element').forEach(el => el.remove());
      localStorage.removeItem('dexi_board_writing_strokes');
      localStorage.removeItem('dexi_board_writing_texts');
      hideBoardWritingSelection();
    };

    window.downloadBoardSelection = function() {
      const selection = boardWritingSelection || boardWritingSelectionSnapshot;
      console.log("downloadBoardSelection chamada");
      console.log("selection:", selection);
      console.log("boardWritingStrokes:", boardWritingStrokes.length);
      
      const minSelectionSize = 5;
      if (!selection || selection.width < minSelectionSize || selection.height < minSelectionSize) {
        console.error("Seleção inválida:", selection);
        alert("⚠️ Selecione uma área maior para baixar!");
        return null;
      }
      
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = Math.ceil(selection.width);
      finalCanvas.height = Math.ceil(selection.height);
      const finalContext = finalCanvas.getContext('2d');
      if (!finalContext) {
        console.error("Contexto 2D não disponível");
        return null;
      }
      
      finalContext.fillStyle = '#ffffff';
      finalContext.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
      
      if (!boardWritingStrokes || boardWritingStrokes.length === 0) {
        console.log("Nenhum traço para desenhar");
        return finalCanvas;
      }
      
      const selectionStrokes = boardWritingStrokes.filter(stroke => {
        if (!stroke.points || stroke.points.length === 0) return false;
        return stroke.points.some(point => 
          point.x >= selection.left &&
          point.x <= selection.left + selection.width &&
          point.y >= selection.top &&
          point.y <= selection.top + selection.height
        );
      });
      
      console.log("Traços selecionados:", selectionStrokes.length);
      
      selectionStrokes.forEach(stroke => {
        if (stroke.points.length === 0) return;
        const exportedStrokeColor = (stroke.color && (stroke.color.toLowerCase() === '#ffffff' || stroke.color.toLowerCase() === '#fff')) ? '#000000' : (stroke.color || '#000000');
        finalContext.beginPath();
        finalContext.moveTo(
          stroke.points[0].x - selection.left,
          stroke.points[0].y - selection.top
        );
        stroke.points.slice(1).forEach(point => {
          finalContext.lineTo(
            point.x - selection.left,
            point.y - selection.top
          );
        });
        finalContext.lineCap = 'round';
        finalContext.lineJoin = 'round';
        finalContext.strokeStyle = exportedStrokeColor;
        finalContext.lineWidth = stroke.width || 2;
        finalContext.stroke();
      });
      
      console.log("Canvas criado com sucesso");
      return finalCanvas;
    };

    window.abrirModalDownloadFormat = function() {
      console.log("Abrindo modal de download");
      const activeSelection = boardWritingSelection || boardWritingSelectionSnapshot;
      console.log("boardWritingSelection:", activeSelection);
      
      const minSelectionSize = 5;
      if (!activeSelection || activeSelection.width < minSelectionSize || activeSelection.height < minSelectionSize) {
        alert("⚠️ Nenhuma seleção válida. Faça uma seleção maior primeiro!");
        return;
      }

      boardWritingSelectionSnapshot = { ...activeSelection };
      document.getElementById('download-format-modal').classList.remove('hidden');
    };

    window.fecharModalDownloadFormat = function() {
      console.log("Fechando modal de download");
      document.getElementById('download-format-modal').classList.add('hidden');
    };

    window.executarDownloadBoard = function(format) {
      console.log("Executando download no formato:", format);
      
      try {
        const canvas = downloadBoardSelection();
        if (!canvas) {
          console.error("Canvas não foi criado");
          alert("Erro: não foi possível criar a imagem");
          return;
        }
        
        console.log("Canvas criado, size:", canvas.width, "x", canvas.height);
        
        fecharModalDownloadFormat();
        
        const timestamp = Date.now();
        
        if (format === 'png') {
          try {
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `dexi-nota-${timestamp}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            console.log("PNG baixado");
            hideBoardWritingSelection();
          } catch (e) {
            console.error("Erro ao gerar PNG:", e);
            alert("Erro ao gerar PNG: " + e.message);
          }
        } else if (format === 'jpg') {
          try {
            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            link.download = `dexi-nota-${timestamp}.jpg`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            console.log("JPG baixado");
            hideBoardWritingSelection();
          } catch (e) {
            console.error("Erro ao gerar JPG:", e);
            alert("Erro ao gerar JPG: " + e.message);
          }
        } else if (format === 'pdf') {
          try {
            if (!window.jspdf || !window.jspdf.jsPDF) {
              alert('Erro: jsPDF não está disponível');
              console.error("jsPDF não disponível");
              return;
            }
            
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const width = canvas.width;
            const height = canvas.height;
            const ratio = width / height;
            
            // Calcula dimensões para caber no A4
            let pdfWidth = 190; // margem de 10mm
            let pdfHeight = pdfWidth / ratio;
            
            if (pdfHeight > 277) {
              pdfHeight = 277;
              pdfWidth = pdfHeight * ratio;
            }
            
            const xOffset = (210 - pdfWidth) / 2;
            const yOffset = (297 - pdfHeight) / 2;
            
            pdf.addImage(imgData, 'JPEG', xOffset, yOffset, pdfWidth, pdfHeight);
            pdf.save(`dexi-nota-${timestamp}.pdf`);
            console.log("PDF baixado");
            hideBoardWritingSelection();
          } catch (e) {
            console.error("Erro ao gerar PDF:", e);
            alert("Erro ao gerar PDF: " + e.message);
          }
        }
      } catch (e) {
        console.error("Erro geral ao baixar:", e);
        alert("Erro ao baixar: " + e.message);
      }
    };

    loadBoardWriting();
    if (localStorage.getItem('dexi_board_writing_active') === 'true') {
      toggleBoardWriting(true);
    }

    // Configurações das folhas usadas pelas notas locais e pelo editor TLDraw.
    const paperConfigs = {
        'A4': { canvasW: 794, canvasH: 1123, cssW: 340, cssH: 481, cardW: 400, cardH: 565 },
        'Carta': { canvasW: 816, canvasH: 1056, cssW: 340, cssH: 440, cardW: 400, cardH: 520 },
        'Quadro': { canvasW: 4000, canvasH: 4000, cssW: 2000, cssH: 2000, cardW: 600, cardH: 500 }
    };

    // IndexedDB guarda arquivos binários, como PDFs e vídeos, fora do localStorage.
    let db;
    const dbRequest = indexedDB.open("DexiDatabase", 2);
    dbRequest.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("pdfs")) db.createObjectStore("pdfs");
      if (!db.objectStoreNames.contains("media")) db.createObjectStore("media");
    };
    dbRequest.onsuccess = (e) => {
      db = e.target.result;
      carregarEstadoDoStorage();
    };
    dbRequest.onerror = (e) => { console.error("Erro ao abrir IndexedDB", e); };

    function guardarPdfNoDb(id, blob) {
      if (!db) return;
      const transaction = db.transaction(["pdfs"], "readwrite");
      transaction.objectStore(["pdfs"]).put(blob, id);
    }

    function removerPdfDoDb(id) {
      if (!db) return;
      const transaction = db.transaction(["pdfs"], "readwrite");
      transaction.objectStore(["pdfs"]).delete(id);
    }

    function guardarMediaNoDb(id, blob) {
      if (!db) return;
      const transaction = db.transaction(["media"], "readwrite");
      transaction.objectStore(["media"]).put(blob, id);
    }

    function removerMediaDoDb(id) {
      if (!db) return;
      const transaction = db.transaction(["media"], "readwrite");
      transaction.objectStore(["media"]).delete(id);
    }

    // Navegação do quadro infinito: zoom, arraste, pinça e coordenadas do mouse.
    function updateTransform() {
      canvasContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      boardWrapper.style.backgroundPosition = `${panX}px ${panY}px`;
      boardWrapper.style.backgroundSize = `${32 * zoom}px ${32 * zoom}px`;
      document.getElementById('zoom-indicator').innerText = `${Math.round(zoom * 100)}%`;
    }

    function handleWheel(e) {
      if (boardWritingActive && e.target === boardWritingSvg && (Math.abs(e.deltaX) > 0 || Math.abs(e.deltaY) > 0)) {
        e.preventDefault();
        panX -= e.deltaX;
        panY -= e.deltaY;
        updateTransform();
        return;
      }
      if (e.target.closest('.drawing-canvas') || e.target.closest('.scroll-container-a4') || e.target.closest('textarea')) return; 
      e.preventDefault();
      const zoomFactor = 1.1;
      let newZoom = zoom;

      if (e.deltaY < 0) {
        newZoom = Math.min(zoom * zoomFactor, 3);
      } else {
        newZoom = Math.max(zoom / zoomFactor, 0.15);
      }

      const rect = boardWrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      panX = mouseX - (mouseX - panX) * (newZoom / zoom);
      panY = mouseY - (mouseY - panY) * (newZoom / zoom);
      zoom = newZoom;
      
      updateTransform();
    }
    boardWrapper.addEventListener('wheel', handleWheel, { passive: false });

    function getTouchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getTouchCenter(e) {
      return {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
      };
    }

    window.changeZoom = function(delta) {
      let newZoom = zoom + delta;
      newZoom = Math.max(0.15, Math.min(newZoom, 3));
      const width = window.innerWidth;
      const height = window.innerHeight;
      panX = width / 2 - (width / 2 - panX) * (newZoom / zoom);
      panY = height / 2 - (height / 2 - panY) * (newZoom / zoom);
      zoom = newZoom;
      updateTransform();
    }
    window.resetZoom = function() {
      zoom = 1; panX = 0; panY = 0;
      updateTransform();
    }
    
    window.toggleSidebarState = function() {
      const isVisible = localStorage.getItem('dexi_menu_visible') === 'true';
      toggleMenu(!isVisible);
    }
    
    window.toggleFloatingTools = function() {
      const panel = document.getElementById('floating-tools-panel');
      const btn = document.getElementById('floating-toggle-btn');
      
      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        panel.classList.add('flex');
        btn.innerText = '▼';
        btn.setAttribute('title', 'Ocultar Ferramentas');
      } else {
        panel.classList.add('hidden');
        panel.classList.remove('flex');
        btn.innerText = '▲';
        btn.setAttribute('title', 'Mostrar Ferramentas');
      }
    }

    window.togglePanMode = function() {
      forcePanMode = !forcePanMode;
      const btn = document.getElementById('pan-mode-toggle');
      if (forcePanMode) {
        btn.classList.add('bg-amber-500', 'text-white');
        btn.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
      } else {
        btn.classList.remove('bg-amber-500', 'text-white');
        btn.classList.add('bg-slate-100', 'dark:bg-slate-800', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
      }
    }

    function startPan(e) {
      if (boardWritingActive && (!e.touches || e.touches.length < 2)) {
        isPanning = false;
        return;
      }
      if (e.touches && e.touches.length === 2) {
        touchStartCenter = getTouchCenter(e);
        startX = touchStartCenter.x - panX;
        startY = touchStartCenter.y - panY;
        if (boardWritingActive) {
          isPanning = true;
          isPinching = false;
          isTwoFingerPanning = true;
        } else {
          isPanning = false;
          isPinching = true;
          isTwoFingerPanning = false;
          touchStartDist = getTouchDist(e);
          touchStartZoom = zoom;
        }
        e.preventDefault();
        return;
      }
      isPinching = false;
      isTwoFingerPanning = false;

      if (!forcePanMode) {
        if (e.target.closest('.codex-card') || e.target.closest('aside') || e.target.closest('button') || e.target.closest('input') || e.target.closest('a') || e.target.closest('canvas') || e.target.closest('textarea') || e.target.closest('embed') || e.target.closest('iframe')) {
          isPanning = false; return;
        }
      } else {
        if (e.target.closest('aside') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) {
          isPanning = false; return;
        }
      }

      isPanning = true;
      const pageX = e.touches ? e.touches[0].pageX : e.pageX;
      const pageY = e.touches ? e.touches[0].pageY : e.pageY;
      startX = pageX - panX;
      startY = pageY - panY;
    }

    function doPan(e) {
      if (e.touches && e.touches.length === 2 && isTwoFingerPanning) {
        e.preventDefault();
        const currentCenter = getTouchCenter(e);
        panX += currentCenter.x - touchStartCenter.x;
        panY += currentCenter.y - touchStartCenter.y;
        touchStartCenter = currentCenter;
        updateTransform();
        return;
      }
      if (e.touches && e.touches.length === 2 && isPinching) {
        e.preventDefault();
        const currentDist = getTouchDist(e);
        const currentCenter = getTouchCenter(e);
        
        let newZoom = touchStartZoom * (currentDist / touchStartDist);
        newZoom = Math.max(0.15, Math.min(newZoom, 3));
        
        const rect = boardWrapper.getBoundingClientRect();
        const centerCanvasX = currentCenter.x - rect.left;
        const centerCanvasY = currentCenter.y - rect.top;
        
        const zoomFactor = newZoom / zoom;
        panX = centerCanvasX - (centerCanvasX - panX) * zoomFactor;
        panY = centerCanvasY - (centerCanvasY - panY) * zoomFactor;
        
        const dx = currentCenter.x - touchStartCenter.x;
        const dy = currentCenter.y - touchStartCenter.y;
        panX += dx;
        panY += dy;

        touchStartCenter = currentCenter;
        zoom = newZoom;
        updateTransform();
        return;
      }

      if (!isPanning) return;
      const pageX = e.touches ? e.touches[0].pageX : e.pageX;
      const pageY = e.touches ? e.touches[0].pageY : e.pageY;
      panX = pageX - startX;
      panY = pageY - startY;
      updateTransform();
    }

      isPanning = false; 
      isPinching = false;
      isTwoFingerPanning = false;
    }

    window.dragStartLink = function(e) {
      draggedLinkItem = e.target.closest('.link-item-row');

    window.dragOverLink = function(e) {
      e.preventDefault(); 
      const overItem = e.target.closest('.link-item-row');
      if (!overItem || overItem === draggedLinkItem || !draggedLinkItem) return;
      
      const container = overItem.parentElement;
      const rect = overItem.getBoundingClientRect();
      const isAfter = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
      
      if (isAfter) {
        container.insertBefore(draggedLinkItem, overItem.nextSibling);
      } else {
        container.insertBefore(draggedLinkItem, overItem);
      }
    }

        container.insertBefore(item, item.previousElementSibling);
      } else if (direcao === 1 && item.nextElementSibling) {
        container.insertBefore(item.nextElementSibling, item);
      }
      salvarEstadoNoStorage();

    // Leitura de arquivos locais e criação de cards para texto, imagens, áudio, vídeo e PDF.
    async function processAndCreateCard(file) {
      const fileNameLower = file.name.toLowerCase();
      const extension = file.name.includes('.') ? file.name.split('.').pop().toUpperCase() : 'ARQUIVO';
      let bodyHtml = '';

      if (fileNameLower.endsWith('.txt') || fileNameLower.endsWith('.md')) {
        const text = await file.text();
        bodyHtml = `<div class="p-4 text-sm h-full overflow-y-auto text-slate-700 dark:text-slate-300 font-mono bg-slate-50/50 dark:bg-slate-950/50 whitespace-pre-wrap" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">${escapeHTML(text)}</div>`;
        createCard(extension, file.name, bodyHtml);
      }
      else if (/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(fileNameLower)) {
        bodyHtml = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            resolve(`<div class="bg-slate-100 dark:bg-slate-950 overflow-hidden h-full flex items-center justify-center cursor-pointer" onclick="openModal('${file.name}', '<img src=\\'${e.target.result}\\' class=\\'max-w-full max-h-[75vh] mx-auto object-contain\\'>')">
                        <img src="${e.target.result}" alt="${file.name}" class="w-full h-full object-contain">
                      </div>`);
          };
          reader.readAsDataURL(file);
        });
        createCard(extension, file.name, bodyHtml, 320);
      }
      else if (/\.(mp4|webm|ogg|mov)$/i.test(fileNameLower)) {
        const mediaId = "video_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        guardarMediaNoDb(mediaId, file); 
        const videoUrl = URL.createObjectURL(file);
        bodyHtml = `<div class="w-full h-full bg-slate-950 flex items-center justify-center" data-mediasourceid="${mediaId}" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
                      <video src="${videoUrl}" controls class="w-full h-full object-contain pointer-events-auto"></video>
                    </div>`;
        createCard(extension, file.name, bodyHtml, 360);
      }
      else if (/\.(mp3|wav|ogg|m4a|flac)$/i.test(fileNameLower)) {
        bodyHtml = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            resolve(`<div class="p-4 bg-slate-50 dark:bg-slate-950 h-full flex flex-col justify-center items-center gap-2" onmousedown="event.stopPropagation();" ontouchstart="event.stopPropagation();">
                        <span class="text-[2rem]">🎵</span>
                        <audio src="${e.target.result}" controls class="w-full pointer-events-auto"></audio>
                      </div>`);
          };
          reader.readAsDataURL(file);
        });
        createCard(extension, file.name, bodyHtml, 300);
      }
      else if (fileNameLower.endsWith('.pdf')) {
        const pdfId = "pdf_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
        guardarPdfNoDb(pdfId, file); 
        montarEGerarLeitorPdf(pdfId, file.name, 1);
      }
      else {
        bodyHtml = `<div class="p-5 text-center bg-slate-50 dark:bg-slate-950/40 h-full flex flex-col justify-center items-center">
                      <p class="text-xs text-slate-400 mb-2">Arquivo carregado na sessão.</p>
                      <span class="text-xs font-mono text-slate-600 dark:text-slate-400 bg-slate-500/10 px-2 py-1 rounded border border-slate-500/20">${file.type || 'Binary/Data'}</span>
                    </div>`;
        createCard(extension, file.name, bodyHtml, 260);
      }
    }
